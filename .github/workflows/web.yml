# テストを回し、Web 版（WebAssembly）を組み立てて Cloudflare Pages に置く。
#   main への push → 本番（https://narfi.pages.dev など）
#   ほかのブランチ（v2 など）への push → プレビュー（https://<ブランチ>.narfi.pages.dev）
#   pull request → テストと組み立てだけ（デプロイしない）
name: test & deploy

on:
  push:
    branches: [main, v2]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: narfi
    steps:
      - uses: actions/checkout@v7

      - name: Rust（stable と wasm32）
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: テスト（kernel 単体・正しい証明／通ってはいけない証明・エディタの往復）
        run: cargo test

      - name: Web 版を組み立てる（site/）
        run: ./scripts/build-site.sh

      - name: ブラウザ版の検査器がローカル版と同じ結果を返すか
        run: node tests/wasm_smoke.mjs site/narfi.wasm target/debug/narfi

      - name: Cloudflare Pages にデプロイ
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # プロジェクトがまだなければ作る（あればエラーになるので無視する）
          npx --yes wrangler pages project create narfi --production-branch=main || true
          npx --yes wrangler pages deploy site --project-name=narfi --branch="${GITHUB_REF_NAME}" --commit-dirty=true
