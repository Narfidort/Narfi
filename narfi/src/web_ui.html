  document.getElementById("rawAsciiArea").value = serializeDocToAscii();
  updateAutocomplete();
}

function setCursor(seqId, offset, lineIdx = null) {
  if (!extendingSel) selAnchor = null;
  if (lineIdx !== null) cursor.lineIdx = lineIdx;
  else {
    const root = getRootSeq(seqMap.get(seqId));
    if (root) {
      const idx = docLines.findIndex(l => l.rootSeq.id === root.id);
      if (idx >= 0) cursor.lineIdx = idx;
    }
  }
  const seq = seqMap.get(seqId);
  if (!seq) return;
  cursor.seqId = seqId;
  cursor.offset = Math.max(0, Math.min(offset, seq.items.length));
  renderEditor();
  renderGoalInspector();
}

function getRootSeq(seq) {
  let cur = seq;
  while (cur && cur.parentNode && cur.parentNode.parentSeq) {
    cur = cur.parentNode.parentSeq;
  }
  return cur;
}

// クリック位置（要素と x 座標）から、カーソルの位置を求める
function hitTestPos(target, clientX) {
  const itemEl = target.closest("[data-seq][data-idx]");
  if (itemEl) {
    const seqId = Number(itemEl.getAttribute("data-seq"));
    const idx = Number(itemEl.getAttribute("data-idx"));
    const seq = seqMap.get(seqId);
    const it = seq && seq.items[idx];
    if (it && (it.kind === "char" || it.kind === "sym")) {
      const rect = itemEl.getBoundingClientRect();
      return { seqId, offset: (clientX - rect.left) > (rect.width / 2) ? idx + 1 : idx };
    }
  }
  const slotEl = target.closest("[data-slot-seq]");
  if (slotEl) {
    const seqId = Number(slotEl.getAttribute("data-slot-seq"));
    const seq = seqMap.get(seqId);
    if (seq) return { seqId, offset: seq.items.length };
  }
  const lineEl = target.closest("[data-line-idx]");
  if (lineEl) {
    const lineIdx = Number(lineEl.getAttribute("data-line-idx"));
    const ln = docLines[lineIdx];
    if (ln) return { seqId: ln.rootSeq.id, offset: ln.rootSeq.items.length, lineIdx };
  }
  return null;
}

function setCursorExtending(p) {
  extendingSel = true;
  try { setCursor(p.seqId, p.offset, p.lineIdx ?? null); } finally { extendingSel = false; }
}

// Mouse click / shift+click / drag
editorSurface.addEventListener("mousedown", (e) => {
  editorSurface.focus();
  // ダブル・トリプルクリックは、上の単語・行の選択に任せる
  if (e.button === 0 && e.detail >= 2) { e.preventDefault(); return; }
  const p = hitTestPos(e.target, e.clientX);
  if (!p) return;
  e.preventDefault();
  if (e.shiftKey) {
    if (!selAnchor) selAnchor = { seqId: cursor.seqId, offset: cursor.offset };
    setCursorExtending(p);
    return;
  }
  setCursor(p.seqId, p.offset, p.lineIdx ?? null);
  if (e.button === 0) dragStart = { seqId: p.seqId, offset: p.offset };
});

// ダブルクリックで単語、トリプルクリックで行を選ぶ
editorSurface.addEventListener("mousedown", (e) => {
  if (e.button !== 0 || e.detail < 2) return;
  const p = hitTestPos(e.target, e.clientX);
  if (!p) return;
  const seq = seqMap.get(p.seqId);
  if (!seq) return;
  if (e.detail === 2) {
    const [a, b] = wordRangeAt(seq, p.offset);
    if (a === b) return;
    selAnchor = { seqId: seq.id, offset: a };
    extendingSel = true;
    try { setCursor(seq.id, b, p.lineIdx ?? null); } finally { extendingSel = false; }
  } else {
    const li = p.lineIdx ?? cursor.lineIdx;
    const root = docLines[li].rootSeq;
    selAnchor = { seqId: root.id, offset: 0 };
    extendingSel = true;
    try { setCursor(root.id, root.items.length, li); } finally { extendingSel = false; }
  }
  dragStart = null;
  renderEditor();
});


// 右クリック：その行の証明木など
editorSurface.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  // 補完の候補は閉じる（メニューと重ならないように）
  acPopup.style.display = "none";
  acMatches = [];
  const line = cursor.lineIdx + 1;
  const decl = declAtLine(line);
  const items = [];
  if (decl && decl.tree) items.push({ label: "証明木を見る（自然演繹）", run: () => showDerivation(decl, line) });
  if (decl && !decl.is_axiom && decl.latex_env) items.push({ label: "この定理を LaTeX でコピー", run: () => { navigator.clipboard.writeText(decl.latex_env); uiToast("コピーしました"); } });
  if (items.length === 0) items.push({ label: decl && decl.status === "error" ? "証明が通ると、証明木が見られます" : "定理の中で右クリックすると、証明木が見られます", run: () => {} });
  showCtxMenu(e.clientX, e.clientY, items);
});

function declAtLine(line) {
  let d = null;
  for (const x of (lastCheckData && lastCheckData.decls) || []) if (x.line <= line) d = x;
  return d;
}
window.addEventListener("mousemove", (e) => {
  if (!dragStart) return;
  if (!(e.buttons & 1)) { dragStart = null; return; }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (!el || !editorSurface.contains(el)) return;
  const p = hitTestPos(el, e.clientX);
  if (!p || (p.seqId === cursor.seqId && p.offset === cursor.offset)) return;
  if (!selAnchor) selAnchor = { ...dragStart };
  setCursorExtending(p);
});
window.addEventListener("mouseup", () => { dragStart = null; });

// ================================================================
// 7. Tree Cursor Navigation & Structural Editing (Mathcha Behavior)
// ================================================================

function moveCursorLeft() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  if (cursor.offset > 0) {
    const prev = seq.items[cursor.offset - 1];
    if (prev.kind === "frac" || prev.kind === "binom") {
      setCursor(prev.den.id, prev.den.items.length);
    } else if (prev.kind === "bigop") {
      setCursor(prev.body.id, prev.body.items.length);
    } else if (prev.body) {
      setCursor(prev.body.id, prev.body.items.length);
    } else {
      setCursor(seq.id, cursor.offset - 1);
    }
  } else if (seq.parentNode && seq.parentNode.parentSeq) {
    const pNode = seq.parentNode;
    const pSeq = pNode.parentSeq;
    const idx = pSeq.items.indexOf(pNode);
    if ((pNode.kind === "frac" || pNode.kind === "binom") && seq.slotName === "den") {
      setCursor(pNode.num.id, pNode.num.items.length);
    } else if (pNode.kind === "bigop" && seq.slotName === "body") {
      setCursor(pNode.sup.id, pNode.sup.items.length);
    } else if (pNode.kind === "bigop" && seq.slotName === "sup") {
      setCursor(pNode.sub.id, pNode.sub.items.length);
    } else if (idx >= 0) {
      setCursor(pSeq.id, idx);
    }
  } else if (cursor.lineIdx > 0) {
    const prevLn = docLines[cursor.lineIdx - 1];
    setCursor(prevLn.rootSeq.id, prevLn.rootSeq.items.length, cursor.lineIdx - 1);
  }
}

function moveCursorRight() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  if (cursor.offset < seq.items.length) {
    const next = seq.items[cursor.offset];
    if (next.kind === "frac" || next.kind === "binom") {
      setCursor(next.num.id, 0);
    } else if (next.kind === "bigop") {
      setCursor(next.sub.id, 0);
    } else if (next.body) {
      setCursor(next.body.id, 0);
    } else {
      setCursor(seq.id, cursor.offset + 1);
    }
  } else if (seq.parentNode && seq.parentNode.parentSeq) {
    const pNode = seq.parentNode;
    const pSeq = pNode.parentSeq;
    const idx = pSeq.items.indexOf(pNode);
    if ((pNode.kind === "frac" || pNode.kind === "binom") && seq.slotName === "num") {
      setCursor(pNode.den.id, 0);
    } else if (pNode.kind === "bigop" && seq.slotName === "sub") {
      setCursor(pNode.sup.id, 0);
    } else if (pNode.kind === "bigop" && seq.slotName === "sup") {
      setCursor(pNode.body.id, 0);
    } else if (idx >= 0) {
      setCursor(pSeq.id, idx + 1);
    }
  } else if (cursor.lineIdx + 1 < docLines.length) {
    const nextLn = docLines[cursor.lineIdx + 1];
    setCursor(nextLn.rootSeq.id, 0, cursor.lineIdx + 1);
  }
}

function moveCursorUp() {
  const seq = seqMap.get(cursor.seqId);
  if (seq && seq.parentNode && (seq.parentNode.kind === "frac" || seq.parentNode.kind === "binom") && seq.slotName === "den") {
    const numSeq = seq.parentNode.num;
    setCursor(numSeq.id, Math.min(cursor.offset, numSeq.items.length));
    return;
  }
  if (cursor.lineIdx > 0) {
    const prevLn = docLines[cursor.lineIdx - 1];
    setCursor(prevLn.rootSeq.id, Math.min(cursor.offset, prevLn.rootSeq.items.length), cursor.lineIdx - 1);
  }
}

function moveCursorDown() {
  const seq = seqMap.get(cursor.seqId);
  if (seq && seq.parentNode && (seq.parentNode.kind === "frac" || seq.parentNode.kind === "binom") && seq.slotName === "num") {
    const denSeq = seq.parentNode.den;
    setCursor(denSeq.id, Math.min(cursor.offset, denSeq.items.length));
    return;
  }
  if (cursor.lineIdx + 1 < docLines.length) {
    const nextLn = docLines[cursor.lineIdx + 1];
    setCursor(nextLn.rootSeq.id, Math.min(cursor.offset, nextLn.rootSeq.items.length), cursor.lineIdx + 1);
  }
}

function handleBackspace() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  if (cursor.offset > 0) {
    // Delete the entire item (whether char, sym, frac, sub, sup, abs) immediately!
    seq.items.splice(cursor.offset - 1, 1);
    cursor.offset -= 1;
    onDocMutated();
  } else if (seq.parentNode && seq.parentNode.parentSeq) {
    // At start of a slot inside a composite node: dissolve/delete the composite node
    const pNode = seq.parentNode;
    const pSeq = pNode.parentSeq;
    const idx = pSeq.items.indexOf(pNode);
    if (idx >= 0) {
      let rescue = [];
      if (pNode.kind === "frac") {
        rescue = [...pNode.num.items, ...pNode.den.items];
      } else if (pNode.body) {
        rescue = [...pNode.body.items];
      }
      pSeq.items.splice(idx, 1, ...rescue);
      for (const r of rescue) {
        if (r.parentSeq) r.parentSeq = pSeq;
      }
      cursor.seqId = pSeq.id;
      cursor.offset = idx;
      onDocMutated();
    }
  } else {
    // At start of root line
    const ln = docLines[cursor.lineIdx];
    if (ln.indent > 0) {
      ln.indent -= 1;
      onDocMutated();
    } else if (cursor.lineIdx > 0) {
      const prevLn = docLines[cursor.lineIdx - 1];
      const joinOffset = prevLn.rootSeq.items.length;
      for (const it of ln.rootSeq.items) {
        if (it.parentSeq) it.parentSeq = prevLn.rootSeq;
        prevLn.rootSeq.items.push(it);
      }
      docLines.splice(cursor.lineIdx, 1);
      cursor.lineIdx -= 1;
      cursor.seqId = prevLn.rootSeq.id;
      cursor.offset = joinOffset;
      onDocMutated();
    }
  }
}

// ================================================================
// 8. Typing, Shortcuts (/ _ ^ | <= ->) & Autocomplete (r + Tab)
// ================================================================

function isCommentLine(seq) {
  const root = getRootSeq(seq);
  if (!root) return false;
  let prefix = "";
  for (let i = 0; i < Math.min(4, root.items.length); i++) {
    if (root.items[i].kind === "char") prefix += root.items[i].ch;
  }
  return prefix.startsWith("//") || prefix.startsWith("--") || prefix.startsWith("#");
}

function insertCharAtCursor(ch) {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  const inComment = isCommentLine(seq);

  if (!inComment) {
    // 1. `/` -> Immediately create Fraction node with preceding term as numerator!
    if (ch === "/") {
      // Check if previous char is also `/` (making `//` comment at start of line)
      if (seq.slotName === "root" && cursor.offset === 1 && seq.items[0] && seq.items[0].kind === "char" && seq.items[0].ch === "/") {
        seq.items.splice(cursor.offset, 0, makeChar("/"));
        cursor.offset += 1;
        onDocMutated();
        return;
      }
      if (seq.slotName === "root" && cursor.offset === 0) {
        seq.items.splice(0, 0, makeChar("/"));
        cursor.offset = 1;
        onDocMutated();
        return;
      }
      const leftSlice = seq.items.slice(0, cursor.offset);
      const rightSlice = seq.items.slice(cursor.offset);
      while (leftSlice.length > 0 && leftSlice[leftSlice.length - 1].kind === "char" && leftSlice[leftSlice.length - 1].ch === " ") {
        leftSlice.pop();
      }
      const numItems = popPrecedingTermItems(leftSlice);
      const fracNode = makeFrac(numItems, [], seq);
      seq.items = [...leftSlice, fracNode, ...rightSlice];
      cursor.seqId = fracNode.den.id;
      cursor.offset = 0;
      onDocMutated();
      return;
    }

    // 2. `_` -> Immediately create Subscript slot (unless inside command draft `\...` or `by_contra`)
    if (ch === "_") {
      const prevStr = getPrecedingCharString(seq, cursor.offset, 4);
      if (!prevStr.includes("\\") && prevStr !== "by") {
        const subNode = makeSub([], seq);
        seq.items.splice(cursor.offset, 0, subNode);
        cursor.seqId = subNode.body.id;
        cursor.offset = 0;
        onDocMutated();
        return;
      }
    }

    // 3. `^` -> Immediately create Superscript slot
    if (ch === "^") {
      const supNode = makeSup([], seq);
      seq.items.splice(cursor.offset, 0, supNode);
      cursor.seqId = supNode.body.id;
      cursor.offset = 0;
      onDocMutated();
      return;
    }

    // 4. Multi-char operator shortcuts: <=, =<, >=, !=, ->, <->, |-
    const prev1 = cursor.offset >= 1 && seq.items[cursor.offset - 1].kind === "char" ? seq.items[cursor.offset - 1].ch : "";
    const prev1Sym = cursor.offset >= 1 && seq.items[cursor.offset - 1].kind === "sym" ? seq.items[cursor.offset - 1].ascii : "";
    if (prev1 === "<" && ch === "=") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("<=", "≤"));
      onDocMutated(); return;
    }
    if (prev1 === "=" && ch === "<") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("<=", "≤"));
      onDocMutated(); return;
    }
    if (prev1 === ">" && ch === "=") {
      seq.items.splice(cursor.offset - 1, 1, makeSym(">=", "≥"));
      onDocMutated(); return;
    }
    if (prev1 === "!" && ch === "=") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("!=", "≠"));
      onDocMutated(); return;
    }
    // |-> は ↦（λ）
    if (cursor.offset >= 2 && seq.items[cursor.offset - 2].kind === "char" && seq.items[cursor.offset - 2].ch === "|" && prev1 === "-" && ch === ">") {
      seq.items.splice(cursor.offset - 2, 2, makeSym("|->", "↦"));
      cursor.offset -= 1;
      onDocMutated(); return;
    }
    if (prev1 === "-" && ch === ">") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("->", "→"));
      onDocMutated(); return;
    }
    if (prev1Sym === "<=" && ch === ">") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("<->", "↔"));
      onDocMutated(); return;
    }
    // ⊢ は `\|-`（または \vdash・\turnstile）で入れる。`|-` は絶対値とマイナス（|-x|）のために変換しない
    const prev2 = cursor.offset >= 2 && seq.items[cursor.offset - 2].kind === "char" ? seq.items[cursor.offset - 2].ch : "";
    if (prev2 === "\\" && prev1 === "|" && ch === "-") {
      seq.items.splice(cursor.offset - 2, 2, makeSym("|-", "⊢"));
      cursor.offset -= 1;
      onDocMutated(); return;
    }
  }

  seq.items.splice(cursor.offset, 0, makeChar(ch));
  cursor.offset += 1;

  // If user pressed Space after a standalone word like `forall `, `eps `, convert word to symbol!
  if (!inComment && (ch === " " || ch === "." || ch === "," || ch === ")" || ch === ":" || ch === ">" || ch === "<")) {
    tryAutoConvertPrecedingWord(seq, cursor.offset - 1);
  }

  onDocMutated();
}

function getPrecedingCharString(seq, offset, maxLen) {
  let s = "";
  for (let i = Math.max(0, offset - maxLen); i < offset; i++) {
    if (seq.items[i].kind === "char") s += seq.items[i].ch;
    else s = "";
  }
  return s;
}

function tryAutoConvertPrecedingWord(seq, wordEndOffset) {
  let start = wordEndOffset;
  while (start > 0 && seq.items[start - 1].kind === "char" && /[A-Za-z0-9_]/.test(seq.items[start - 1].ch)) {
    start--;
  }
  if (start > 0 && seq.items[start - 1].kind === "char" && seq.items[start - 1].ch === "\\") {
    const cmd = seq.items.slice(start, wordEndOffset).map(x => x.ch).join("");
    const entry = COMMAND_DICT.find(c => c.cmd === cmd);
    if (entry) {
      applyCommandEntry(seq, start - 1, wordEndOffset + 1, entry);
      return;
    }
  }
  const word = seq.items.slice(start, wordEndOffset).map(x => x.ch).join("");
  if (WORD_TO_SYM[word]) {
    const [asc, disp, cls] = WORD_TO_SYM[word];
    seq.items.splice(start, wordEndOffset - start, makeSym(asc, disp, cls));
    cursor.offset = start + 2; // account for trailing delimiter
  }
}

function applyCommandEntry(seq, replaceStart, replaceEnd, entry) {
  if (entry.kind === "frac") {
    const node = makeFrac([], [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.num.id; cursor.offset = 0;
  } else if (entry.kind === "binom") {
    const node = makeBinom([], [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.num.id; cursor.offset = 0;
  } else if (entry.kind === "sqrt") {
    const node = makeSqrt([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "abs") {
    const node = makeAbs([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "norm") {
    const node = makeDelim("norm", "‖", "‖", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "floor") {
    const node = makeDelim("floor", "⌊", "⌋", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "ceil") {
    const node = makeDelim("ceil", "⌈", "⌉", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "set") {
    const node = makeDelim("set", "{", "}", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "inner") {
    const node = makeDelim("inner", "⟨", "⟩", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "accent") {
    const node = makeAccent(entry.fnName, entry.mark, [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "bigop") {
    const node = makeBigOp(entry.fnName, entry.sym, [], [], [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.sub.id; cursor.offset = 0;
  } else if (entry.kind === "sub") {
    const node = makeSub([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "sup") {
    const node = makeSup([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "sym") {
    seq.items.splice(replaceStart, replaceEnd - replaceStart, makeSym(entry.ascii, entry.display, entry.cls));
    cursor.seqId = seq.id; cursor.offset = replaceStart + 1;
  } else {
    const chars = Array.from(entry.cmd + " ").map(makeChar);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, ...chars);
    cursor.seqId = seq.id; cursor.offset = replaceStart + chars.length;
  }
  acPopup.style.display = "none";
  acMatches = [];
  onDocMutated();
}

function updateAutocomplete() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq || isCommentLine(seq)) {
    acPopup.style.display = "none";
    acMatches = [];
    return;
  }
  let start = cursor.offset;
  while (start > 0 && seq.items[start - 1].kind === "char" && /[A-Za-z0-9_]/.test(seq.items[start - 1].ch)) {
    start--;
  }
  const hasSlash = (start > 0 && seq.items[start - 1].kind === "char" && seq.items[start - 1].ch === "\\");
  const word = seq.items.slice(start, cursor.offset).map(x => x.ch).join("");

  if (hasSlash) {
    const q = word.toLowerCase();
    acMatches = COMMAND_DICT.filter(c => c.cmd.toLowerCase().startsWith(q));
    acRange = { seqId: seq.id, startOffset: start - 1, endOffset: cursor.offset, isSlash: true };
  } else if (word.length >= 2) {
    const q = word.toLowerCase();
    const kwList = (seq.slotName === "root" && start === 0) ? [...KEYWORD_COMPLETIONS, ...COMMAND_DICT] : COMMAND_DICT.filter(c => c.kind === "sym");
    acMatches = kwList.filter(c => c.cmd.toLowerCase().startsWith(q) && c.cmd !== word);
    acRange = { seqId: seq.id, startOffset: start, endOffset: cursor.offset, isSlash: false };
  } else {
    acMatches = [];
    acRange = null;
  }

  if (acMatches.length === 0) {
    acPopup.style.display = "none";
    return;
  }
  acIndex = 0;
  renderAcPopup();
}

function renderAcPopup() {
  const caretEl = editorSurface.querySelector(".mc-caret");
  if (caretEl) {
    const rect = caretEl.getBoundingClientRect();
    acPopup.style.left = `${Math.max(12, rect.left)}px`;
    acPopup.style.top = `${rect.bottom + 6}px`;
  }
  acPopup.innerHTML = acMatches.slice(0, 8).map((m, idx) => `
    <div class="ac-item ${idx === acIndex ? 'active' : ''}" onmousedown="confirmAc(${idx}); return false;">
      <span class="ac-preview">${escHtml(m.preview)}</span>
      <span class="ac-cmd">${acRange && acRange.isSlash ? '\\' : ''}${escHtml(m.cmd)}</span>
      <span class="ac-desc">${escHtml(m.desc)}</span>
    </div>
  `).join("");
  acPopup.style.display = "block";
}

function confirmAc(idx) {
  if (!acRange || !acMatches[idx]) return;
  const seq = seqMap.get(acRange.seqId);
  if (!seq) return;
  applyCommandEntry(seq, acRange.startOffset, acRange.endOffset, acMatches[idx]);
}

editorSurface.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    saveFile();
    return;
  }

  // Undo / Redo / Select all
  if ((e.metaKey || e.ctrlKey) && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "z") { e.preventDefault(); undoDoc(e.shiftKey ? 1 : -1); return; }
    if (k === "y") { e.preventDefault(); undoDoc(1); return; }
    if (k === "a") { e.preventDefault(); selectAll(); return; }
  }

  // Autocomplete navigation
  if (acMatches.length > 0 && acPopup.style.display === "block") {
    const visibleCount = Math.min(8, acMatches.length);
    if (e.key === "ArrowDown") {
      e.preventDefault();
      acIndex = (acIndex + 1) % visibleCount;
      renderAcPopup();
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      acIndex = (acIndex - 1 + visibleCount) % visibleCount;
      renderAcPopup();
      return;
    }
    if (e.key === "Tab" || e.key === "Enter") {
      e.preventDefault();
      confirmAc(acIndex);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      acPopup.style.display = "none";
      acMatches = [];
      return;
    }
  }

  // Tab navigation inside composite nodes or line indent
  if (e.key === "Tab") {
    e.preventDefault();
    const seq = seqMap.get(cursor.seqId);
    if (!seq) return;
    // 複数行を選んでいるときは、まとめて字下げ（Shift+Tab で戻す）。選択はそのまま
    const sel = normalizeSel();
    if (sel && sel.mode === "lines") {
      const last = sel.o2 === 0 && sel.l2 > sel.l1 ? sel.l2 - 1 : sel.l2;
      for (let l = sel.l1; l <= last; l++) {
        docLines[l].indent = e.shiftKey ? Math.max(0, docLines[l].indent - 1) : docLines[l].indent + 1;
      }
      onDocMutated(true);
      return;
    }
    if (!e.shiftKey && pendingHypSuggestion && pendingHypSuggestion.seqId === seq.id && cursor.offset === seq.items.length && pendingHypSuggestion.replace !== undefined) {
      // 古い書き方：行ごと書き換える（空なら行を消す）
      const text = pendingHypSuggestion.replace;
      if (text === "") {
        docLines.splice(cursor.lineIdx, 1);
        const li = Math.min(cursor.lineIdx, docLines.length - 1);
        const r = docLines[li].rootSeq;
        setCursor(r.id, r.items.length, li);
      } else {
        const ins = parseAsciiToItems(text);
        for (const it of ins) it.parentSeq = seq;
        seq.items = ins;
        cursor.offset = seq.items.length;
      }
      onDocMutated();
      return;
    }
    if (!e.shiftKey && pendingHypSuggestion && pendingHypSuggestion.seqId === seq.id && cursor.offset === seq.items.length) {
      const ins = parseAsciiToItems(pendingHypSuggestion.append);
      for (const it of ins) it.parentSeq = seq;
      // `Case succ k, IH:` のように行末が「:」なら、その前に入れる
      let at = seq.items.length;
      while (at > 0 && seq.items[at - 1].kind === "char" && seq.items[at - 1].ch === " ") at--;
      if (at > 0 && seq.items[at - 1].kind === "char" && seq.items[at - 1].ch === ":") at--;
      else at = seq.items.length;
      seq.items.splice(at, 0, ...ins);
      cursor.offset = seq.items.length;
      onDocMutated();
      return;
    }
    if (seq.parentNode && seq.parentNode.parentSeq) {
      const pNode = seq.parentNode;
      const pSeq = pNode.parentSeq;
      const idx = pSeq.items.indexOf(pNode);
      if ((pNode.kind === "frac" || pNode.kind === "binom") && seq.slotName === "num") {
        setCursor(pNode.den.id, 0);
        return;
      }
      if (pNode.kind === "bigop" && seq.slotName === "sub") {
        setCursor(pNode.sup.id, 0);
        return;
      }
      if (pNode.kind === "bigop" && seq.slotName === "sup") {
        setCursor(pNode.body.id, 0);
        return;
      }
      if (idx >= 0) {
        setCursor(pSeq.id, idx + 1);
        return;
      }
    }
    // Otherwise adjust line indent
    const ln = docLines[cursor.lineIdx];
    if (e.shiftKey) {
      ln.indent = Math.max(0, ln.indent - 1);
    } else {
      ln.indent += 1;
    }
    onDocMutated();
    return;
  }

  // 単語ごと：⌥ または Ctrl + ←→。行の端：⌘ + ←→（Mac の標準）
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && (e.altKey || (e.ctrlKey && !e.metaKey))) {
    e.preventDefault();
    moveWithSelection(e.key === "ArrowRight" ? moveWordRight : moveWordLeft, e.shiftKey ? "" : e.key, e.shiftKey);
    return;
  }
  if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && e.metaKey) {
    e.preventDefault();
    moveWithSelection(() => moveLineEdge(e.key === "ArrowRight"), e.shiftKey ? "" : e.key, e.shiftKey);
    return;
  }
  const moves = { ArrowLeft: moveCursorLeft, ArrowRight: moveCursorRight, ArrowUp: moveCursorUp, ArrowDown: moveCursorDown };
  if (moves[e.key]) { e.preventDefault(); moveWithSelection(moves[e.key], e.key, e.shiftKey); return; }
  if (e.key === "Backspace") {
    e.preventDefault();
    if (deleteSelection()) onDocMutated(); else handleBackspace();
    return;
  }
  if (e.key === "Delete") {
    e.preventDefault();
    if (deleteSelection()) { onDocMutated(); return; }
    const seq = seqMap.get(cursor.seqId);
    if (seq && cursor.offset < seq.items.length) {
      seq.items.splice(cursor.offset, 1);
      onDocMutated();
    }
    return;
  }

  if (e.key === "Enter") {
    e.preventDefault();
    deleteSelection();
    const ln = docLines[cursor.lineIdx];
    const root = ln.rootSeq;
    // Split line if in rootSeq, otherwise jump to new line below
    let rightItems = [];
    if (cursor.seqId === root.id) {
      rightItems = root.items.splice(cursor.offset);
    }
    const lineAscii = serializeSeqToAscii(root).trim();
    let nextIndent = ln.indent;
    if (
      lineAscii.startsWith("Fix ") ||
      lineAscii.startsWith("assume ") ||
      lineAscii.startsWith("by_contra ") ||
      lineAscii.startsWith("Case ") ||
      lineAscii.startsWith("cases ") ||
      lineAscii.startsWith("induction ") ||
      lineAscii.startsWith("thm ")
    ) {
      nextIndent += 1;
    }
    const newSeq = createSeq(rightItems, null, "root");
    docLines.splice(cursor.lineIdx + 1, 0, { indent: nextIndent, rootSeq: newSeq });
    cursor.lineIdx += 1;
    cursor.seqId = newSeq.id;
    cursor.offset = 0;
    onDocMutated();
    return;
  }

  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    deleteSelection();
    insertCharAtCursor(e.key);
  }
});

// コピー・切り取り・貼り付け：選択範囲を ASCII のコードとして出し入れする
function editorFocused() { return document.activeElement === editorSurface; }
document.addEventListener("copy", (e) => {
  if (!editorFocused()) return;
  const t = selectionText();
  if (!t) return;
  e.clipboardData.setData("text/plain", t);
  e.preventDefault();
});
document.addEventListener("cut", (e) => {
  if (!editorFocused()) return;
  const t = selectionText();
  if (!t) return;
  e.clipboardData.setData("text/plain", t);
  e.preventDefault();
  deleteSelection();
  onDocMutated();
});
document.addEventListener("paste", (e) => {
  if (!editorFocused()) return;
  const t = e.clipboardData.getData("text/plain");
  if (!t) return;
  e.preventDefault();
  pasteText(t);
  onDocMutated();
});
</script>
<script>
// ================================================================
// 9. Verification, Inspector Views, File I/O, Theme & AI
// ================================================================

// 編集のたびに呼ぶ：選択を解除し、履歴に積み、再描画して検査を予約する
function onDocMutated(keepSel = false) {
  if (!keepSel) selAnchor = null;
  pushHistory();
  refreshAfterEdit();
  noteEdited();
}

function refreshAfterEdit() {
  renderEditor();
  if (checkDebounce) clearTimeout(checkDebounce);
  checkDebounce = setTimeout(runCheckApi, 110);
}

// エラーメッセージ：式の部分（msg_latex の $…$）は数式として描く
function msgHtml(e) {
  const src = e.msg_latex || "";
  if (!src || !window.katex) return escHtml(e.msg);
  return src.split("$").map((part, k) => (k % 2 ? renderKatex(part, false) : escHtml(part))).join("");
}

function renderKatex(tex, displayMode = false) {
  if (!window.katex) return `<code>${escHtml(tex)}</code>`;
  try {
    return window.katex.renderToString(tex, { displayMode, throwOnError: false, strict: false });
  } catch (_) {
    return `<code>${escHtml(tex)}</code>`;
  }
}

function renderInlineMarkdownMath(md) {
  const s = String(md || "");
  const dispParts = s.split(/\$\$([\s\S]+?)\$\$/g);
  let out = "";
  for (let i = 0; i < dispParts.length; i++) {
    if (i % 2 === 1) {
      out += `<div style="margin:6px 0;overflow-x:auto;">${renderKatex(dispParts[i], true)}</div>`;
    } else {
      const inParts = dispParts[i].split(/\$([^\$]+?)\$/g);
      for (let j = 0; j < inParts.length; j++) {
        if (j % 2 === 1) {
          out += renderKatex(inParts[j], false);
        } else {
          let h = escHtml(inParts[j]);
          h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
          out += h;
        }
      }
    }
  }
  return out;
}

async function runCheckApi() {
  const src = serializeDocToAscii();
  const cursor_line = cursor.lineIdx + 1;
  try {
    const resp = await fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ src, cursor_line, path: currentFilePath })
    });
    const data = await resp.json();
    lastCheckData = data;
    registerNotations(data.notations);
    updateStatusPill(data);
    renderEditor();
    renderGoalInspector();
    renderProseTab(data);
    renderLatexTab(data);
  } catch (e) {
    console.error("check error", e);
  }
}

function updateStatusPill(data) {
  const pill = document.getElementById("statusPill");
  const decls = data.decls || [];
  const hasErr = Boolean(data.parse_error) || decls.some(d => d.status === "error");
  const hasSorry = decls.some(d => d.status === "sorry");
  const thms = decls.filter(d => !d.is_axiom).length;

  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  if (hasErr) {
    const n = decls.filter(d => d.status === "error").length;
    pill.className = "status-pill err";
    pill.textContent = data.parse_error ? "Syntax error" : plural(n, "error");
  } else if (hasSorry) {
    pill.className = "status-pill sorry";
    pill.textContent = `${decls.filter(d => d.status === "sorry").length} incomplete`;
  } else {
    pill.className = "status-pill ok";
    pill.textContent = thms === 0 ? "No theorems" : `${plural(thms, "theorem")} verified`;
  }
}

function renderGoalInspector() {
  if (!lastCheckData) return;
  const curLine = cursor.lineIdx + 1;
  const errArea = document.getElementById("errBannerArea");
  if (lastCheckData.parse_error) {
    errArea.innerHTML = `<div class="err-banner">Ln ${lastCheckData.parse_error.line}: ${msgHtml(lastCheckData.parse_error)}</div>`;
  } else {
    errArea.innerHTML = "";
  }

  const decls = lastCheckData.decls || [];
  let activeDecl = null;
  for (const d of decls) {
    if (d.line <= curLine) activeDecl = d;
  }
  if (!activeDecl && decls.length > 0) activeDecl = decls[0];

  const curDeclLabel = document.getElementById("curDeclLabel");
  const goalViewArea = document.getElementById("goalViewArea");
  if (!activeDecl) {
    curDeclLabel.textContent = "";
    goalViewArea.innerHTML = `<div style="color:var(--text-dim);">No declarations</div>`;
  } else {
    curDeclLabel.textContent = activeDecl.name;
    let bestStep = null;
    for (const st of (activeDecl.steps || [])) {
      if (st.line <= curLine) bestStep = st;
    }
    if (!bestStep && activeDecl.steps && activeDecl.steps.length > 0) {
      bestStep = activeDecl.steps[0];
    }

    let html = "";
    if (activeDecl.error) {
      html += `<div class="err-banner">Ln ${activeDecl.error.line}: ${msgHtml(activeDecl.error)}</div>`;
      // 根拠の候補（行末に足す）
      const fixes = [activeDecl.error.fix, ...(activeDecl.error.alts || [])].filter((f) => f && /^\s*by\s/.test(f));
      if (fixes.length && activeDecl.error.line === curLine) {
        html += `<div class="hints"><span class="hints-label">根拠の候補</span>` +
          fixes.map((f) => `<button class="hint" data-append="${escHtml(f)}">${escHtml(f.trim())}</button>`).join("") + `</div>`;
      }
    }
    for (const w of (activeDecl.warnings || [])) {
      if (w.line === curLine) html += `<div class="warn-banner">Ln ${w.line}: ${escHtml(w.msg)}${w.replace !== null ? "（行末で Tab）" : ""}</div>`;
    }

    const ctxL = (bestStep && bestStep.ctx_latex) ? bestStep.ctx_latex : (activeDecl.error && activeDecl.error.ctx_latex ? activeDecl.error.ctx_latex : []);
    const goalL = (bestStep && bestStep.goal_latex) ? bestStep.goal_latex : (activeDecl.error && activeDecl.error.goal_latex ? activeDecl.error.goal_latex : activeDecl.concl_latex);

    for (const c of ctxL) {
      html += `<div class="hyp-row">${renderKatex(c, false)}</div>`;
    }
    html += `<div class="goal-panel">${renderKatex("\\vdash\\; " + (goalL || ""), true)}</div>`;
    // 次の一手：goal と仮定の形から（押すと、sorry の行なら置き換え、そうでなければ下の行に入る）
    if (bestStep && bestStep.hints && bestStep.hints.length && !activeDecl.is_axiom) {
      html += `<div class="hints"><span class="hints-label">次の一手</span>` +
        bestStep.hints.map(([code, why]) => `<button class="hint" title="${escHtml(why)}" data-code="${escHtml(code)}">${escHtml(code.split("\n")[0])}</button>`).join("") +
        `</div>`;
    }

    if (activeDecl.sorries && activeDecl.sorries.length > 0) {
      for (const s of activeDecl.sorries) {
        html += `<div style="padding:8px 10px;border-left:2px solid var(--warn);background:var(--bg-elev);margin-bottom:6px;cursor:pointer;" onclick="jumpToLine(${s.line - 1})">
          <div style="font-size:11px;color:var(--warn);font-family:monospace;">sorry at Ln ${s.line}</div>
          <div style="margin-top:3px;">${renderKatex("\\vdash\\; " + s.goal_latex, false)}</div>
        </div>`;
      }
    }
    goalViewArea.innerHTML = html;
  }

  document.getElementById("declCountLabel").textContent = `${decls.length}`;
  document.getElementById("declListArea").innerHTML = decls.map(d => {
    let st = "OK";
    let col = "var(--ok)";
    if (d.is_axiom) { st = "AXIOM"; col = "var(--text-dim)"; }
    else if (d.status === "error") { st = "ERR"; col = "var(--err)"; }
    else if (d.status === "sorry") { st = "SORRY"; col = "var(--warn)"; }
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="jumpToLine(${d.line - 1})">
      <div>
        <span style="font-family:monospace;font-size:11px;color:${col};margin-right:8px;">${st}</span>
        <span style="font-weight:600;">${escHtml(d.name)}</span>
        ${depsHtml(d)}
      </div>
      <div style="font-size:12.5px;max-width:58%;overflow-x:auto;">${renderKatex(d.concl_latex, false)}</div>
    </div>`;
  }).join("");
}

// ---- 証明木（kernel が検算した証明。src/derivation.rs）：カーソルの行から作られた部分を、Gentzen 式か Fitch 式で

let treeStyle = localStorage.getItem("narfi.tree.style") || "gentzen";

let treeShown = null;

function setTreeStyle(st) {
  treeStyle = st;
  localStorage.setItem("narfi.tree.style", st);
  if (treeShown) showDerivation(treeShown.decl, treeShown.line);
}

function showDerivation(decl, line) {
  treeShown = { decl, line };
  document.getElementById("treeBody").innerHTML = derivationHtml(decl, line);
  document.getElementById("treeBack").hidden = false;
}

function hideDerivation() {
  treeShown = null;
  document.getElementById("treeBack").hidden = true;
  editorSurface.focus();
}

function findTreeAt(n, line) {
  if (n.l === line) return n;
  for (const c of n.p) {
    const r = findTreeAt(c, line);
    if (r) return r;
  }
  return null;
}

function derivationHtml(decl, curLine) {
  const node = findTreeAt(decl.tree, curLine) || decl.tree;
  const whole = node === decl.tree;
  const tabs = ["gentzen", "fitch"].map((st) =>
    `<button class="tree-style${treeStyle === st ? " active" : ""}" onclick="setTreeStyle('${st}')">${st === "gentzen" ? "Gentzen" : "Fitch"}</button>`).join("");
  const body = treeStyle === "fitch" ? fitchHtml(node) : `<div class="pt-wrap">${gentzenHtml(node)}</div>`;
  return `<div class="tree-head"><span>${escHtml(decl.name)}：${whole ? "定理全体" : `${curLine} 行目の部分`}の証明木</span><span>${tabs}<button class="tree-style" onclick="hideDerivation()">閉じる</button></span></div>${body}`;
}

function hypLabel(h) {
  return `<span class="pt-hyp">${escHtml(h)}</span>`;
}

function gentzenHtml(n) {
  const k = (f) => renderKatex(f, false);
  if (n.p.length === 0 && !n.r) {
    // 仮定の葉：打ち消されるものは [φ]^h
    return n.o
      ? `<div class="pt-leaf">[${k(n.c)}]<sup>${escHtml(n.h)}</sup></div>`
      : `<div class="pt-leaf">${k(n.c)}${n.h ? `<sub class="pt-ctx">${escHtml(n.h)}</sub>` : ""}</div>`;
  }
  const dis = n.d.length ? `<sup>${n.d.map((d) => escHtml(d[1])).join(",")}</sup>` : "";
  // 規則の名前は横線の右に、幅を取って置く（隣の枝と重ならないように）
  return `<div class="pt"><div class="pt-main"><div class="pt-prems">${n.p.map(gentzenHtml).join("")}</div>` +
    `<div class="pt-bar"></div><div class="pt-concl">${k(n.c)}</div></div><div class="pt-rule">${k(n.r)}${dis}</div></div>`;
}

function fitchHtml(root) {
  const lines = [];
  const env = new Map();
  // 文脈の仮定（前提）を先に並べる
  const prem = [];
  (function walk(n) {
    if (n.p.length === 0 && !n.r && n.h && !n.o && !prem.some((p) => p.h === n.h)) prem.push(n);
    n.p.forEach(walk);
  })(root);
  for (const p of prem) {
    lines.push({ depth: 0, f: p.c, just: "前提", first: true, label: p.h });
    env.set(p.h, lines.length);
  }
  function emit(n, depth) {
    if (n.p.length === 0 && !n.r && n.h) {
      if (env.has(n.h)) return env.get(n.h);
      lines.push({ depth, f: n.c, just: "仮定", label: n.h });
      return lines.length;
    }
    const refs = [];
    n.p.forEach((c, i) => {
      const d = n.d.find((x) => x[0] === i);
      if (d) {
        lines.push({ depth: depth + 1, f: d[2], just: "仮定", first: true, label: d[1] });
        const a = lines.length;
        const prev = env.get(d[1]);
        env.set(d[1], a);
        const b = emit(c, depth + 1);
        if (prev === undefined) env.delete(d[1]); else env.set(d[1], prev);
        refs.push(`${a}–${b}`);
      } else {
        refs.push(String(emit(c, depth)));
      }
    });
    lines.push({ depth, f: n.c, just: `${renderKatex(n.r, false)} ${refs.join(", ")}`, raw: true });
    return lines.length;
  }
  emit(root, 0);
  return `<table class="fitch">${lines.map((l, i) => {
    const bars = Array.from({ length: l.depth + 1 }, (_, k) => `<span class="fb${k === l.depth && l.first ? " first" : ""}"></span>`).join("");
    const just = l.raw ? l.just : escHtml(l.just) + (l.label ? ` <span class="pt-hyp">${escHtml(l.label)}</span>` : "");
    return `<tr><td class="fn">${i + 1}</td><td class="ff">${bars}<span class="fformula">${renderKatex(l.f, false)}</span></td><td class="fj">${just}</td></tr>`;
  }).join("")}</table>`;
}

// その定理が頼っている公理と自動証明（kernel が数えたもの）
function depsHtml(d) {
  if (d.is_axiom) return "";
  const ax = d.axioms || [];
  const or = (d.oracles || []).filter((o) => o !== "sorry");
  if (!ax.length && !or.length) return "";
  const parts = [];
  if (ax.length) parts.push(`公理: ${ax.map(escHtml).join(", ")}`);
  if (or.length) parts.push(`算術: ${or.map(escHtml).join(", ")}`);
  return `<div class="deps">${parts.join(" ／ ")}</div>`;
}

document.getElementById("goalViewArea").addEventListener("click", (e) => {
  const b = e.target.closest(".hint");
  if (!b) return;
  if (b.hasAttribute("data-append")) appendToLine(b.getAttribute("data-append"));
  else insertHint(b.getAttribute("data-code"));
});

// カーソルの行の末尾に足す（根拠の候補）
function appendToLine(text) {
  const ln = docLines[cursor.lineIdx];
  const seq = ln.rootSeq;
  while (seq.items.length && seq.items[seq.items.length - 1].kind === "char" && seq.items[seq.items.length - 1].ch === " ") seq.items.pop();
  const ins = parseAsciiToItems(text);
  for (const it of ins) it.parentSeq = seq;
  seq.items.push(...ins);
  setCursor(seq.id, seq.items.length, cursor.lineIdx);
  onDocMutated();
  editorSurface.focus();
}

function insertHint(code) {
  const lines = serializeDocToAscii().split("\n");
  const idx = Math.min(cursor.lineIdx, lines.length - 1);
  const cur = lines[idx] || "";
  const pad = cur.match(/^\s*/)[0];
  let parts = code.split("\n").map((p) => pad + p);
  // ブロックを開く文には、中身の sorry を付ける（続けて「次の一手」を選べるように）
  const c = code.trim();
  let m;
  if (/^(Fix|assume|by_contra)\b/.test(c)) parts.push(pad + "  sorry");
  else if ((m = c.match(/^cases (\S+)/))) parts.push(pad + "  Case left h1", pad + "    sorry", pad + "  Case right h2", pad + "    sorry");
  else if (/^(choose|Obtain)\b/.test(c)) parts.push(pad + "sorry");
  let at = idx;
  if (cur.trim() === "sorry" || cur.trim() === "") {
    lines.splice(idx, 1, ...parts);
  } else {
    lines.splice(idx + 1, 0, ...parts);
    at = idx + 1;
  }
  loadSourceIntoDoc(lines.join("\n"));
  const ln = docLines[Math.min(at, docLines.length - 1)];
  setCursor(ln.rootSeq.id, ln.rootSeq.items.length, Math.min(at, docLines.length - 1));
  onDocMutated();
  editorSurface.focus();
}

function jumpToLine(idx) {
  const clamped = Math.max(0, Math.min(idx, docLines.length - 1));
  const ln = docLines[clamped];
  setCursor(ln.rootSeq.id, ln.rootSeq.items.length, clamped);
}

function renderProseTab(data) {
  const notes = data.notes || [];
  const decls = data.decls || [];
  const items = [];
  for (const n of notes) items.push({ line: n.line, type: "note", note: n });
  for (const d of decls) items.push({ line: d.line, type: "decl", decl: d });
  items.sort((a, b) => a.line - b.line);

  let html = "";
  for (const it of items) {
    if (it.type === "note") {
      const n = it.note;
      if (n.kind === "heading") {
        html += `<h3 style="margin:14px 0 6px 0;font-size:15px;">${renderInlineMarkdownMath(n.text.replace(/^#+\s*/, ""))}</h3>`;
      } else {
        html += `<div style="color:var(--text-dim);margin:4px 0;">${renderInlineMarkdownMath(n.text)}</div>`;
      }
    } else {
      const d = it.decl;
      if (d.is_axiom) {
        html += `<div class="prose-thm" style="border-left-color:var(--text-dim);overflow-x:auto;"><strong>公理 ${escHtml(d.name)}</strong>: ${renderKatex(d.header_latex, false)}</div>`;
      } else if (d.error && /^構文エラー/.test(d.error.msg)) {
        // 読めなかった定理：名前とエラーだけ（ほかの定理はそのまま出す）
        html += `<div class="prose-thm prose-broken"><strong>定理 ${escHtml(d.name)}</strong></div>`;
        html += `<div class="prose-err" onclick="jumpToLine(${d.error.line - 1})">${d.error.line} 行目：${msgHtml(d.error)}</div>`;
      } else {
        html += `<div class="prose-thm"><div><strong>定理 ${escHtml(d.name)}</strong></div><div style="margin-top:6px;overflow-x:auto;">${renderKatex(d.header_latex, false)}</div></div>`;
        html += `<div class="prose-proof">`;
        for (const p of (d.prose || [])) {
          html += `<div style="padding-left:${p.depth * 16}px;margin:8px 0;line-height:1.75;">${renderInlineMarkdownMath(p.text)}</div>`;
        }
        // 通らなかった所は、その定理の中だけに示す
        if (d.error) html += `<div class="prose-err" onclick="jumpToLine(${d.error.line - 1})">${d.error.line} 行目で止まっている：${msgHtml(d.error)}</div>`;
        html += `</div>`;
      }
    }
  }
  document.getElementById("proseDocArea").innerHTML = html;
}

function renderLatexTab(data) {
  const decls = data.decls || [];
  let tex = "\\documentclass[a4paper,11pt]{ltjsarticle}\n\\usepackage{amsmath,amssymb,amsthm}\n\\newtheorem{theorem}{定理}\n\\newtheorem{axiom}{公理}\n\\begin{document}\n\n";
  for (const d of decls) tex += (d.latex_env || "") + "\n";
  tex += "\\end{document}\n";
  document.getElementById("latexArea").value = tex;
}

// ---- Learn（チュートリアル：src/tutorial.js）

let learnIndex = Number(localStorage.getItem("narfi.learn.index") || 0);

function inlineMd(text) {
  // `code` はコード、$…$ は数式、[文字](URL) はリンク、それ以外は文字
  return text.split(/(`[^`]*`)/).map((part) => {
    if (part.startsWith("`") && part.endsWith("`") && part.length >= 2) return `<code>${escHtml(part.slice(1, -1))}</code>`;
    return part.split("$").map((q, k) => {
      if (k % 2) return renderKatex(q, false);
      return escHtml(q)
        .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }).join("");
  }).join("");
}

// チュートリアル（src/tutorial.js）のあとに、コース「公理へ」（src/course.js）を続ける
function allLessons() {
  return [...(window.NARFI_TUTORIAL || []), ...(window.NARFI_COURSE || [])];
}

function showLesson(i) {
  const lessons = allLessons();
  if (!lessons.length) return;
  learnIndex = Math.max(0, Math.min(lessons.length - 1, i));
  localStorage.setItem("narfi.learn.index", String(learnIndex));
  const sel = document.getElementById("learnSelect");
  if (!sel.options.length) {
    const nt = (window.NARFI_TUTORIAL || []).length;
    const opt = (l, k) => `<option value="${k}">${escHtml(l.title)}</option>`;
    sel.innerHTML = `<optgroup label="チュートリアル">${lessons.slice(0, nt).map((l, k) => opt(l, k)).join("")}</optgroup>` +
      `<optgroup label="コース：公理へ">${lessons.slice(nt).map((l, k) => opt(l, nt + k)).join("")}</optgroup>`;
  }
  sel.value = String(learnIndex);
  const l = lessons[learnIndex];
  let html = `<h3>${escHtml(l.title)}</h3>`;
  for (const b of l.blocks) {
    if (b.p) html += `<p>${inlineMd(b.p)}</p>`;
    if (b.code) html += `<pre>${escHtml(b.code)}</pre>`;
    if (b.keys) html += `<table>${b.keys.map(([k, d]) => `<tr><td>${escHtml(k)}</td><td>${inlineMd(d)}</td></tr>`).join("")}</table>`;
  }
  if (l.file) {
    html += `<div class="learn-actions">
      <button class="ctrl-btn primary" onclick="openCourseFile()">コースのファイルを開く</button>
      <button class="ctrl-btn" onclick="toggleAnswer()">答えを見る</button>
    </div><pre id="learnAnswer" hidden>${escHtml(l.answer)}</pre>`;
  } else if (l.exercise) {
    html += `<div class="learn-actions">
      <button class="ctrl-btn primary" onclick="openExercise()">練習を開く</button>
      <button class="ctrl-btn" onclick="toggleAnswer()">答えを見る</button>
    </div><pre id="learnAnswer" hidden>${escHtml(l.answer)}</pre>`;
  }
  if (learnIndex + 1 < lessons.length) {
    html += `<div class="learn-actions"><button class="ctrl-btn" onclick="showLesson(learnIndex + 1)">次へ：${escHtml(lessons[learnIndex + 1].title)}</button></div>`;
  }
  document.getElementById("learnBody").innerHTML = html;
}

// コースの章：自分のファイル一覧に course/… を作って開く（すでにあれば、そのまま開く）
async function openCourseFile() {
  const l = allLessons()[learnIndex];
  if (!l || !l.file) return;
  if (!((workspaceInfo && workspaceInfo.files) || []).includes(l.file)) {
    const d = await fsOp("/api/create", { path: l.file });
    if (!d.ok) { uiToast(d.error || "作れませんでした"); return; }
    await fsOp("/api/save", { path: l.file, src: l.exercise });
    await loadWorkspace();
  }
  await openPath(l.file);
}

function openExercise() {
  const l = allLessons()[learnIndex];
  if (!l) return;
  loadSrc(l.exercise, "", { newTab: true, title: `練習${learnIndex + 1}.narfi` });
}

function toggleAnswer() {
  const a = document.getElementById("learnAnswer");

}

function switchTab(id, btn) {

  document.querySelectorAll(".insp-body").forEach(p => p.classList.remove("active"));

}

function copyProseMd() {

  for (const d of (lastCheckData.decls || [])) {

const paneResizer = document.getElementById("paneResizer");
const inspectorPane = document.getElementById("inspectorPane");
const btnInspector = document.getElementById("btnInspector");
let isResizingPane = false;

function toggleInspector() {

}

async function askAi(mode) {
  const reply = document.getElementById("aiReply");
  reply.textContent = "Thinking...";
  let prompt = document.getElementById("aiPrompt").value;
  if (mode === "next") prompt = "カーソル行の目標を進めるための次の1ステップを純粋ASCIIのNarfiコードで提案してください。";
  else if (mode === "sorry") prompt = "sorry を埋める証明コードを純粋ASCIIのNarfiコードで提案してください。";
  else if (mode === "error") prompt = "エラーの原因と修正案を簡潔に示してください。";

  const resp = await fetch("/api/ai", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      provider: document.getElementById("aiProvider").value,
      prompt,
      src: serializeDocToAscii(),
      goal_info: `Cursor Ln ${cursor.lineIdx + 1}`,
      api_key: document.getElementById("aiKey").value,
      api_base: document.getElementById("aiBase").value,
      model: document.getElementById("aiModel").value
    })
  });
  const data = await resp.json();
  reply.textContent = data.ok ? data.reply : (data.error || "Error");
}

function displayName(path) {

  return path.replace(/^lib:(user|std)\//, "lib/");

  const el = document.getElementById("fileLabel");

  el.title = currentFilePath ? (workspaceInfo ? `${workspaceInfo.root}/${currentFilePath}` : currentFilePath) : "保存されていない文書";

  el.classList.toggle("readonly", currentReadOnly);
