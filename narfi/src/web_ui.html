<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narfi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root[data-theme="dark"] {
  --bg: #0a0a0c;
  --bg-elev: #111115;
  --bg-hover: #18181e;
  --bg-active: #141824;
  --border: #1f1f26;
  --border-focus: #3b82f6;
  --text: #ededf0;
  --text-dim: #8a8a98;
  --text-faint: #52525e;
  --accent: #60a5fa;
  --kw-decl: #f472b6;
  --kw-step: #60a5fa;
  --kw-just: #34d399;
  --kw-jp: #a78bfa;
  --math-sym: #93c5fd;
  --math-var: #f1f5f9;
  --math-num: #fcd34d;
  --ok: #10b981;
  --warn: #f59e0b;
  --err: #ef4444;
  --caret: #60a5fa;
}
:root[data-theme="light"] {
  --bg: #fafafa;
  --bg-elev: #ffffff;
  --bg-hover: #f1f3f7;
  --bg-active: #eef2ff;
  --border: #e4e4e9;
  --border-focus: #2563eb;
  --text: #141418;
  --text-dim: #646470;
  --text-faint: #a1a1aa;
  --accent: #2563eb;
  --kw-decl: #be185d;
  --kw-step: #1d4ed8;
  --kw-just: #047857;
  --kw-jp: #6d28d9;
  --math-sym: #1e40af;
  --math-var: #111827;
  --math-num: #b45309;
  --ok: #059669;
  --warn: #d97706;
  --err: #dc2626;
  --caret: #2563eb;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 13.5px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
/* Top Bar - Minimal Sharp 38px */
.topbar {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.topbar-left, .topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--text);
  padding-right: 8px;
  border-right: 1px solid var(--border);
}
.ctrl-select, .ctrl-input {
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 8px;
  font-size: 12px;
  font-family: inherit;
  outline: none;
}
.ctrl-select:focus, .ctrl-input:focus {
  border-color: var(--border-focus);
}
.ctrl-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 9px;
  font-size: 11.5px;
  font-family: "JetBrains Mono", "SFMono-Regular", Menlo, sans-serif;
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}
.ctrl-btn:hover {
  color: var(--text);
  border-color: var(--text-dim);
  background: var(--bg-hover);
}
.ctrl-btn.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--bg-active);
}
.status-pill {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 2px;
  border: 1px solid var(--border);
}
.status-pill.ok { color: var(--ok); border-color: rgba(16,185,129,0.35); }
.status-pill.sorry { color: var(--warn); border-color: rgba(245,158,11,0.35); }
.status-pill.err { color: var(--err); border-color: rgba(239,68,68,0.4); }

/* Split Workspace with Resizable Right Pane */
.workspace {
  display: flex;
  height: calc(100vh - 38px);
  width: 100vw;
  overflow: hidden;
}
.editor-surface {
  flex: 1;
  min-width: 280px;
  position: relative;
  overflow-y: auto;
  overflow-x: auto;
  padding: 18px 0 80px 0;
  cursor: text;
  outline: none;
}
.pane-resizer {
  width: 5px;
  flex-shrink: 0;
  background: var(--border);
  cursor: col-resize;
  position: relative;
  z-index: 20;
  transition: background 0.12s;
}
.pane-resizer:hover, .pane-resizer.dragging {
  background: var(--accent);
}
.inspector {
  width: var(--inspector-width, 460px);
  flex-shrink: 0;
}
.inspector.collapsed {
  display: none !important;
}
/* Line rows in Mathcha-style structured editor */
.mc-line {
  display: flex;
  align-items: center;
  min-height: 30px;
  min-width: max-content;
  padding: 0 28px 0 0;
  position: relative;
  line-height: 1.65;
}
.mc-line.active {
  background: var(--bg-active);
}
.mc-line.has-err {
  background: rgba(239, 68, 68, 0.07);
}
.mc-gutter {
  width: 44px;
  flex-shrink: 0;
  text-align: right;
  padding-right: 12px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11.5px;
  color: var(--text-faint);
  user-select: none;
}
.mc-line.active .mc-gutter {
  color: var(--accent);
  font-weight: 600;
}
.mc-line.has-err .mc-gutter {
  color: var(--err);
  font-weight: 700;
}
.mc-line.has-sorry .mc-gutter {
  color: var(--warn);
}
.mc-indent-guides {
  display: inline-flex;
  align-self: stretch;
  flex-shrink: 0;
  pointer-events: none;
}
.mc-indent-guide {
  display: inline-block;
  width: 22px;
  align-self: stretch;
  border-left: 1px solid rgba(140, 140, 165, 0.22);
}
.mc-line.active .mc-indent-guide {
  border-left-color: rgba(96, 165, 250, 0.35);
}
.mc-content {
  flex: 1;
  display: inline-flex;
  align-items: center;
  flex-wrap: nowrap;
  white-space: nowrap;
  min-height: 26px;
  font-family: "KaTeX_Main", "Times New Roman", "Hiragino Mincho ProN", serif;
  font-size: 16px;
  letter-spacing: 0.01em;
}
/* Mathcha Structured Nodes & Slots */
.mc-seq {
  display: inline-flex;
  align-items: center;
  flex-wrap: nowrap;
  white-space: nowrap;
  min-height: 20px;
  min-width: 4px;
  position: relative;
}
.mc-slot {
  display: inline-flex;
  align-items: center;
  min-width: 12px;
  min-height: 19px;
  padding: 0 2px;
  border: 1px dashed transparent;
  border-radius: 2px;
  transition: border-color 0.1s, background 0.1s;
}
.mc-slot.empty {
  border-color: var(--text-faint);
  background: rgba(128,128,128,0.06);
}
.mc-slot.focused-slot {
  border-color: rgba(96, 165, 250, 0.45);
  background: rgba(96, 165, 250, 0.05);
}
/* Fraction Node */
.mc-frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 3px;
  padding: 1px 2px;
  border-radius: 2px;
}
.mc-frac-num {
  border-bottom: 1px solid var(--text);
  padding: 0 4px 1px 4px;
  font-size: 0.9em;
  line-height: 1.2;
}
.mc-frac-den {
  padding: 1px 4px 0 4px;
  font-size: 0.9em;
  line-height: 1.2;
}
/* Subscript / Superscript Nodes */
.mc-sub {
  display: inline-flex;
  vertical-align: sub;
  font-size: 0.72em;
  line-height: 1;
  margin-left: 1px;
  transform: translateY(3px);
}
.mc-sup {
  display: inline-flex;
  vertical-align: super;
  font-size: 0.72em;
  line-height: 1;
  margin-left: 1px;
  transform: translateY(-5px);
}
/* Absolute value |...| and Paren (...) Nodes */
.mc-abs {
  display: inline-flex;
  align-items: center;
  border-left: 1.5px solid var(--text);
  border-right: 1.5px solid var(--text);
  padding: 0 4px;
  margin: 0 2px;
}
/* Root Node */
.mc-sqrt {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
}
.mc-sqrt-deg {
  font-size: 0.65em;
  transform: translateY(-6px);
  margin-right: -2px;
}
.mc-sqrt-sign {
  font-size: 1.1em;
  margin-right: 1px;
  user-select: none;
}
.mc-sqrt-body {
  border-top: 1px solid var(--text);
  padding: 1px 3px 0 2px;
}
/* Delimiter Nodes: norm ||x||, floor, ceil, set, inner */
.mc-delim {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
}
.mc-delim-char {
  font-family: "KaTeX_Main", serif;
  font-size: 1.08em;
  color: var(--math-sym);
  user-select: none;
  padding: 0 1px;
}
.mc-norm {
  display: inline-flex;
  align-items: center;
  border-left: 3px double var(--text);
  border-right: 3px double var(--text);
  padding: 0 4px;
  margin: 0 2px;
}
/* Binomial Node */
.mc-binom {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
}
.mc-binom-paren {
  font-size: 1.55em;
  line-height: 1;
  font-weight: 300;
  color: var(--text);
  user-select: none;
}
.mc-binom-col {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 0 2px;
  font-size: 0.85em;
  line-height: 1.15;
}
/* Big Operator Node (sum, prod, int, lim) */
.mc-bigop {
  display: inline-flex;
  align-items: center;
  margin: 0 3px;
}
.mc-bigop-stack {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.05;
  margin-right: 2px;
}
.mc-bigop-sup {
  font-size: 0.68em;
}
.mc-bigop-sym {
  font-family: "KaTeX_Size1", "KaTeX_Main", serif;
  font-size: 1.25em;
  color: var(--math-sym);
  user-select: none;
}
.mc-bigop-sub {
  font-size: 0.68em;
}
/* Accent Node (vec, hat, bar, tilde) */
.mc-accent {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 1px;
}
.mc-accent-mark {
  font-size: 0.72em;
  line-height: 0.6;
  margin-bottom: -1px;
  user-select: none;
  color: var(--text);
}
.mc-accent-bar {
  border-top: 1px solid var(--text);
  padding-top: 1px;
}
/* Inferred Hypothesis Badge (e.g. Fix eps | h_eps  [: eps > 0]) */
.mc-inferred-badge {
  display: inline-flex;
  align-items: center;
  margin-left: 8px;
  padding: 0 6px;
  font-size: 12.5px;
  font-family: "KaTeX_Main", serif;
  color: var(--text-dim);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 3px;
  user-select: none;
}
/* Atomic Symbol & Syntax Highlighting */
.mc-sym {
  display: inline-block;
  padding: 0 2px;
  color: var(--math-sym);
  font-family: "KaTeX_Main", "KaTeX_Math", serif;
}
.mc-sym.greek {
  font-family: "KaTeX_Math", "Times New Roman", serif;
  font-style: italic;
  color: var(--math-var);
}
.mc-sym.bb {
  font-family: "KaTeX_AMS", "KaTeX_Main", serif;
  color: var(--accent);
}
.mc-kw-decl {
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--kw-decl);
}
.mc-kw-step {
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--kw-step);
}
.mc-kw-just {
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  color: var(--kw-just);
}
.mc-kw-jp {
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 13.5px;
  color: var(--kw-jp);
  margin: 0 4px;
  user-select: none;
}
.mc-var {
  font-family: "KaTeX_Math", "Times New Roman", serif;
  font-style: italic;
  color: var(--math-var);
}
.mc-ident-fn {
  font-family: "KaTeX_Main", serif;
  font-style: normal;
  color: var(--math-var);
}
.mc-num {
  font-family: "KaTeX_Main", serif;
  color: var(--math-num);
}
.mc-comment {
  font-family: -apple-system, "Hiragino Sans", sans-serif;
  font-size: 13px;
  color: var(--text-dim);
}
.mc-heading {
  font-family: -apple-system, "Hiragino Sans", sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.mc-cmd-draft {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  color: var(--accent);
  background: rgba(96, 165, 250, 0.14);
  border-radius: 2px;
  padding: 0 2px;
}
/* Blinking Caret inside structured sequence */
.mc-caret {
  display: inline-block;
  width: 0;
  height: 17px;
  border-left: 1.8px solid var(--caret);
  margin: 0 -0.9px;
  vertical-align: middle;
  animation: mc-blink 1.05s steps(1) infinite;
  pointer-events: none;
}
@keyframes mc-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Autocomplete Popup */
.ac-popup {
  position: fixed;
  z-index: 100;
  background: var(--bg-elev);
  border: 1px solid var(--border-focus);
  border-radius: 3px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  min-width: 220px;
  max-height: 220px;
  overflow-y: auto;
  display: none;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
}
.ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  cursor: pointer;
  gap: 12px;
}
.ac-item.active, .ac-item:hover {
  background: var(--bg-active);
  color: var(--accent);
}
.ac-preview {
  font-family: "KaTeX_Main", serif;
  font-size: 15px;
  min-width: 36px;
}
.ac-cmd {
  color: var(--text);
  font-weight: 500;
}
.ac-desc {
  color: var(--text-dim);
  font-size: 11px;
  margin-left: auto;
}

/* Right Pane */
.inspector {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  min-height: 0;
}
.insp-tabs {
  height: 34px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 16px;
}
.insp-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-family: "JetBrains Mono", sans-serif;
  height: 34px;
  padding: 0 2px;
  cursor: pointer;
}
.insp-tab:hover { color: var(--text); }
.insp-tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.insp-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  display: none;
}
.insp-body.active { display: block; }
.sec-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin: 0 0 8px 0;
  display: flex;
  justify-content: space-between;
}
.hyp-row {
  padding: 5px 10px;
  border-left: 2px solid var(--border-focus);
  background: var(--bg-elev);
  margin-bottom: 4px;
  font-size: 13.5px;
}
.goal-panel {
  padding: 12px 14px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  margin-bottom: 18px;
}
.err-banner {
  padding: 10px 12px;
  border-left: 2px solid var(--err);
  background: rgba(239, 68, 68, 0.08);
  color: var(--err);
  font-size: 12.5px;
  margin-bottom: 14px;
  white-space: pre-wrap;
}
.prose-doc {
  line-height: 1.85;
  font-size: 14px;
}
.prose-thm {
  padding: 10px 14px;
  border-left: 2px solid var(--accent);
  background: var(--bg-elev);
  margin: 14px 0 8px 0;
}
.prose-proof {
  padding-left: 12px;
  border-left: 1px solid var(--border);
  margin-bottom: 20px;
}
.raw-box {
  width: 100%;
  height: calc(100vh - 140px);
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  line-height: 1.6;
  resize: none;
  outline: none;
}
.mc-ghost { color: var(--text-faint); font-style: italic; margin-left: 6px; user-select: none; }
.mc-ghost-key { font-family: "JetBrains Mono", monospace; font-size: 10px; font-style: normal; border: 1px solid var(--border); border-radius: 2px; padding: 0 4px; margin-left: 6px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <span class="logo">NARFI</span>
    <select id="fileSelect" class="ctrl-select" title="Workspace Files">
      <option value="">untitled.narfi</option>
    </select>
    <button class="ctrl-btn" onclick="saveFile()">Save</button>
    <button id="btnJpLens" class="ctrl-btn" onclick="toggleJpLens()" title="エディタ上の表示を日本語シュガーレンズに切り替え（裏のASCIIコードは不変）">JP Sugar View: OFF</button>
  </div>
  <div class="topbar-right">
    <span id="statusPill" class="status-pill ok">READY</span>
    <button id="btnInspector" class="ctrl-btn active" onclick="toggleInspector()" title="Toggle Right Pane">Inspector</button>
    <button id="btnTheme" class="ctrl-btn" onclick="toggleTheme()">Light / Dark</button>
  </div>
</div>

<div class="workspace" id="workspaceEl">
  <!-- Left: Mathcha-style Inline Structured Editor -->
  <div id="editorSurface" class="editor-surface" tabindex="0"></div>
  <div id="acPopup" class="ac-popup"></div>

  <!-- Draggable Splitter -->
  <div id="paneResizer" class="pane-resizer" title="Drag to resize / Double-click to collapse"></div>

  <!-- Right: Inspector & Views -->
  <div id="inspectorPane" class="inspector">
    <div class="insp-tabs">
      <button class="insp-tab active" onclick="switchTab('goal', this)">Goal</button>
      <button class="insp-tab" onclick="switchTab('prose', this)">Prose (JP)</button>
      <button class="insp-tab" onclick="switchTab('code', this)">ASCII Code</button>
      <button class="insp-tab" onclick="switchTab('latex', this)">LaTeX</button>
      <button class="insp-tab" onclick="switchTab('ai', this)">AI</button>
    </div>

    <div id="tab-goal" class="insp-body active">
      <div id="errBannerArea"></div>
      <div class="sec-label">
        <span>Context &amp; Goal (<span id="curLineLabel">Ln 1</span>)</span>
        <span id="curDeclLabel"></span>
      </div>
      <div id="goalViewArea"></div>

      <div class="sec-label" style="margin-top:22px;">
        <span>Declarations</span>
        <span id="declCountLabel"></span>
      </div>
      <div id="declListArea"></div>
    </div>

    <div id="tab-prose" class="insp-body">
      <div class="sec-label">
        <span>Japanese Proof View</span>
        <button class="ctrl-btn" onclick="copyProseMd()">Copy Markdown</button>
      </div>
      <div id="proseDocArea" class="prose-doc"></div>
    </div>

    <div id="tab-code" class="insp-body">
      <div class="sec-label">
        <span>Underlying Pure ASCII Code (.narfi)</span>
        <button class="ctrl-btn" onclick="applyRawCodeEdit()">Apply Text Edits</button>
      </div>
      <textarea id="rawAsciiArea" class="raw-box" spellcheck="false"></textarea>
    </div>

    <div id="tab-latex" class="insp-body">
      <div class="sec-label">
        <span>LaTeX Output (theorem / proof)</span>
        <button class="ctrl-btn" onclick="copyLatex()">Copy LaTeX</button>
      </div>
      <textarea id="latexArea" class="raw-box" readonly></textarea>
    </div>

    <div id="tab-ai" class="insp-body">
      <div class="sec-label"><span>Provider</span><span id="cliStatus"></span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
        <select id="aiProvider" class="ctrl-select">
          <option value="auto">Auto (API Key / Local CLI)</option>
          <option value="opencode_go">OpenCode Go / OpenAI Compat</option>
          <option value="gemini_api">Gemini API</option>
          <option value="anthropic_api">Anthropic API</option>
          <option value="claude_cli">claude CLI</option>
          <option value="gemini_cli">gemini CLI</option>
        </select>
        <input id="aiModel" class="ctrl-input" placeholder="Model (optional)">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
        <input id="aiBase" class="ctrl-input" placeholder="API Endpoint URL">

let nextSeqId = 1;
const seqMap = new Map();

function createSeq(items = [], parentNode = null, slotName = null) {
  const seq = { id: nextSeqId++, items, parentNode, slotName };
  for (const it of items) {
    it.parentSeq = seq;
    if (it.kind === "frac" || it.kind === "binom") {
      it.num.parentNode = it; it.num.slotName = "num";
      it.den.parentNode = it; it.den.slotName = "den";
    } else if (it.kind === "bigop") {
      it.sub.parentNode = it; it.sub.slotName = "sub";
      it.sup.parentNode = it; it.sup.slotName = "sup";
      it.body.parentNode = it; it.body.slotName = "body";
    } else if (it.body) {
      it.body.parentNode = it; it.body.slotName = "body";
    }
  }
  seqMap.set(seq.id, seq);
  return seq;
}

function makeChar(ch) { return { kind: "char", ch }; }
function makeSym(ascii, display, cls = "") { return { kind: "sym", ascii, display, cls }; }
function makeFrac(numItems = [], denItems = [], parentSeq = null) {
  const node = { kind: "frac", num: null, den: null, parentSeq };
  node.num = createSeq(numItems, node, "num");
  node.den = createSeq(denItems, node, "den");
  return node;
}

  const node = { kind: "binom", num: null, den: null, parentSeq };
  node.num = createSeq(numItems, node, "num");

  return node;
}
function makeSub(bodyItems = [], parentSeq = null) {
  const node = { kind: "sub", body: null, parentSeq };

}

function makeDelim(fnName, leftCh, rightCh, bodyItems = [], parentSeq = null) {
  const node = { kind: "delim", fnName, leftCh, rightCh, body: null, parentSeq };

function makeAccent(fnName, mark, bodyItems = [], parentSeq = null) {
  const node = { kind: "accent", fnName, mark, body: null, parentSeq };

  return node;
}
function makeBigOp(fnName, sym, subItems = [], supItems = [], bodyItems = [], parentSeq = null) {
  const node = { kind: "bigop", fnName, sym, sub: null, sup: null, body: null, parentSeq };
  node.sub = createSeq(subItems, node, "sub");

}

const UNICODE_TO_SYM = {};
const WORD_TO_SYM = {};

  if (c.kind === "sym") {
    UNICODE_TO_SYM[c.display] = [c.ascii, c.display, c.cls || ""];
    WORD_TO_SYM[c.ascii] = [c.ascii, c.display, c.cls || ""];
    if (["epsilon", "varepsilon", "vartheta", "varphi"].includes(c.cmd)) {
      WORD_TO_SYM[c.cmd] = [c.ascii, c.display, c.cls || ""];
    }
  }
}

function findMatchingClose(str, openIdx, openCh, closeCh) {
  let depth = 0;
  for (let i = openIdx; i < str.length; i++) {
    if (str[i] === openCh) depth++;
    else if (str[i] === closeCh) {
      depth--;
      if (depth === 0) return i;
    }
  }
  return -1;
}

function splitTopLevelCommaArgs(str) {
  const parts = [];
  let depth = 0;
  let last = 0;
  for (let i = 0; i < str.length; i++) {
    if (str[i] === "(" || str[i] === "{") depth++;
    else if (str[i] === ")" || str[i] === "}") depth--;
    else if (str[i] === "," && depth === 0) {
      parts.push(str.substring(last, i).trim());
      last = i + 1;
    }
  }
  parts.push(str.substring(last).trim());
  return parts;
}

function parseAsciiToItems(str) {
  const trimmed = str.trimStart();
  if (trimmed.startsWith("//") || trimmed.startsWith("--") || trimmed.startsWith("#")) {
    return Array.from(str).map(makeChar);
  }
  const items = [];
  let i = 0;
  while (i < str.length) {
    const ch = str[i];

    // 1. Structured Function Calls: abs(...), sqrt(...), norm(...), floor(...), ceil(...), set(...), inner(...), binom(n,k), vec/hat/bar/tilde(...), sum/prod/int(...)
    const fnMatch = str.slice(i).match(/^(abs|sqrt|norm|floor|ceil|set|inner|binom|vec|hat|bar|tilde|sum|prod|int)\(/);
    if (fnMatch) {
      const fnName = fnMatch[1];
      const openIdx = i + fnName.length;
      const closeIdx = findMatchingClose(str, openIdx, "(", ")");
      if (closeIdx > openIdx) {
        const inner = str.substring(openIdx + 1, closeIdx);
        if (fnName === "abs") items.push(makeAbs(parseAsciiToItems(inner)));
        else if (fnName === "sqrt") items.push(makeSqrt(parseAsciiToItems(inner)));
        else if (fnName === "norm") items.push(makeDelim("norm", "‖", "‖", parseAsciiToItems(inner)));
        else if (fnName === "floor") items.push(makeDelim("floor", "⌊", "⌋", parseAsciiToItems(inner)));
        else if (fnName === "ceil") items.push(makeDelim("ceil", "⌈", "⌉", parseAsciiToItems(inner)));
        else if (fnName === "set") items.push(makeDelim("set", "{", "}", parseAsciiToItems(inner)));
        else if (fnName === "inner") items.push(makeDelim("inner", "⟨", "⟩", parseAsciiToItems(inner)));
        else if (fnName === "binom") {
          const [a, b] = splitTopLevelCommaArgs(inner);
          items.push(makeBinom(parseAsciiToItems(a || ""), parseAsciiToItems(b || "")));
        } else if (["vec", "hat", "bar", "tilde"].includes(fnName)) {
          const markMap = { vec: "→", hat: "^", bar: "bar", tilde: "~" };
          items.push(makeAccent(fnName, markMap[fnName], parseAsciiToItems(inner)));
        } else if (["sum", "prod", "int"].includes(fnName)) {
          const [subS, supS, bodyS] = splitTopLevelCommaArgs(inner);
          const symMap = { sum: "∑", prod: "∏", int: "∫" };
          items.push(makeBigOp(fnName, symMap[fnName], parseAsciiToItems(subS || ""), parseAsciiToItems(supS || ""), parseAsciiToItems(bodyS || "")));
        }
        i = closeIdx + 1;
        continue;
      }
    }

    // |...| -> Abs node (when not |- and not Fix x | h)
    if (ch === "|" && str[i + 1] !== "-" && str[i - 1] !== " ") {
      const nextBar = str.indexOf("|", i + 1);
      if (nextBar > i + 1 && !str.substring(i + 1, nextBar).includes(" : ")) {
        const inner = str.substring(i + 1, nextBar);
        items.push(makeAbs(parseAsciiToItems(inner)));
        i = nextBar + 1;
        continue;
      }
    }

    // 2. Unicode subscripts ₀..₉
    if (ch >= "₀" && ch <= "₉") {
      const d = String(ch.charCodeAt(0) - "₀".charCodeAt(0));
      items.push(makeSub([makeChar(d)]));
      i++;
      continue;
    }

    // 3. _ subscript: _{...} or _digit
    if (ch === "_" && i + 1 < str.length) {
      if (str[i + 1] === "{") {
        const closeIdx = findMatchingClose(str, i + 1, "{", "}");
        if (closeIdx > i + 1) {
          const inner = str.substring(i + 2, closeIdx);
          items.push(makeSub(parseAsciiToItems(inner)));
          i = closeIdx + 1;
          continue;
        }
      } else if (/[0-9]/.test(str[i + 1])) {
        let j = i + 1;
        while (j < str.length && /[0-9]/.test(str[j])) j++;
        items.push(makeSub(Array.from(str.substring(i + 1, j)).map(makeChar)));
        i = j;
        continue;
      }
    }

    // 4. ^ superscript: ^{...} or ^digit or ²/³
    if (ch === "²" || ch === "³") {
      items.push(makeSup([makeChar(ch === "²" ? "2" : "3")]));
      i++;
      continue;
    }
    if (ch === "^" && i + 1 < str.length) {
      if (str[i + 1] === "{") {
        const closeIdx = findMatchingClose(str, i + 1, "{", "}");
        if (closeIdx > i + 1) {
          const inner = str.substring(i + 2, closeIdx);
          items.push(makeSup(parseAsciiToItems(inner)));
          i = closeIdx + 1;
          continue;
        }
      } else if (/[0-9a-zA-Z]/.test(str[i + 1])) {
        items.push(makeSup([makeChar(str[i + 1])]));
        i += 2;
        continue;
      }
    }

    // 5. Multi-char ASCII operators
    if (str.startsWith("<->", i)) { items.push(makeSym("<->", "↔")); i += 3; continue; }
    if (str.startsWith("->", i)) { items.push(makeSym("->", "→")); i += 2; continue; }
    if (str.startsWith("<-", i)) { items.push(makeSym("<-", "⇐")); i += 2; continue; }
    if (str.startsWith("<=", i) || str.startsWith("=<", i)) { items.push(makeSym("<=", "≤")); i += 2; continue; }
    if (str.startsWith(">=", i)) { items.push(makeSym(">=", "≥")); i += 2; continue; }
    if (str.startsWith("!=", i)) { items.push(makeSym("!=", "≠")); i += 2; continue; }
    if (str.startsWith("|-", i)) { items.push(makeSym("|-", "⊢")); i += 2; continue; }

    // 6. Direct Unicode symbol
    if (UNICODE_TO_SYM[ch]) {
      const [asc, disp, cls] = UNICODE_TO_SYM[ch];
      items.push(makeSym(asc, disp, cls));
      i++;
      continue;
    }

    // 7. Fraction `/`
    if (ch === "/" && str[i + 1] !== "/" && str[i + 1] !== "\\") {
      while (items.length > 0 && items[items.length - 1].kind === "char" && items[items.length - 1].ch === " ") {
        items.pop();
      }
      const numItems = popPrecedingTermItems(items);
      i++;
      while (i < str.length && str[i] === " ") i++;
      const [denStr, nextI] = readFollowingTermAtom(str, i);
      const denItems = parseAsciiToItems(denStr);
      items.push(makeFrac(numItems, denItems));
      i = nextI;
      continue;
    }

    // 8. Identifier / Keyword / Greek word
    if (/[A-Za-zα-ωΑ-Ω]/.test(ch)) {
      let j = i + 1;
      while (j < str.length && (/[A-Za-z0-9_']/.test(str[j]) && !(str[j] === "_" && /[0-9{]/.test(str[j + 1] || "")))) {
        j++;
      }
      const word = str.substring(i, j);
      if (WORD_TO_SYM[word]) {
        const [asc, disp, cls] = WORD_TO_SYM[word];
        items.push(makeSym(asc, disp, cls));
      } else {
        for (const c of word) items.push(makeChar(c));
      }
      i = j;
      continue;
    }

    items.push(makeChar(ch));
    i++;
  }
  return items;
}

function popPrecedingTermItems(items) {
  if (items.length === 0) return [];
  const last = items[items.length - 1];
  if (["sym", "frac", "abs", "sqrt", "delim", "binom", "accent", "bigop"].includes(last.kind)) {
    return [items.pop()];
  }
  if (last.kind === "sub" || last.kind === "sup") {
    const subOrSup = items.pop();
    const base = popPrecedingTermItems(items);
    return [...base, subOrSup];
  }
  if (last.kind === "char" && last.ch === ")") {
    let depth = 0;
    const popped = [];
    while (items.length > 0) {
      const it = items.pop();
      popped.unshift(it);
      if (it.kind === "char" && it.ch === ")") depth++;
      else if (it.kind === "char" && it.ch === "(") {
        depth--;
        if (depth === 0) break;
      }
    }
    if (popped.length >= 2 && popped[0].kind === "char" && popped[0].ch === "(" && popped[popped.length - 1].kind === "char" && popped[popped.length - 1].ch === ")") {
      return popped.slice(1, -1);
    }
    return popped;
  }
  const popped = [];
  while (items.length > 0) {
    const it = items[items.length - 1];
    if (it.kind === "char" && /[A-Za-z0-9.]/.test(it.ch)) {
      popped.unshift(items.pop());
    } else if (it.kind === "sym" && it.cls === "greek") {
      popped.unshift(items.pop());
      break;
    } else {
      break;
    }
  }
  return popped;
}

function readFollowingTermAtom(str, start) {
  if (start >= str.length) return ["", start];
  if (str[start] === "(") {
    const closeIdx = findMatchingClose(str, start, "(", ")");
    if (closeIdx > start) {
      return [str.substring(start + 1, closeIdx), closeIdx + 1];
    }
  }
  let j = start;
  while (j < str.length && /[A-Za-z0-9_α-ωε{]/.test(str[j])) {
    if (str[j] === "{") {
      const closeIdx = findMatchingClose(str, j, "{", "}");
      if (closeIdx > j) { j = closeIdx + 1; continue; }
    }
    if (str[j] === "(") {
      const closeIdx = findMatchingClose(str, j, "(", ")");
      if (closeIdx > j) { j = closeIdx + 1; break; }
    }
    j++;
  }
  return [str.substring(start, j), j];
}

// ================================================================
// 3. Serialize Structured Sequence -> Pure ASCII Code
// ================================================================

function needsAtomParens(s) {
  const t = s.trim();
  if (!t) return false;
  for (let i = 0; i < t.length; i++) {
    if ("+-*/ ".includes(t[i])) return true;
  }
  return false;
}

function isAlphaNumChar(ch) {
  return Boolean(ch && /[A-Za-z0-9_]/.test(ch));
}

function serializeSeqToAscii(seq) {
  let out = "";
  const items = seq.items;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.kind === "char") {
      out += it.ch;
    } else if (it.kind === "sym") {
      const wordLike = /^[A-Za-z]+$/.test(it.ascii);
      if (wordLike && out.length > 0 && isAlphaNumChar(out[out.length - 1])) {
        out += " ";
      }
      out += it.ascii;
      const next = items[i + 1];
      const nextIsAlpha = next && ((next.kind === "char" && isAlphaNumChar(next.ch)) || (next.kind === "sym" && /^[A-Za-z]+$/.test(next.ascii)));
      const nextIsRelOrDot = next && ((next.kind === "char" && ".:,)><=".includes(next.ch)) || (next.kind === "sym" && ["<=", ">=", "!=", "in", "notin", "subset", "subseteq"].includes(next.ascii)) || next.kind === "sub" || next.kind === "sup");
      if (wordLike && nextIsAlpha && !nextIsRelOrDot) {
        out += " ";
      }
    } else if (it.kind === "frac") {
      const n = serializeSeqToAscii(it.num).trim() || "1";
      const d = serializeSeqToAscii(it.den).trim() || "1";
      const nCode = needsAtomParens(n) ? `(${n})` : n;
      const dCode = needsAtomParens(d) ? `(${d})` : d;
      out += `${nCode}/${dCode}`;
    } else if (it.kind === "sub") {
      const b = serializeSeqToAscii(it.body).trim();
      if (/^[0-9]$/.test(b)) {
        out += `_${b}`;
      } else if (b.length > 0) {
        out += `_{${b}}`;
      }
    } else if (it.kind === "sup") {
      const b = serializeSeqToAscii(it.body).trim();
      if (/^[0-9a-zA-Z]$/.test(b)) {
        out += `^${b}`;
      } else if (b.length > 0) {
        out += `^{${b}}`;
      }
    } else if (it.kind === "abs") {
      out += `abs(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "sqrt") {
      out += `sqrt(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "delim") {
      out += `${it.fnName}(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "binom") {
      out += `binom(${serializeSeqToAscii(it.num).trim() || "0"}, ${serializeSeqToAscii(it.den).trim() || "0"})`;
    } else if (it.kind === "accent") {
      out += `${it.fnName}(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "bigop") {
      out += `${it.fnName}(${serializeSeqToAscii(it.sub).trim() || "0"}, ${serializeSeqToAscii(it.sup).trim() || "0"}, ${serializeSeqToAscii(it.body).trim() || "0"})`;
    }
  }
  return out;
}

// Render a slice of items [startIdx, endIdx) inside `seq` with syntax highlighting and caret

    if (next.kind === "sub" || next.kind === "sup") return false;
  }
  return true;
}

function findCharIndexInItems(items, ch, fromIdx = 0) {
  let parenDepth = 0;
  for (let i = fromIdx; i < items.length; i++) {
    if (items[i].kind === "char") {
      if (items[i].ch === "(") parenDepth++;
      else if (items[i].ch === ")") parenDepth--;
      else if (parenDepth === 0 && items[i].ch === ch) return i;
    }
  }
  return -1;
}

function findSubstrIndexInItems(items, pat, fromIdx = 0) {
  for (let i = fromIdx; i + pat.length <= items.length; i++) {
    let ok = true;
    for (let k = 0; k < pat.length; k++) {
      if (items[i + k].kind !== "char" || items[i + k].ch !== pat[k]) { ok = false; break; }
    }
    if (ok) return i;
  }
  return -1;
}

// Look up the kernel-inferred hypothesis formula introduced on `lineNo` (1-indexed)
function getInferredFixHypFormula(lineNo, rootSeq) {
  if (!lastCheckData || !lastCheckData.decls) return "";
  const items = rootSeq.items;
  if (!matchKeywordPrefix(items, "Fix ")) return "";
  const barIdx = findCharIndexInItems(items, "|", 4);
  if (barIdx < 0) return "";
  // If the user already wrote `: formula` after `| h`, no badge needed
  if (findCharIndexInItems(items, ":", barIdx + 1) >= 0) return "";

  for (const d of lastCheckData.decls) {
    const steps = d.steps || [];
    for (let idx = 0; idx < steps.length; idx++) {
      if (steps[idx].line === lineNo && idx + 1 < steps.length) {
        const curCtx = new Set(steps[idx].ctx || []);
        const nextCtx = steps[idx + 1].ctx || [];
        for (const entry of nextCtx) {
          if (!curCtx.has(entry) && entry.includes(" : ") && !entry.endsWith("(Fix)") && !entry.endsWith("(Obtain)")) {
            const colonPos = entry.indexOf(" : ");
            return entry.substring(colonPos + 3);
          }
        }
      }
    }
  }
  return "";
}

let pendingHypSuggestion = null;

function renderRootSeqWithLens(rootSeq, lineNo) {
  const items = rootSeq.items;
  const isCursorInKeywordPrefix = (kwLen) => (cursor.seqId === rootSeq.id && cursor.offset <= kwLen);
  const atLineEnd = cursor.seqId === rootSeq.id && cursor.offset === items.length;
  const suggestHyp = atLineEnd ? getInferredFixHypFormula(lineNo, rootSeq) : "";
  if (suggestHyp) pendingHypSuggestion = { seqId: rootSeq.id, text: suggestHyp };
  const badgeHtml = suggestHyp ? `<span class="mc-ghost">: ${escHtml(suggestHyp)}<span class="mc-ghost-key">Tab</span></span>` : "";

  if (!jpSugarLens) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">${renderItemsSliceHtml(rootSeq, 0, items.length)}${badgeHtml}</span>`;
  }

  if (matchKeywordPrefix(items, "thm ") && !isCursorInKeywordPrefix(4)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp" onclick="setCursor(${rootSeq.id}, 0)">定理</span>` +
      renderItemsSliceHtml(rootSeq, 4, items.length) +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "axiom ") && !isCursorInKeywordPrefix(6)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp" onclick="setCursor(${rootSeq.id}, 0)">公理</span>` +
      renderItemsSliceHtml(rootSeq, 6, items.length) +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "Fix ") && !isCursorInKeywordPrefix(4)) {
    const barIdx = findCharIndexInItems(items, "|", 4);
    if (barIdx > 4) {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        renderItemsSliceHtml(rootSeq, barIdx + 1, items.length) +
        `<span class="mc-kw-jp">を満たす</span>` +
        renderItemsSliceHtml(rootSeq, 4, barIdx) +
        `<span class="mc-kw-jp">を任意にとって固定する</span>` +
        `</span>`;
    } else {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        `<span class="mc-kw-jp">任意の</span>` +
        renderItemsSliceHtml(rootSeq, 4, items.length) +
        `<span class="mc-kw-jp">をとって固定する</span>` +
        `</span>`;
    }
  }
  if (matchKeywordPrefix(items, "assume ") && !isCursorInKeywordPrefix(7)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 7, items.length) +
      `<span class="mc-kw-jp">と仮定する</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "by_contra ") && !isCursorInKeywordPrefix(10)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp">背理法により</span>` +
      renderItemsSliceHtml(rootSeq, 10, items.length) +
      `<span class="mc-kw-jp">と仮定する</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "Obtain ") && !isCursorInKeywordPrefix(7)) {
    const colonIdx = findCharIndexInItems(items, ":", 7);
    if (colonIdx > 7) {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        renderItemsSliceHtml(rootSeq, colonIdx + 1, items.length) +
        `<span class="mc-kw-jp">より</span>` +
        renderItemsSliceHtml(rootSeq, 7, colonIdx) +
        `<span class="mc-kw-jp">が存在する</span>` +
        `</span>`;
    }
  }
  if (matchKeywordPrefix(items, "let ") && !isCursorInKeywordPrefix(4)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 4, items.length) +
      `<span class="mc-kw-jp">とおく</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "choose ") && !isCursorInKeywordPrefix(7)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 7, items.length) +
      `<span class="mc-kw-jp">をうまく選べばよい</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "have ") && !isCursorInKeywordPrefix(5)) {
    const defIdx = findSubstrIndexInItems(items, ":=", 5);
    if (defIdx > 5) {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        renderItemsSliceHtml(rootSeq, defIdx + 2, items.length) +
        `<span class="mc-kw-jp">より</span>` +
        renderItemsSliceHtml(rootSeq, 5, defIdx) +
        `<span class="mc-kw-jp">が成り立つ</span>` +
        `</span>`;
    }
  }
  if (items.length > 0 && items[0].kind === "sym" && items[0].ascii === "therefore" && !(cursor.seqId === rootSeq.id && cursor.offset === 0)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp">したがって</span>` +
      renderItemsSliceHtml(rootSeq, 1, items.length) +
      `</span>`;
  }
  const byIdx = findSubstrIndexInItems(items, " by ", 0);
  if (byIdx > 0 && !(cursor.seqId === rootSeq.id && cursor.offset >= byIdx && cursor.offset <= byIdx + 4)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 0, byIdx) +
      `<span class="mc-kw-jp" style="margin-left:12px;">(∵</span>` +
      renderItemsSliceHtml(rootSeq, byIdx + 4, items.length) +
      `<span class="mc-kw-jp">)</span>` +
      `</span>`;
  }

  return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">${renderItemsSliceHtml(rootSeq, 0, items.length)}${badgeHtml}</span>`;
}
</script>
<script>
// ================================================================
// 6. Editor Rendering & Interactive Key Handling
// ================================================================

const editorSurface = document.getElementById("editorSurface");
const acPopup = document.getElementById("acPopup");

function renderEditor() {
  pendingHypSuggestion = null;
  const errLines = new Set();
  const sorryLines = new Set();
  if (lastCheckData) {
    if (lastCheckData.parse_error && lastCheckData.parse_error.line) {
      errLines.add(lastCheckData.parse_error.line);
    }
    for (const d of (lastCheckData.decls || [])) {
      if (d.error && d.error.line) errLines.add(d.error.line);
      for (const sr of (d.sorries || [])) {
        if (sr.line) sorryLines.add(sr.line);
      }
    }
  }

  let html = "";
  for (let i = 0; i < docLines.length; i++) {
    const lineNo = i + 1;
    const ln = docLines[i];
    const cls = ["mc-line"];
    if (i === cursor.lineIdx) cls.push("active");
    if (errLines.has(lineNo)) cls.push("has-err");
    else if (sorryLines.has(lineNo)) cls.push("has-sorry");

    let guides = "";
    for (let g = 0; g < ln.indent; g++) {
      guides += `<span class="mc-indent-guide"></span>`;
    }

    html += `<div class="${cls.join(' ')}" data-line-idx="${i}">` +
      `<div class="mc-gutter">${lineNo}</div>` +
      `<div class="mc-indent-guides">${guides}</div>` +
      `<div class="mc-content" data-line-idx="${i}">${renderRootSeqWithLens(ln.rootSeq, lineNo)}</div>` +
      `</div>`;
  }
  editorSurface.innerHTML = html;
  document.getElementById("curLineLabel").textContent = `Ln ${cursor.lineIdx + 1}`;
  document.getElementById("rawAsciiArea").value = serializeDocToAscii();
  updateAutocomplete();
}

function setCursor(seqId, offset, lineIdx = null) {
  if (lineIdx !== null) cursor.lineIdx = lineIdx;
  else {
    const root = getRootSeq(seqMap.get(seqId));
    if (root) {
      const idx = docLines.findIndex(l => l.rootSeq.id === root.id);
      if (idx >= 0) cursor.lineIdx = idx;
    }
  }
  const seq = seqMap.get(seqId);
  if (!seq) return;
  cursor.seqId = seqId;
  cursor.offset = Math.max(0, Math.min(offset, seq.items.length));
  renderEditor();
  renderGoalInspector();
}

function getRootSeq(seq) {
  let cur = seq;
  while (cur && cur.parentNode && cur.parentNode.parentSeq) {
    cur = cur.parentNode.parentSeq;
  }
  return cur;
}

// Mouse click positioning inside structured math editor
editorSurface.addEventListener("mousedown", (e) => {
  editorSurface.focus();
  const itemEl = e.target.closest("[data-seq][data-idx]");
  if (itemEl) {
    const seqId = Number(itemEl.getAttribute("data-seq"));
    const idx = Number(itemEl.getAttribute("data-idx"));
    const seq = seqMap.get(seqId);
    if (seq) {
      const it = seq.items[idx];
      if (it && (it.kind === "char" || it.kind === "sym")) {
        const rect = itemEl.getBoundingClientRect();
        const after = (e.clientX - rect.left) > (rect.width / 2);
        setCursor(seqId, after ? idx + 1 : idx);
        e.preventDefault();
        return;
      }
    }
  }
  const slotEl = e.target.closest("[data-slot-seq]");
  if (slotEl) {
    const seqId = Number(slotEl.getAttribute("data-slot-seq"));
    const seq = seqMap.get(seqId);
    if (seq) {
      setCursor(seqId, seq.items.length);
      e.preventDefault();
      return;
    }
  }
  const lineEl = e.target.closest("[data-line-idx]");
  if (lineEl) {
    const lIdx = Number(lineEl.getAttribute("data-line-idx"));
    const ln = docLines[lIdx];
    if (ln) {
      setCursor(ln.rootSeq.id, ln.rootSeq.items.length, lIdx);
      e.preventDefault();
    }
  }
});

// ================================================================
// 7. Tree Cursor Navigation & Structural Editing (Mathcha Behavior)
// ================================================================

function moveCursorLeft() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  if (cursor.offset > 0) {
    const prev = seq.items[cursor.offset - 1];
    if (prev.kind === "frac" || prev.kind === "binom") {
      setCursor(prev.den.id, prev.den.items.length);
    } else if (prev.kind === "bigop") {
      setCursor(prev.body.id, prev.body.items.length);
    } else if (prev.body) {
      setCursor(prev.body.id, prev.body.items.length);
    } else {
      setCursor(seq.id, cursor.offset - 1);
    }
  } else if (seq.parentNode && seq.parentNode.parentSeq) {
    const pNode = seq.parentNode;
    const pSeq = pNode.parentSeq;
    const idx = pSeq.items.indexOf(pNode);
    if ((pNode.kind === "frac" || pNode.kind === "binom") && seq.slotName === "den") {
      setCursor(pNode.num.id, pNode.num.items.length);
    } else if (pNode.kind === "bigop" && seq.slotName === "body") {
      setCursor(pNode.sup.id, pNode.sup.items.length);
    } else if (pNode.kind === "bigop" && seq.slotName === "sup") {
      setCursor(pNode.sub.id, pNode.sub.items.length);
    } else if (idx >= 0) {
      setCursor(pSeq.id, idx);
    }
  } else if (cursor.lineIdx > 0) {
    const prevLn = docLines[cursor.lineIdx - 1];
    setCursor(prevLn.rootSeq.id, prevLn.rootSeq.items.length, cursor.lineIdx - 1);
  }
}

function moveCursorRight() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  if (cursor.offset < seq.items.length) {
    const next = seq.items[cursor.offset];
    if (next.kind === "frac" || next.kind === "binom") {
      setCursor(next.num.id, 0);
    } else if (next.kind === "bigop") {
      setCursor(next.sub.id, 0);
    } else if (next.body) {
      setCursor(next.body.id, 0);
    } else {
      setCursor(seq.id, cursor.offset + 1);
    }
  } else if (seq.parentNode && seq.parentNode.parentSeq) {
    const pNode = seq.parentNode;
    const pSeq = pNode.parentSeq;
    const idx = pSeq.items.indexOf(pNode);
    if ((pNode.kind === "frac" || pNode.kind === "binom") && seq.slotName === "num") {
      setCursor(pNode.den.id, 0);
    } else if (pNode.kind === "bigop" && seq.slotName === "sub") {
      setCursor(pNode.sup.id, 0);
    } else if (pNode.kind === "bigop" && seq.slotName === "sup") {
      setCursor(pNode.body.id, 0);
    } else if (idx >= 0) {
      setCursor(pSeq.id, idx + 1);
    }
  } else if (cursor.lineIdx + 1 < docLines.length) {
    const nextLn = docLines[cursor.lineIdx + 1];
    setCursor(nextLn.rootSeq.id, 0, cursor.lineIdx + 1);
  }
}

function moveCursorUp() {
  const seq = seqMap.get(cursor.seqId);
  if (seq && seq.parentNode && (seq.parentNode.kind === "frac" || seq.parentNode.kind === "binom") && seq.slotName === "den") {
    const numSeq = seq.parentNode.num;
    setCursor(numSeq.id, Math.min(cursor.offset, numSeq.items.length));
    return;
  }
  if (cursor.lineIdx > 0) {
    const prevLn = docLines[cursor.lineIdx - 1];
    setCursor(prevLn.rootSeq.id, Math.min(cursor.offset, prevLn.rootSeq.items.length), cursor.lineIdx - 1);
  }
}

function moveCursorDown() {
  const seq = seqMap.get(cursor.seqId);
  if (seq && seq.parentNode && (seq.parentNode.kind === "frac" || seq.parentNode.kind === "binom") && seq.slotName === "num") {
    const denSeq = seq.parentNode.den;
    setCursor(denSeq.id, Math.min(cursor.offset, denSeq.items.length));
    return;
  }
  if (cursor.lineIdx + 1 < docLines.length) {
    const nextLn = docLines[cursor.lineIdx + 1];
    setCursor(nextLn.rootSeq.id, Math.min(cursor.offset, nextLn.rootSeq.items.length), cursor.lineIdx + 1);
  }
}

function handleBackspace() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  if (cursor.offset > 0) {
    // Delete the entire item (whether char, sym, frac, sub, sup, abs) immediately!
    seq.items.splice(cursor.offset - 1, 1);
    cursor.offset -= 1;
    onDocMutated();
  } else if (seq.parentNode && seq.parentNode.parentSeq) {
    // At start of a slot inside a composite node: dissolve/delete the composite node
    const pNode = seq.parentNode;
    const pSeq = pNode.parentSeq;
    const idx = pSeq.items.indexOf(pNode);
    if (idx >= 0) {
      let rescue = [];
      if (pNode.kind === "frac") {
        rescue = [...pNode.num.items, ...pNode.den.items];
      } else if (pNode.body) {
        rescue = [...pNode.body.items];
      }
      pSeq.items.splice(idx, 1, ...rescue);
      for (const r of rescue) {
        if (r.parentSeq) r.parentSeq = pSeq;
      }
      cursor.seqId = pSeq.id;
      cursor.offset = idx;
      onDocMutated();
    }
  } else {
    // At start of root line
    const ln = docLines[cursor.lineIdx];
    if (ln.indent > 0) {
      ln.indent -= 1;
      onDocMutated();
    } else if (cursor.lineIdx > 0) {
      const prevLn = docLines[cursor.lineIdx - 1];
      const joinOffset = prevLn.rootSeq.items.length;
      for (const it of ln.rootSeq.items) {
        if (it.parentSeq) it.parentSeq = prevLn.rootSeq;
        prevLn.rootSeq.items.push(it);
      }
      docLines.splice(cursor.lineIdx, 1);
      cursor.lineIdx -= 1;
      cursor.seqId = prevLn.rootSeq.id;
      cursor.offset = joinOffset;
      onDocMutated();
    }
  }
}

// ================================================================
// 8. Typing, Shortcuts (/ _ ^ | <= ->) & Autocomplete (r + Tab)
// ================================================================

function isCommentLine(seq) {
  const root = getRootSeq(seq);
  if (!root) return false;
  let prefix = "";
  for (let i = 0; i < Math.min(4, root.items.length); i++) {
    if (root.items[i].kind === "char") prefix += root.items[i].ch;
  }
  return prefix.startsWith("//") || prefix.startsWith("--") || prefix.startsWith("#");
}

function insertCharAtCursor(ch) {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  const inComment = isCommentLine(seq);

  if (!inComment) {
    // 1. `/` -> Immediately create Fraction node with preceding term as numerator!
    if (ch === "/") {
      // Check if previous char is also `/` (making `//` comment at start of line)
      if (seq.slotName === "root" && cursor.offset === 1 && seq.items[0] && seq.items[0].kind === "char" && seq.items[0].ch === "/") {
        seq.items.splice(cursor.offset, 0, makeChar("/"));
        cursor.offset += 1;
        onDocMutated();
        return;
      }
      if (seq.slotName === "root" && cursor.offset === 0) {
        seq.items.splice(0, 0, makeChar("/"));
        cursor.offset = 1;
        onDocMutated();
        return;
      }
      const leftSlice = seq.items.slice(0, cursor.offset);
      const rightSlice = seq.items.slice(cursor.offset);
      while (leftSlice.length > 0 && leftSlice[leftSlice.length - 1].kind === "char" && leftSlice[leftSlice.length - 1].ch === " ") {
        leftSlice.pop();
      }
      const numItems = popPrecedingTermItems(leftSlice);
      const fracNode = makeFrac(numItems, [], seq);
      seq.items = [...leftSlice, fracNode, ...rightSlice];
      cursor.seqId = fracNode.den.id;
      cursor.offset = 0;
      onDocMutated();
      return;
    }

    // 2. `_` -> Immediately create Subscript slot (unless inside command draft `\...` or `by_contra`)
    if (ch === "_") {
      const prevStr = getPrecedingCharString(seq, cursor.offset, 4);
      if (!prevStr.includes("\\") && prevStr !== "by") {
        const subNode = makeSub([], seq);
        seq.items.splice(cursor.offset, 0, subNode);
        cursor.seqId = subNode.body.id;
        cursor.offset = 0;
        onDocMutated();
        return;
      }
    }

    // 3. `^` -> Immediately create Superscript slot
    if (ch === "^") {
      const supNode = makeSup([], seq);
      seq.items.splice(cursor.offset, 0, supNode);
      cursor.seqId = supNode.body.id;
      cursor.offset = 0;
      onDocMutated();
      return;
    }

    // 4. Multi-char operator shortcuts: <=, =<, >=, !=, ->, <->, |-
    const prev1 = cursor.offset >= 1 && seq.items[cursor.offset - 1].kind === "char" ? seq.items[cursor.offset - 1].ch : "";
    const prev1Sym = cursor.offset >= 1 && seq.items[cursor.offset - 1].kind === "sym" ? seq.items[cursor.offset - 1].ascii : "";
    if (prev1 === "<" && ch === "=") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("<=", "≤"));
      onDocMutated(); return;
    }
    if (prev1 === "=" && ch === "<") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("<=", "≤"));
      onDocMutated(); return;
    }
    if (prev1 === ">" && ch === "=") {
      seq.items.splice(cursor.offset - 1, 1, makeSym(">=", "≥"));
      onDocMutated(); return;
    }
    if (prev1 === "!" && ch === "=") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("!=", "≠"));
      onDocMutated(); return;
    }
    if (prev1 === "-" && ch === ">") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("->", "→"));
      onDocMutated(); return;
    }
    if (prev1Sym === "<=" && ch === ">") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("<->", "↔"));
      onDocMutated(); return;
    }
    if (prev1 === "|" && ch === "-") {
      seq.items.splice(cursor.offset - 1, 1, makeSym("|-", "⊢"));
      onDocMutated(); return;
    }
  }

  seq.items.splice(cursor.offset, 0, makeChar(ch));
  cursor.offset += 1;

  // If user pressed Space after a standalone word like `forall `, `eps `, convert word to symbol!
  if (!inComment && (ch === " " || ch === "." || ch === "," || ch === ")" || ch === ":" || ch === ">" || ch === "<")) {
    tryAutoConvertPrecedingWord(seq, cursor.offset - 1);
  }

  onDocMutated();
}

function getPrecedingCharString(seq, offset, maxLen) {
  let s = "";
  for (let i = Math.max(0, offset - maxLen); i < offset; i++) {
    if (seq.items[i].kind === "char") s += seq.items[i].ch;
    else s = "";
  }
  return s;
}

function tryAutoConvertPrecedingWord(seq, wordEndOffset) {
  let start = wordEndOffset;
  while (start > 0 && seq.items[start - 1].kind === "char" && /[A-Za-z0-9_]/.test(seq.items[start - 1].ch)) {
    start--;
  }
  if (start > 0 && seq.items[start - 1].kind === "char" && seq.items[start - 1].ch === "\\") {
    const cmd = seq.items.slice(start, wordEndOffset).map(x => x.ch).join("");
    const entry = COMMAND_DICT.find(c => c.cmd === cmd);
    if (entry) {
      applyCommandEntry(seq, start - 1, wordEndOffset + 1, entry);
      return;
    }
  }
  const word = seq.items.slice(start, wordEndOffset).map(x => x.ch).join("");
  if (WORD_TO_SYM[word]) {
    const [asc, disp, cls] = WORD_TO_SYM[word];
    seq.items.splice(start, wordEndOffset - start, makeSym(asc, disp, cls));
    cursor.offset = start + 2; // account for trailing delimiter
  }
}

function applyCommandEntry(seq, replaceStart, replaceEnd, entry) {
  if (entry.kind === "frac") {
    const node = makeFrac([], [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.num.id; cursor.offset = 0;
  } else if (entry.kind === "binom") {
    const node = makeBinom([], [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.num.id; cursor.offset = 0;
  } else if (entry.kind === "sqrt") {
    const node = makeSqrt([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "abs") {
    const node = makeAbs([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "norm") {
    const node = makeDelim("norm", "‖", "‖", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "floor") {
    const node = makeDelim("floor", "⌊", "⌋", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "ceil") {
    const node = makeDelim("ceil", "⌈", "⌉", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "set") {
    const node = makeDelim("set", "{", "}", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "inner") {
    const node = makeDelim("inner", "⟨", "⟩", [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "accent") {
    const node = makeAccent(entry.fnName, entry.mark, [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "bigop") {
    const node = makeBigOp(entry.fnName, entry.sym, [], [], [], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.sub.id; cursor.offset = 0;
  } else if (entry.kind === "sub") {
    const node = makeSub([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "sup") {
    const node = makeSup([], seq);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, node);
    cursor.seqId = node.body.id; cursor.offset = 0;
  } else if (entry.kind === "sym") {
    seq.items.splice(replaceStart, replaceEnd - replaceStart, makeSym(entry.ascii, entry.display, entry.cls));
    cursor.seqId = seq.id; cursor.offset = replaceStart + 1;
  } else {
    const chars = Array.from(entry.cmd + " ").map(makeChar);
    seq.items.splice(replaceStart, replaceEnd - replaceStart, ...chars);
    cursor.seqId = seq.id; cursor.offset = replaceStart + chars.length;
  }
  acPopup.style.display = "none";
  acMatches = [];
  onDocMutated();
}

function updateAutocomplete() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq || isCommentLine(seq)) {
    acPopup.style.display = "none";
    acMatches = [];
    return;
  }
  let start = cursor.offset;
  while (start > 0 && seq.items[start - 1].kind === "char" && /[A-Za-z0-9_]/.test(seq.items[start - 1].ch)) {
    start--;
  }
  const hasSlash = (start > 0 && seq.items[start - 1].kind === "char" && seq.items[start - 1].ch === "\\");
  const word = seq.items.slice(start, cursor.offset).map(x => x.ch).join("");

  if (hasSlash) {
    const q = word.toLowerCase();
    acMatches = COMMAND_DICT.filter(c => c.cmd.toLowerCase().startsWith(q));
    acRange = { seqId: seq.id, startOffset: start - 1, endOffset: cursor.offset, isSlash: true };
  } else if (word.length >= 2) {
    const q = word.toLowerCase();
    const kwList = (seq.slotName === "root" && start === 0) ? [...KEYWORD_COMPLETIONS, ...COMMAND_DICT] : COMMAND_DICT.filter(c => c.kind === "sym");
    acMatches = kwList.filter(c => c.cmd.toLowerCase().startsWith(q) && c.cmd !== word);
    acRange = { seqId: seq.id, startOffset: start, endOffset: cursor.offset, isSlash: false };
  } else {
    acMatches = [];
    acRange = null;
  }

  if (acMatches.length === 0) {
    acPopup.style.display = "none";
    return;
  }
  acIndex = 0;
  renderAcPopup();
}

function renderAcPopup() {
  const caretEl = editorSurface.querySelector(".mc-caret");
  if (caretEl) {
    const rect = caretEl.getBoundingClientRect();
    acPopup.style.left = `${Math.max(12, rect.left)}px`;
    acPopup.style.top = `${rect.bottom + 6}px`;
  }
  acPopup.innerHTML = acMatches.slice(0, 8).map((m, idx) => `
    <div class="ac-item ${idx === acIndex ? 'active' : ''}" onmousedown="confirmAc(${idx}); return false;">
      <span class="ac-preview">${escHtml(m.preview)}</span>
      <span class="ac-cmd">${acRange && acRange.isSlash ? '\\' : ''}${escHtml(m.cmd)}</span>
      <span class="ac-desc">${escHtml(m.desc)}</span>
    </div>
  `).join("");
  acPopup.style.display = "block";
}

function confirmAc(idx) {
  if (!acRange || !acMatches[idx]) return;
  const seq = seqMap.get(acRange.seqId);
  if (!seq) return;
  applyCommandEntry(seq, acRange.startOffset, acRange.endOffset, acMatches[idx]);
}

editorSurface.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    saveFile();
    return;
  }

  // Autocomplete navigation
  if (acMatches.length > 0 && acPopup.style.display === "block") {
    const visibleCount = Math.min(8, acMatches.length);
    if (e.key === "ArrowDown") {
      e.preventDefault();
      acIndex = (acIndex + 1) % visibleCount;
      renderAcPopup();
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      acIndex = (acIndex - 1 + visibleCount) % visibleCount;
      renderAcPopup();
      return;
    }
    if (e.key === "Tab" || e.key === "Enter") {
      e.preventDefault();
      confirmAc(acIndex);
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      acPopup.style.display = "none";
      acMatches = [];
      return;
    }
  }

  // Tab navigation inside composite nodes or line indent
  if (e.key === "Tab") {
    e.preventDefault();
    const seq = seqMap.get(cursor.seqId);
    if (!seq) return;
    if (!e.shiftKey && pendingHypSuggestion && pendingHypSuggestion.seqId === seq.id && cursor.offset === seq.items.length) {
      const ins = parseAsciiToItems(" : " + pendingHypSuggestion.text);
      for (const it of ins) it.parentSeq = seq;
      seq.items.push(...ins);
      cursor.offset = seq.items.length;
      onDocMutated();
      return;
    }
    if (seq.parentNode && seq.parentNode.parentSeq) {
      const pNode = seq.parentNode;
      const pSeq = pNode.parentSeq;
      const idx = pSeq.items.indexOf(pNode);
      if ((pNode.kind === "frac" || pNode.kind === "binom") && seq.slotName === "num") {
        setCursor(pNode.den.id, 0);
        return;
      }
      if (pNode.kind === "bigop" && seq.slotName === "sub") {
        setCursor(pNode.sup.id, 0);
        return;
      }
      if (pNode.kind === "bigop" && seq.slotName === "sup") {
        setCursor(pNode.body.id, 0);
        return;
      }
      if (idx >= 0) {
        setCursor(pSeq.id, idx + 1);
        return;
      }
    }
    // Otherwise adjust line indent
    const ln = docLines[cursor.lineIdx];
    if (e.shiftKey) {
      ln.indent = Math.max(0, ln.indent - 1);
    } else {
      ln.indent += 1;
    }
    onDocMutated();
    return;
  }

  if (e.key === "ArrowLeft") { e.preventDefault(); moveCursorLeft(); return; }
  if (e.key === "ArrowRight") { e.preventDefault(); moveCursorRight(); return; }
  if (e.key === "ArrowUp") { e.preventDefault(); moveCursorUp(); return; }
  if (e.key === "ArrowDown") { e.preventDefault(); moveCursorDown(); return; }
  if (e.key === "Backspace") { e.preventDefault(); handleBackspace(); return; }

  if (e.key === "Enter") {
    e.preventDefault();
    const ln = docLines[cursor.lineIdx];
    const root = ln.rootSeq;
    // Split line if in rootSeq, otherwise jump to new line below
    let rightItems = [];
    if (cursor.seqId === root.id) {
      rightItems = root.items.splice(cursor.offset);
    }
    const lineAscii = serializeSeqToAscii(root).trim();
    let nextIndent = ln.indent;
    if (
      lineAscii.startsWith("Fix ") ||
      lineAscii.startsWith("assume ") ||
      lineAscii.startsWith("by_contra ") ||
      lineAscii.startsWith("Case ") ||
      lineAscii.startsWith("cases ") ||
      lineAscii.startsWith("induction ") ||
      lineAscii.startsWith("thm ")
    ) {
      nextIndent += 1;
    }
    const newSeq = createSeq(rightItems, null, "root");
    docLines.splice(cursor.lineIdx + 1, 0, { indent: nextIndent, rootSeq: newSeq });
    cursor.lineIdx += 1;
    cursor.seqId = newSeq.id;
    cursor.offset = 0;
    onDocMutated();
    return;
  }

  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    insertCharAtCursor(e.key);
  }
});
</script>
<script>
// ================================================================
// 9. Verification, Inspector Views, File I/O, Theme & AI
// ================================================================

function onDocMutated() {
  renderEditor();
  if (checkDebounce) clearTimeout(checkDebounce);
  checkDebounce = setTimeout(runCheckApi, 110);
}

function renderKatex(tex, displayMode = false) {
  if (!window.katex) return `<code>${escHtml(tex)}</code>`;
  try {
    return window.katex.renderToString(tex, { displayMode, throwOnError: false, strict: false });
  } catch (_) {
    return `<code>${escHtml(tex)}</code>`;
  }
}

function renderInlineMarkdownMath(md) {
  const s = String(md || "");
  const dispParts = s.split(/\$\$([\s\S]+?)\$\$/g);
  let out = "";
  for (let i = 0; i < dispParts.length; i++) {
    if (i % 2 === 1) {
      out += `<div style="margin:6px 0;overflow-x:auto;">${renderKatex(dispParts[i], true)}</div>`;
    } else {
      const inParts = dispParts[i].split(/\$([^\$]+?)\$/g);
      for (let j = 0; j < inParts.length; j++) {
        if (j % 2 === 1) {
          out += renderKatex(inParts[j], false);
        } else {
          let h = escHtml(inParts[j]);
          h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
          out += h;
        }
      }
    }
  }
  return out;
}

async function runCheckApi() {
  const src = serializeDocToAscii();
  const cursor_line = cursor.lineIdx + 1;
  try {
    const resp = await fetch("/api/check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ src, cursor_line })
    });
    const data = await resp.json();
    lastCheckData = data;
    updateStatusPill(data);
    renderEditor();
    renderGoalInspector();
    renderProseTab(data);
    renderLatexTab(data);
  } catch (e) {
    console.error("check error", e);
  }
}

function updateStatusPill(data) {
  const pill = document.getElementById("statusPill");
  const decls = data.decls || [];
  const hasErr = Boolean(data.parse_error) || decls.some(d => d.status === "error");
  const hasSorry = decls.some(d => d.status === "sorry");
  const thms = decls.filter(d => !d.is_axiom).length;

  if (hasErr) {
    pill.className = "status-pill err";
    pill.textContent = "ERROR";
  } else if (hasSorry) {
    pill.className = "status-pill sorry";
    pill.textContent = `SORRY (${thms} thms)`;
  } else {
    pill.className = "status-pill ok";
    pill.textContent = `VERIFIED (${thms} thms)`;
  }
}

function renderGoalInspector() {
  if (!lastCheckData) return;
  const curLine = cursor.lineIdx + 1;
  const errArea = document.getElementById("errBannerArea");
  if (lastCheckData.parse_error) {
    errArea.innerHTML = `<div class="err-banner">Ln ${lastCheckData.parse_error.line}: ${escHtml(lastCheckData.parse_error.msg)}</div>`;
  } else {
    errArea.innerHTML = "";
  }

  const decls = lastCheckData.decls || [];
  let activeDecl = null;
  for (const d of decls) {
    if (d.line <= curLine) activeDecl = d;
  }
  if (!activeDecl && decls.length > 0) activeDecl = decls[0];

  const curDeclLabel = document.getElementById("curDeclLabel");
  const goalViewArea = document.getElementById("goalViewArea");
  if (!activeDecl) {
    curDeclLabel.textContent = "";
    goalViewArea.innerHTML = `<div style="color:var(--text-dim);">No declarations</div>`;
  } else {
    curDeclLabel.textContent = activeDecl.name;
    let bestStep = null;
    for (const st of (activeDecl.steps || [])) {
      if (st.line <= curLine) bestStep = st;
    }
    if (!bestStep && activeDecl.steps && activeDecl.steps.length > 0) {
      bestStep = activeDecl.steps[0];
    }

    let html = "";
    if (activeDecl.error) {
      html += `<div class="err-banner">Ln ${activeDecl.error.line}: ${escHtml(activeDecl.error.msg)}</div>`;
    }

    const ctxL = (bestStep && bestStep.ctx_latex) ? bestStep.ctx_latex : (activeDecl.error && activeDecl.error.ctx_latex ? activeDecl.error.ctx_latex : []);
    const goalL = (bestStep && bestStep.goal_latex) ? bestStep.goal_latex : (activeDecl.error && activeDecl.error.goal_latex ? activeDecl.error.goal_latex : activeDecl.concl_latex);

    for (const c of ctxL) {
      html += `<div class="hyp-row">${renderKatex(c, false)}</div>`;
    }
    html += `<div class="goal-panel">${renderKatex("\\vdash\\; " + (goalL || ""), true)}</div>`;

    if (activeDecl.sorries && activeDecl.sorries.length > 0) {
      for (const s of activeDecl.sorries) {
        html += `<div style="padding:8px 10px;border-left:2px solid var(--warn);background:var(--bg-elev);margin-bottom:6px;cursor:pointer;" onclick="jumpToLine(${s.line - 1})">
          <div style="font-size:11px;color:var(--warn);font-family:monospace;">sorry at Ln ${s.line}</div>
          <div style="margin-top:3px;">${renderKatex("\\vdash\\; " + s.goal_latex, false)}</div>
        </div>`;
      }
    }
    goalViewArea.innerHTML = html;
  }

  document.getElementById("declCountLabel").textContent = `${decls.length}`;
  document.getElementById("declListArea").innerHTML = decls.map(d => {
    let st = "OK";
    let col = "var(--ok)";
    if (d.is_axiom) { st = "AXIOM"; col = "var(--text-dim)"; }
    else if (d.status === "error") { st = "ERR"; col = "var(--err)"; }
    else if (d.status === "sorry") { st = "SORRY"; col = "var(--warn)"; }
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer;" onclick="jumpToLine(${d.line - 1})">
      <div>
        <span style="font-family:monospace;font-size:11px;color:${col};margin-right:8px;">${st}</span>
        <span style="font-weight:600;">${escHtml(d.name)}</span>
      </div>
      <div style="font-size:12.5px;max-width:58%;overflow-x:auto;">${renderKatex(d.concl_latex, false)}</div>
    </div>`;
  }).join("");
}

function jumpToLine(idx) {
  const clamped = Math.max(0, Math.min(idx, docLines.length - 1));
  const ln = docLines[clamped];
  setCursor(ln.rootSeq.id, ln.rootSeq.items.length, clamped);
}

function renderProseTab(data) {
  const notes = data.notes || [];
  const decls = data.decls || [];
  const items = [];
  for (const n of notes) items.push({ line: n.line, type: "note", note: n });
  for (const d of decls) items.push({ line: d.line, type: "decl", decl: d });
  items.sort((a, b) => a.line - b.line);

  let html = "";
  for (const it of items) {
    if (it.type === "note") {
      const n = it.note;
      if (n.kind === "heading") {
        html += `<h3 style="margin:14px 0 6px 0;font-size:15px;">${renderInlineMarkdownMath(n.text.replace(/^#+\s*/, ""))}</h3>`;
      } else {
        html += `<div style="color:var(--text-dim);margin:4px 0;">${renderInlineMarkdownMath(n.text)}</div>`;
      }
    } else {
      const d = it.decl;
      if (d.is_axiom) {
        html += `<div class="prose-thm" style="border-left-color:var(--text-dim);overflow-x:auto;"><strong>公理 ${escHtml(d.name)}</strong>: ${renderKatex(d.header_latex, false)}</div>`;
      } else {
        html += `<div class="prose-thm"><div><strong>定理 ${escHtml(d.name)}</strong></div><div style="margin-top:6px;overflow-x:auto;">${renderKatex(d.header_latex, false)}</div></div>`;
        html += `<div class="prose-proof">`;
        for (const p of (d.prose || [])) {
          html += `<div style="padding-left:${p.depth * 16}px;margin:8px 0;line-height:1.75;">${renderInlineMarkdownMath(p.text)}</div>`;
        }
        html += `</div>`;
      }
    }
  }
  document.getElementById("proseDocArea").innerHTML = html;
}

function renderLatexTab(data) {
  const decls = data.decls || [];
  let tex = "\\documentclass[a4paper,11pt]{ltjsarticle}\n\\usepackage{amsmath,amssymb,amsthm}\n\\newtheorem{theorem}{定理}\n\\newtheorem{axiom}{公理}\n\\begin{document}\n\n";
  for (const d of decls) tex += (d.latex_env || "") + "\n";
  tex += "\\end{document}\n";
  document.getElementById("latexArea").value = tex;
}

function toggleJpLens() {
  jpSugarLens = !jpSugarLens;
  const btn = document.getElementById("btnJpLens");
  btn.textContent = `JP Sugar View: ${jpSugarLens ? "ON" : "OFF"}`;
  btn.classList.toggle("active", jpSugarLens);
  renderEditor();
}

function toggleTheme() {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme") || "dark";
  const next = cur === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  localStorage.setItem("narfi_theme", next);
}

function switchTab(id, btn) {
  document.querySelectorAll(".insp-tab").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".insp-body").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("tab-" + id).classList.add("active");
}

function applyRawCodeEdit() {
  const raw = document.getElementById("rawAsciiArea").value;
  loadSourceIntoDoc(raw);
  onDocMutated();
}

function copyProseMd() {
  if (!lastCheckData) return;
  let md = "";
  for (const d of (lastCheckData.decls || [])) {
    md += `### ${d.is_axiom ? "公理" : "定理"} ${d.name}\n$$${d.header_latex}$$\n\n`;
    if (!d.is_axiom) {
      for (const p of (d.prose || [])) md += `${"  ".repeat(p.depth)}- ${p.text}\n`;
      md += "\n";
    }
  }
  navigator.clipboard.writeText(md);
}

function copyLatex() {
  navigator.clipboard.writeText(document.getElementById("latexArea").value);
}

async function loadFiles() {
  try {
    const resp = await fetch("/api/files");
    const data = await resp.json();
    const sel = document.getElementById("fileSelect");
    sel.innerHTML = `<option value="">untitled.narfi</option>` +
      (data.files || []).map(f => `<option value="${escHtml(f)}">${escHtml(f)}</option>`).join("");
  } catch (_) {}
}

// Right Pane Drag Resizer & Collapse Toggle
const paneResizer = document.getElementById("paneResizer");
const inspectorPane = document.getElementById("inspectorPane");
const btnInspector = document.getElementById("btnInspector");
let isResizingPane = false;

function toggleInspector() {
  const collapsed = inspectorPane.classList.toggle("collapsed");
  btnInspector.classList.toggle("active", !collapsed);
}

paneResizer.addEventListener("dblclick", () => toggleInspector());
paneResizer.addEventListener("mousedown", (e) => {
  isResizingPane = true;
  paneResizer.classList.add("dragging");
  document.body.style.cursor = "col-resize";
  document.body.style.userSelect = "none";
  e.preventDefault();
});
window.addEventListener("mousemove", (e) => {
  if (!isResizingPane) return;
  const newWidth = Math.max(240, Math.min(window.innerWidth - 320, window.innerWidth - e.clientX));
  inspectorPane.classList.remove("collapsed");
  btnInspector.classList.add("active");
  document.documentElement.style.setProperty("--inspector-width", `${newWidth}px`);
});
window.addEventListener("mouseup", () => {
  if (isResizingPane) {
    isResizingPane = false;
    paneResizer.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
  }
});

document.getElementById("fileSelect").addEventListener("change", async (e) => {
  const path = e.target.value;
  if (!path) {
    currentFilePath = "";
    loadSourceIntoDoc(DEFAULT_ASCII_DOC);
    onDocMutated();
    return;
  }
  const resp = await fetch(`/api/file?path=${encodeURIComponent(path)}`);
  const data = await resp.json();
  if (data.ok) {
    currentFilePath = data.path;
    // Normalize loaded file into clean ASCII code before populating structured Mathcha AST
    const convResp = await fetch("/api/convert", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ src: data.src, mode: "to_standard" })
    });
    const convData = await convResp.json();
    loadSourceIntoDoc(convData.src || data.src);
    onDocMutated();
  }
});

async function saveFile() {
  let path = currentFilePath;
  if (!path) {
    path = prompt("File path (.narfi):", "note.narfi") || "";
    if (!path) return;
    if (!path.endsWith(".narfi")) path += ".narfi";
  }
  const src = serializeDocToAscii();
  const resp = await fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path, src })
  });
  const data = await resp.json();
  if (data.ok) {
    currentFilePath = data.path;
    await loadFiles();
    document.getElementById("fileSelect").value = currentFilePath;
  }
}

async function askAi(mode) {
  const reply = document.getElementById("aiReply");
  reply.textContent = "Thinking...";
  let prompt = document.getElementById("aiPrompt").value;
  if (mode === "next") prompt = "カーソル行の目標を進めるための次の1ステップを純粋ASCIIのNarfiコードで提案してください。";
  else if (mode === "sorry") prompt = "sorry を埋める証明コードを純粋ASCIIのNarfiコードで提案してください。";
  else if (mode === "error") prompt = "エラーの原因と修正案を簡潔に示してください。";

  const resp = await fetch("/api/ai", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      provider: document.getElementById("aiProvider").value,
      prompt,
      src: serializeDocToAscii(),
      goal_info: `Cursor Ln ${cursor.lineIdx + 1}`,
      api_key: document.getElementById("aiKey").value,
      api_base: document.getElementById("aiBase").value,
      model: document.getElementById("aiModel").value
    })
  });
  const data = await resp.json();
  reply.textContent = data.ok ? data.reply : (data.error || "Error");
}

window.addEventListener("DOMContentLoaded", async () => {
  const savedTheme = localStorage.getItem("narfi_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  await loadFiles();
  loadSourceIntoDoc(DEFAULT_ASCII_DOC);
  onDocMutated();
  editorSurface.focus();
});
</script>
</body>
</html>
