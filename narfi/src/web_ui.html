function scheduleAutosave() {
  if (autosaveTimer) clearTimeout(autosaveTimer);
  if (!autosaveOn || !currentFilePath || currentReadOnly || !docDirty) return;
  autosaveTimer = setTimeout(() => saveFile({ silent: true }), 1100);
}

// ---- 作業フォルダとファイル一覧

async function loadWorkspace() {
  try {
    const resp = await fetch("/api/workspace");
    workspaceInfo = await resp.json();
    renderSidebar();
  } catch (_) {}
}

// ---- ファイルの木（作業フォルダ・ライブラリ）。フォルダの開閉・作る・名前を変える・消す・ドラッグで移す

const ICON = {
  chev: `<svg class="t-chev" viewBox="0 0 10 10"><path d="M3.5 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>`,
  dir: `<svg class="t-ico" viewBox="0 0 16 16"><path d="M1.5 3.5h4.5l1.5 1.5h7v8.5h-13z" fill="none" stroke="currentColor"/></svg>`,
  dirOpen: `<svg class="t-ico" viewBox="0 0 16 16"><path d="M1.5 13.5v-10h4.5l1.5 1.5h6v2" fill="none" stroke="currentColor"/><path d="M1.5 13.5l2-6h11l-2 6z" fill="none" stroke="currentColor"/></svg>`,
  file: `<svg class="t-ico" viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h6" stroke="currentColor"/></svg>`
};

let treeOpen = new Set(JSON.parse(localStorage.getItem("narfi.tree.open") || "[]"));
let treeEdit = null; // { kind: "rename" | "new-file" | "new-dir", path, parent, isDir }

function saveTreeOpen() {
  localStorage.setItem("narfi.tree.open", JSON.stringify([...treeOpen]));
}

const baseName = (p) => p.split("/").pop();
const dirName = (p) => (p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "");
const joinPath = (d, n) => (d ? `${d}/${n}` : n);

// パスの一覧から木を作る（prefix は "lib:std/" など。作業フォルダは ""）
function buildTree(files, dirs, prefix) {
  const root = { children: new Map() };
  const node = (parts) => {
    let cur = root;
    let path = "";
    for (const part of parts) {
      path = joinPath(path, part);
      if (!cur.children.has(part)) cur.children.set(part, { name: part, path: prefix + path, dir: true, children: new Map() });
      cur = cur.children.get(part);
    }
    return cur;
  };
  for (const d of dirs || []) node(d.split("/"));
  for (const f of files || []) {
    const parts = f.split("/");
    const parent = node(parts.slice(0, -1));
    parent.children.set(parts[parts.length - 1], { name: parts[parts.length - 1], path: prefix + f, dir: false });
  }
  return root;
}

function sortedChildren(n) {
  return [...n.children.values()].sort((a, b) => (a.dir !== b.dir ? (a.dir ? -1 : 1) : a.name.localeCompare(b.name, "ja")));
}

function editRowHtml(depth, isDir, value) {
  return `<div class="t-row editing ${isDir ? "dir" : "file"}" style="--depth:${depth}">${guides(depth)}${ICON.chev}${isDir ? ICON.dir : ICON.file}` +
    `<input class="t-input" id="treeInput" value="${escHtml(value)}" spellcheck="false"></div>`;
}

function guides(depth) {
  let g = "";
  for (let k = 0; k < depth; k++) g += `<span class="t-guide" style="left:${8 + k * 14 + 4}px"></span>`;
  return g;
}

function treeRowsHtml(n, depth, tree) {
  let html = "";
  const ro = tree === "lib";
  if (treeEdit && !ro && (treeEdit.kind === "new-dir" || treeEdit.kind === "new-file") && (n.path || "") === treeEdit.parent) {
    html += editRowHtml(depth, treeEdit.kind === "new-dir", "");
  }
  for (const c of sortedChildren(n)) {
    if (treeEdit && treeEdit.kind === "rename" && c.path === treeEdit.path) {
      html += editRowHtml(depth, c.dir, c.name);
      continue;
    }
    const open = c.dir && (treeOpen.has(c.path) || (treeEdit && treeEdit.parent === c.path));
    const cls = ["t-row", c.dir ? "dir" : "file", open ? "open" : "", c.path === currentFilePath ? "active" : "", ro ? "ro" : ""].join(" ");
    const label = c.label || c.name;
    html += `<div class="${cls}" style="--depth:${depth}" data-path="${escHtml(c.path)}" data-kind="${c.dir ? "dir" : "file"}" data-tree="${tree}"` +
      `${ro ? "" : ' draggable="true"'} title="${escHtml(c.title || label)}">${guides(depth)}${ICON.chev}${c.dir ? (open ? ICON.dirOpen : ICON.dir) : ICON.file}` +
      `<span class="t-name">${escHtml(label)}</span></div>`;
    if (open) html += treeRowsHtml(c, depth + 1, tree);
  }
  return html;
}

function renderSidebar() {
  const ws = workspaceInfo;
  if (!ws || !ws.ok) return;
  const root = document.getElementById("sbRoot");
  root.textContent = ws.name || "Files";
  root.title = ws.root;
  // 開いているファイルのフォルダは開いておく
  if (currentFilePath) {
    const parts = currentFilePath.split("/");
    for (let k = 1; k < parts.length; k++) treeOpen.add(parts.slice(0, k).join("/"));
  }
  const wsTree = buildTree(ws.files, ws.dirs, "");
  const empty = (ws.files || []).length === 0 && (ws.dirs || []).length === 0 && !treeEdit;
  document.getElementById("sbFiles").innerHTML = empty
    ? `<div class="sb-empty">ファイルがありません。右クリックか上のボタンで作れます。</div>`
    : treeRowsHtml(wsTree, 0, "ws");
  const libRoot = { children: new Map() };
  for (const lib of ws.libs || []) {
    if (lib.label === "user" && (lib.files || []).length === 0) continue;
    const t = buildTree(lib.files, [], `lib:${lib.label}/`);
    libRoot.children.set(lib.label, {
      name: lib.label === "user" ? "~" : "std",
      label: lib.label === "user" ? "My Library" : "Standard Library",
      title: lib.label === "user" ? "~/.narfi/lib（ここに置いた .narfi は import できる）" : "標準ライブラリ（読み取り専用）",
      path: `lib:${lib.label}`,
      dir: true,
      children: t.children
    });
  }
  document.getElementById("sbLibs").innerHTML = treeRowsHtml(libRoot, 0, "lib");
  const input = document.getElementById("treeInput");
  if (input) setupTreeInput(input);
}

function setupTreeInput(input) {
  input.focus();
  const v = input.value;
  const dot = v.endsWith(".narfi") ? v.length - ".narfi".length : v.length;
  input.setSelectionRange(0, dot);
  input.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") { e.preventDefault(); commitTreeEdit(input.value); }
    else if (e.key === "Escape") { e.preventDefault(); treeEdit = null; renderSidebar(); }
  });
  input.addEventListener("blur", () => { if (treeEdit) commitTreeEdit(input.value); });
}

async function fsOp(url, body) {
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return await r.json();
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

function treeNew(kind, parent) {
  closeFileMenu();
  if (document.getElementById("sidebar").classList.contains("collapsed")) toggleSidebar();
  if (parent) treeOpen.add(parent);
  treeEdit = { kind: kind === "dir" ? "new-dir" : "new-file", parent: parent || "" };
  renderSidebar();
}

function treeRename(path, isDir) {
  treeEdit = { kind: "rename", path, isDir };
  renderSidebar();
}

function treeCollapseAll() {
  treeOpen.clear();
  saveTreeOpen();
  renderSidebar();
}

async function commitTreeEdit(raw) {
  const e = treeEdit;
  treeEdit = null;
  const name = raw.trim();
  if (!e || !name) { renderSidebar(); return; }
  if (name.includes("/") || name === "." || name === "..") {
    uiToast("名前に「/」は使えません。移すときはドラッグします");
    renderSidebar();
    return;
  }
  if (e.kind === "new-file") {
    const path = joinPath(e.parent, name.endsWith(".narfi") ? name : `${name}.narfi`);
    const d = await fsOp("/api/create", { path });
    if (!d.ok) { uiToast(d.error || "作れませんでした"); renderSidebar(); return; }
    await loadWorkspace();
    await openPath(path);
  } else if (e.kind === "new-dir") {
    const path = joinPath(e.parent, name);
    const d = await fsOp("/api/mkdir", { path });
    if (!d.ok) { uiToast(d.error || "作れませんでした"); renderSidebar(); return; }
    treeOpen.add(path);
    saveTreeOpen();
    await loadWorkspace();
  } else {
    const to = joinPath(dirName(e.path), e.isDir || name.endsWith(".narfi") ? name : `${name}.narfi`);
    if (to === e.path) { renderSidebar(); return; }
    await movePath(e.path, to);
  }
}

async function movePath(from, to) {
  if (to === from) return;
  const d = await fsOp("/api/rename", { from, to });
  if (!d.ok) { uiToast(d.error || "名前を変えられませんでした"); renderSidebar(); return; }
  // 開いているタブ・開いたフォルダの記録を新しい名前に合わせる
  const re = (p) => (p === from ? to : p.startsWith(from + "/") ? to + p.slice(from.length) : p);
  for (const t of tabs) t.path = t.path ? re(t.path) : t.path;
  currentFilePath = currentFilePath ? re(currentFilePath) : currentFilePath;
  treeOpen = new Set([...treeOpen].map(re));
  saveTreeOpen();
  if (currentFilePath && !currentReadOnly) localStorage.setItem("narfi.lastFile", currentFilePath);
  persistTabs();
  updateFileLabel();
  await loadWorkspace();
}

async function treeDelete(path, isDir) {
  const note = window.NARFI_WEB
    ? (document.getElementById("btnAccount") && /同期/.test(document.getElementById("btnAccount").textContent) ? "クラウドからも削除されます。" : "元に戻せません。")
    : "ゴミ箱に移します（Finder から戻せます）。";
  const ok = await uiConfirm(`「${baseName(path)}」${isDir ? "フォルダとその中身" : ""}を削除しますか？`, "削除", { note, danger: true });
  if (!ok) return;
  const d = await fsOp("/api/delete", { path });
  if (!d.ok) { uiToast(d.error || "削除できませんでした"); return; }
  // そのファイル（フォルダの中のファイル）のタブは閉じる
  for (let i = tabs.length - 1; i >= 0; i--) {
    const p = tabs[i].path;
    if (p && (p === path || p.startsWith(path + "/"))) closeTab(i, true);
  }
  await loadWorkspace();
}

// ---- 右クリックのメニュー

function showCtxMenu(x, y, items) {
  const m = document.getElementById("ctxMenu");
  m.innerHTML = "";
  for (const it of items) {
    if (it === "-") { m.insertAdjacentHTML("beforeend", `<div class="menu-sep"></div>`); continue; }
    const b = document.createElement("button");
    b.className = `menu-item${it.danger ? " danger" : ""}`;
    b.innerHTML = `<span class="mi-label">${escHtml(it.label)}</span><span class="kbd"></span>`;
    b.addEventListener("click", () => { hideCtxMenu(); it.run(); });
    m.appendChild(b);
  }
  m.hidden = false;
  const r = m.getBoundingClientRect();
  m.style.left = `${Math.min(x, window.innerWidth - r.width - 4)}px`;
  m.style.top = `${Math.min(y, window.innerHeight - r.height - 4)}px`;
}

function hideCtxMenu() {
  document.getElementById("ctxMenu").hidden = true;
  document.querySelectorAll(".t-row.ctx").forEach((r) => r.classList.remove("ctx"));
}

document.addEventListener("mousedown", (e) => { if (!e.target.closest("#ctxMenu")) hideCtxMenu(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    hideCtxMenu();
    if (typeof treeShown !== "undefined" && treeShown) hideDerivation();
  }
});
window.addEventListener("blur", hideCtxMenu);

const sidebarEl = document.getElementById("sidebar");

sidebarEl.addEventListener("contextmenu", (e) => {
  const row = e.target.closest(".t-row");
  const inWs = e.target.closest("#sbFiles") || e.target.closest(".sb-head:not(.sb-head-lib)");
  e.preventDefault();
  if (!row) {
    if (!inWs) return;
    showCtxMenu(e.clientX, e.clientY, [
      { label: "New File", run: () => treeNew("file", "") },
      { label: "New Folder", run: () => treeNew("dir", "") }
    ]);
    return;
  }
  if (row.classList.contains("editing")) return;
  const path = row.getAttribute("data-path");
  const isDir = row.getAttribute("data-kind") === "dir";
  row.classList.add("ctx");
  if (row.getAttribute("data-tree") === "lib") {
    if (!isDir) showCtxMenu(e.clientX, e.clientY, [{ label: "Open", run: () => openPath(path) }]);
    return;
  }
  const items = isDir
    ? [
        { label: "New File", run: () => treeNew("file", path) },
        { label: "New Folder", run: () => treeNew("dir", path) },
        "-",
        { label: "Rename", run: () => treeRename(path, true) },
        { label: "Delete", danger: true, run: () => treeDelete(path, true) }
      ]
    : [
        { label: "Open", run: () => openPath(path) },
        "-",
        { label: "Rename", run: () => treeRename(path, false) },
        { label: "Delete", danger: true, run: () => treeDelete(path, false) }
      ];
  showCtxMenu(e.clientX, e.clientY, items);
});

sidebarEl.addEventListener("click", (e) => {
  const row = e.target.closest(".t-row");
  if (!row || row.classList.contains("editing")) return;
  const path = row.getAttribute("data-path");
  if (row.getAttribute("data-kind") === "dir") {
    if (treeOpen.has(path)) treeOpen.delete(path); else treeOpen.add(path);
    saveTreeOpen();
    renderSidebar();
  } else {
    openPath(path);
  }
});

// ドラッグでフォルダに移す（一覧の空いた所に落とすと一番上へ）
let dragPath = null;
sidebarEl.addEventListener("dragstart", (e) => {
  const row = e.target.closest(".t-row[draggable]");
  if (!row) return;
  dragPath = row.getAttribute("data-path");
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", dragPath);
});
sidebarEl.addEventListener("dragend", () => {
  dragPath = null;
  document.querySelectorAll(".t-row.drop, .tree.drop-root").forEach((r) => r.classList.remove("drop", "drop-root"));
});
function dropTarget(e) {
  if (!dragPath) return null;
  const row = e.target.closest(".t-row");
  if (row && row.getAttribute("data-tree") === "ws") {
    const p = row.getAttribute("data-path");
    const dir = row.getAttribute("data-kind") === "dir" ? p : dirName(p);
    return { el: dir ? sidebarEl.querySelector(`.t-row[data-path="${CSS.escape(dir)}"]`) : document.getElementById("sbFiles"), dir };
  }
  if (e.target.closest("#sbFiles")) return { el: document.getElementById("sbFiles"), dir: "" };
  return null;
}
sidebarEl.addEventListener("dragover", (e) => {
  const t = dropTarget(e);
  document.querySelectorAll(".t-row.drop, .tree.drop-root").forEach((r) => r.classList.remove("drop", "drop-root"));
  if (!t || t.dir === dragPath || t.dir.startsWith(dragPath + "/") || dirName(dragPath) === t.dir) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  if (t.el) t.el.classList.add(t.dir ? "drop" : "drop-root");
});
sidebarEl.addEventListener("drop", (e) => {
  const t = dropTarget(e);
  const from = dragPath;
  document.querySelectorAll(".t-row.drop, .tree.drop-root").forEach((r) => r.classList.remove("drop", "drop-root"));
  if (!t || !from) return;
  e.preventDefault();
  if (t.dir) treeOpen.add(t.dir);
  movePath(from, joinPath(t.dir, baseName(from)));
});

// ---- 確認・名前の入力・お知らせ（ブラウザ標準のダイアログの代わり）

function uiModal({ title, note = "", value = null, okLabel = "OK", cancelLabel = "キャンセル", danger = false }) {
  return new Promise((resolve) => {
    const back = document.getElementById("modalBack");
    const input = document.getElementById("modalInput");
    const ok = document.getElementById("modalOk");
    const cancel = document.getElementById("modalCancel");
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalNote").textContent = note;
    input.hidden = value === null;
    input.value = value || "";
    ok.textContent = okLabel;
    cancel.textContent = cancelLabel;
    ok.classList.toggle("danger", danger);
    back.hidden = false;
    const done = (v) => {
      back.hidden = true;
      ok.removeEventListener("click", onOk);
      cancel.removeEventListener("click", onCancel);
      back.removeEventListener("keydown", onKey, true);
      back.removeEventListener("mousedown", onBack);
      if (typeof editorSurface !== "undefined") editorSurface.focus();
      resolve(v);
    };
    const onOk = () => done(value === null ? true : input.value);
    const onCancel = () => done(value === null ? false : null);
    const onKey = (e) => {
      e.stopPropagation();
      if (e.key === "Enter") { e.preventDefault(); onOk(); }
      else if (e.key === "Escape") { e.preventDefault(); onCancel(); }
    };
    const onBack = (e) => { if (e.target === back) onCancel(); };
    ok.addEventListener("click", onOk);
    cancel.addEventListener("click", onCancel);
    back.addEventListener("keydown", onKey, true);
    back.addEventListener("mousedown", onBack);
    if (value !== null) {
      input.focus();
      const dot = input.value.endsWith(".narfi") ? input.value.length - ".narfi".length : input.value.length;
      input.setSelectionRange(0, dot);
    } else {
      ok.focus();
    }
  });
}

function uiConfirm(title, okLabel = "OK", opts = {}) {
  return uiModal({ title, okLabel, note: opts.note || "", danger: !!opts.danger });
}

function uiPrompt(title, value = "", note = "") {
  return uiModal({ title, value, note });
}

let toastTimer = null;
function uiToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, Math.min(9000, 2500 + msg.length * 60));
}

window.uiModal = uiModal;
window.uiConfirm = uiConfirm;
window.uiPrompt = uiPrompt;
window.uiToast = uiToast;

// ---- タブ：開いたファイルが上に並ぶ。切り替えても、保存していない変更はタブの中に残る

let tabs = [];        // [{ path, src, dirty }]（src が null のタブは、まだ読み込んでいない）
let activeTab = -1;

function tabIndex(path) {
  return path ? tabs.findIndex((t) => t.path === path) : -1;
}

function tabDirty(i) {
  return i === activeTab ? docDirty : tabs[i].dirty;
}

function anyDirty() {
  return tabs.some((_, i) => tabDirty(i));
}

function persistTabs() {
  localStorage.setItem("narfi.tabs", JSON.stringify({ paths: tabs.filter((t) => t.path).map((t) => t.path), active: currentFilePath }));
}

function renderTabs() {
  const strip = document.getElementById("tabStrip");
  strip.innerHTML = tabs.map((t, i) => {
    const name = t.path ? displayName(t.path).split("/").pop() : (t.title || "untitled.narfi");
    const cls = `tab${i === activeTab ? " active" : ""}${tabDirty(i) ? " dirty" : ""}`;
    const ro = t.path && t.path.startsWith("lib:") ? " ro" : "";
    return `<div class="${cls}" data-tab="${i}" title="${escHtml(t.path ? displayName(t.path) : "保存されていない文書")}">` +
      `<span class="tab-name${ro}">${escHtml(name)}</span><span class="tab-close" data-close="${i}" title="閉じる">×</span></div>`;
  }).join("");
  const act = strip.querySelector(".tab.active");
  if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
}

document.getElementById("tabStrip").addEventListener("mousedown", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  e.preventDefault(); // エディタのフォーカスを奪わない
  const close = e.target.closest(".tab-close");
  const i = Number(tab.getAttribute("data-tab"));
  if (close || e.button === 1) closeTab(i);
  else if (e.button === 0) activateTab(i);
});

// 今のエディタの中身を今のタブに書き戻す。自動保存が有効なら、そのタブを保存しておく
function stashCurrent() {
  const t = tabs[activeTab];
  if (!t) return;
  t.src = serializeDocToAscii();
  t.dirty = docDirty;
  if (t.dirty && autosaveOn && t.path && !currentReadOnly) {
    if (autosaveTimer) { clearTimeout(autosaveTimer); autosaveTimer = null; }
    const src = t.src;
    fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: t.path, src }) })
      .then((r) => r.json())
      .then((d) => { if (d.ok && t.src === src) { t.dirty = false; renderTabs(); } })
      .catch(() => {});
  }
}

// タブ i をエディタに出す（中身は読み込み済みであること）
function showTab(i) {
  activeTab = i;
  const t = tabs[i];
  loadSourceIntoDoc(t.src);
  currentFilePath = t.path;
  currentReadOnly = !!t.path && t.path.startsWith("lib:");
  docDirty = t.dirty;
  if (t.path && !currentReadOnly) localStorage.setItem("narfi.lastFile", t.path);
  updateFileLabel();
  renderSidebar();
  persistTabs();
  refreshAfterEdit();
}

async function activateTab(i) {
  if (i === activeTab || !tabs[i]) return;
  const t = tabs[i];
  if (t.src == null) {
    const data = await (await fetch(`/api/file?path=${encodeURIComponent(t.path)}`)).json();
    if (!data.ok) {
      uiToast(data.error || "開けませんでした");
      closeTab(i, true);
      return;
    }
    t.src = data.src;
  }
  stashCurrent();
  showTab(i);
}

async function closeTab(i, force = false) {
  if (!tabs[i]) return;
  const name = tabs[i].path ? baseName(displayName(tabs[i].path)) : "untitled.narfi";
  if (!force && tabDirty(i) && !(await uiConfirm(`「${name}」の変更は保存されていません。閉じますか？`, "保存せずに閉じる", { danger: true }))) return;
  if (!tabs[i].path) localStorage.removeItem("narfi.draft");
  if (i !== activeTab) {
    tabs.splice(i, 1);
    if (activeTab > i) activeTab--;
    renderTabs();
    persistTabs();
    return;
  }
  tabs.splice(i, 1);
  activeTab = -1;
  docDirty = false;
  if (tabs.length === 0) {
    tabs.push({ path: "", src: "", dirty: false });
    showTab(0);
  } else {
    const j = Math.min(i, tabs.length - 1);
    if (tabs[j].src == null) activateTab(j);
    else showTab(j);
  }
}

// ソースを、path のタブとしてエディタに入れる（そのファイルのタブがなければ作る）。
// 構文木を経由する変換（/api/convert）は通さない：コメントが消え、自動保存でファイルから失われるため。
async function loadSrc(src, path, opts = {}) {
  let i = tabIndex(path);
  if (i >= 0) {
    if (i !== activeTab) stashCurrent();
    tabs[i].src = src;
    tabs[i].dirty = false;
  } else {
    stashCurrent();
    const cur = tabs[activeTab];
    const t = { path: path || "", src, dirty: false, title: opts.title || "" };
    if (cur && !opts.newTab && !cur.path && !docDirty && (cur.example || !serializeDocToAscii().trim())) {
      // 空の untitled・最初の例は置き換える
      i = activeTab;
      tabs[i] = t;
    } else {
      i = activeTab + 1;
      tabs.splice(i, 0, t);
    }
  }
  activeTab = -1;
  showTab(i);
}

// Web 版：クラウドから別の端末の変更が届いた（web_static.js）。一覧を更新し、変わったファイルのタブは読み直す
// （開いているタブは、保存していない変更がなければ）
window.addEventListener("narfi:files-changed", async (e) => {
  await loadWorkspace();
  const paths = (e.detail && e.detail.paths) || [];
  tabs.forEach((t, i) => {
    if (i !== activeTab && paths.includes(t.path) && !t.dirty) t.src = null;
  });
  // ほかの端末で消された・名前を変えられたファイルのタブは閉じる（保存していない変更があれば残す）
  const files = new Set((workspaceInfo && workspaceInfo.files) || []);
  for (let i = tabs.length - 1; i >= 0; i--) {
    const p = tabs[i].path;
    if (p && !p.startsWith("lib:") && paths.includes(p) && !files.has(p) && !tabDirty(i)) await closeTab(i, true);
  }
  if (currentFilePath && paths.includes(currentFilePath) && !docDirty) {
    const data = await (await fetch(`/api/file?path=${encodeURIComponent(currentFilePath)}`)).json();
    if (data.ok && data.src !== serializeDocToAscii()) await loadSrc(data.src, data.path);
  }
});

async function openPath(path) {
  const i = tabIndex(path);
  if (i >= 0) return activateTab(i);
  const resp = await fetch(`/api/file?path=${encodeURIComponent(path)}`);
  const data = await resp.json();
  if (!data.ok) { uiToast(data.error || "開けませんでした"); return; }
  await loadSrc(data.src, data.path);
}

async function openFileDialog() {
  const data = await (await fetch("/api/open-file", { method: "POST", body: "{}" })).json();
  if (data.cancelled) return;
  if (!data.ok) { uiToast(data.error || "開けませんでした"); return; }
  await loadWorkspace();
  await loadSrc(data.src, data.path);
}

async function openFolder() {
  if (!window.NARFI_WEB && anyDirty() && !(await uiConfirm("保存していない変更があるタブがあります。閉じてフォルダを開きますか？", "開く", { danger: true }))) return;
  let body = "{}";
  if (workspaceInfo && !workspaceInfo.dialogs) {
    const p = await uiPrompt("作業フォルダのパス", workspaceInfo.root);
    if (!p) return;
    body = JSON.stringify({ path: p });
  }
  const data = await (await fetch("/api/open-folder", { method: "POST", body })).json();
  if (data.cancelled) return;
  if (!data.ok) { uiToast(data.error || "開けませんでした"); return; }
  workspaceInfo = data;
  localStorage.removeItem("narfi.lastFile");
  // フォルダが変わったので、タブは閉じる（ただし Web 版の Import は同じ保存領域に足すだけなので残す）
  if (!window.NARFI_WEB) {
    tabs = [];
    activeTab = -1;
    docDirty = false;
    await loadSrc("", "");
  } else {
    renderSidebar();
  }
}

function newFile() {
  localStorage.removeItem("narfi.draft");
  loadSrc("", "", { newTab: true });
}

async function saveFile(opts = {}) {
  if (!currentFilePath || currentReadOnly) {
    if (!opts.silent) await saveAs();
    return;
  }
  const src = serializeDocToAscii();
  try {
    const data = await (await fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: currentFilePath, src })
    })).json();
    if (data.ok) {
      // 保存中にさらに編集されていなければ「保存済み」
      if (serializeDocToAscii() === src) docDirty = false;
      updateFileLabel();
    } else if (!opts.silent) {
      uiToast(data.error || "保存できませんでした");
    }
  } catch (e) {
    if (!opts.silent) uiToast("保存できませんでした。narfi web が動いているか確認してください");
  }
}

async function saveAs() {
  const src = serializeDocToAscii();
  const name = currentFilePath ? currentFilePath.split("/").pop() : ((tabs[activeTab] && tabs[activeTab].title) || "note.narfi");
  let data;
  if (workspaceInfo && !workspaceInfo.dialogs) {
    let p = await uiPrompt("名前を付けて保存", name, "作業フォルダからの相対パス（例：week1/note.narfi）");
    if (!p) return;
    if (!p.endsWith(".narfi")) p += ".narfi";
    data = await (await fetch("/api/save", { method: "POST", body: JSON.stringify({ path: p, src }) })).json();
  } else {
    data = await (await fetch("/api/save-as", { method: "POST", body: JSON.stringify({ src, name }) })).json();
    if (data.cancelled) return;
  }
  if (!data.ok) { uiToast(data.error || "保存できませんでした"); return; }
  // 同じファイルのタブがほかにあれば閉じる（上書きしたので）
  const other = tabIndex(data.path);
  if (other >= 0 && other !== activeTab) {
    tabs.splice(other, 1);
    if (activeTab > other) activeTab--;
  }
  currentFilePath = data.path;
  currentReadOnly = false;
  docDirty = false;
  if (tabs[activeTab]) Object.assign(tabs[activeTab], { path: data.path, src, dirty: false });
  persistTabs();
  localStorage.setItem("narfi.lastFile", currentFilePath);
  localStorage.removeItem("narfi.draft");
  await loadWorkspace();
  updateFileLabel();
}

function revealDir(target) {
  fetch("/api/reveal", { method: "POST", body: JSON.stringify({ target }) });
}

// ---- 印刷・PDF

function printDocument() {
  if (!lastCheckData) return;
  const title = displayName(currentFilePath).split("/").pop().replace(/\.narfi$/, "");
  const body = document.getElementById("proseDocArea").innerHTML;
  const w = window.open("", "_blank");
  if (!w) { uiToast("ポップアップがブロックされました。このサイトのポップアップを許可してください"); return; }
  w.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><title>${escHtml(title)}</title>
<link rel="stylesheet" href="${location.origin}/assets/katex/katex.min.css">
<style>
  :root { --text:#111; --text-dim:#555; --text-faint:#888; --border:#ccc; --accent:#1d4ed8; --bg-elev:#fff; }
  body { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; color:#111; max-width: 46em; margin: 2em auto; line-height: 1.8; font-size: 11pt; }
  h1 { font-size: 16pt; text-align: center; margin-bottom: 1.5em; }
  .prose-thm { border-left: 3px solid #333; padding: 4px 0 4px 12px; margin: 22px 0 8px 0; break-inside: avoid; }
  .prose-proof { margin: 0 0 18px 0; }
  .katex-display { overflow-x: visible; }
  @page { size: A4; margin: 18mm; }
  @media print { body { margin: 0 auto; } }
</style></head><body><h1>${escHtml(title)}</h1>${body}
<script>window.onload = () => setTimeout(() => window.print(), 400);<\/script>
</body></html>`);
  w.document.close();
}

async function exportPdf() {
  // ポップアップのブロックを避けるため、先に窓を開いておく
  const w = window.open("", "_blank");
  if (w) w.document.write("<p style='font-family:sans-serif;color:#555'>PDF を作成中…（LaTeX）</p>");
  try {
    const resp = await fetch("/api/pdf", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ src: serializeDocToAscii(), path: currentReadOnly ? "" : currentFilePath })
    });
    if ((resp.headers.get("Content-Type") || "").includes("application/pdf")) {
      const url = URL.createObjectURL(await resp.blob());
      if (w) w.location.href = url; else window.open(url, "_blank");
      return;
    }
    const data = await resp.json();
    if (w) w.close();
    uiToast(data.error || "PDF を作れませんでした");
  } catch (e) {
    if (w) w.close();
    uiToast("PDF を作れませんでした。narfi web が動いているか確認してください");
  }
}

// ---- ショートカット（エディタの外にフォーカスがあるときも効くように）

document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || !(e.metaKey || e.ctrlKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "o") { e.preventDefault(); e.shiftKey ? openFolder() : openFileDialog(); }
  else if (k === "s") { e.preventDefault(); e.shiftKey ? saveAs() : saveFile(); }
  else if (k === "p") { e.preventDefault(); e.shiftKey ? exportPdf() : printDocument(); }
});

window.addEventListener("beforeunload", (e) => {
  const unsaved = tabs.some((t, i) => tabDirty(i) && (!autosaveOn || !t.path || t.path.startsWith("lib:")));
  if (unsaved) {
    e.preventDefault();
    e.returnValue = "";
  }
});

// ---- 起動：前回のファイル → 下書き → 例の順に開く

async function startup() {
  if (localStorage.getItem("narfi.sidebar") === "off") toggleSidebar();
  updateAutosaveButton();
  await loadWorkspace();
  // 前回のタブを並べ直す（中身は開いたときに読む）
  const files = new Set((workspaceInfo && workspaceInfo.files) || []);
  const exists = (p) => p.startsWith("lib:") || files.has(p);
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("narfi.tabs") || "null"); } catch (_) {}
  const last = localStorage.getItem("narfi.lastFile");
  const paths = saved ? (saved.paths || []).filter(exists) : (last && exists(last) ? [last] : []);
  tabs = paths.map((p) => ({ path: p, src: null, dirty: false }));
  const draft = localStorage.getItem("narfi.draft");
  if (draft && draft.trim()) {
    tabs.push({ path: "", src: draft, dirty: true });
  }
  if (tabs.length === 0) {
    tabs.push({ path: "", src: DEFAULT_ASCII_DOC, dirty: false, example: true });
  }
  let i = saved ? tabIndex(saved.active || "") : 0;
  if (saved && !saved.active && draft && draft.trim()) i = tabs.length - 1;
  if (i < 0) i = 0;
  if (tabs[i].src == null) {
    await activateTab(i);
    if (activeTab < 0 && tabs.length) {
      const j = tabs.findIndex((t) => t.src != null);
      if (j >= 0) showTab(j); else { tabs.push({ path: "", src: "", dirty: false }); showTab(tabs.length - 1); }
    }
  } else {
    showTab(i);
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  const savedTheme = localStorage.getItem("narfi_theme");
  if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  await startup();
  // はじめて開いた人には Learn（チュートリアル）を出す
  if (!localStorage.getItem("narfi.learn.seen")) {
    localStorage.setItem("narfi.learn.seen", "1");
    switchTab("learn", document.getElementById("learnTabBtn"));
  }
  editorSurface.focus();
});
</script>
