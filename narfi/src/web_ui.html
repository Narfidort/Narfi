<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narfi</title>
<link rel="stylesheet" href="/assets/katex/katex.min.css">
<script src="/assets/katex/katex.min.js"></script>
<!--NARFI_LOCAL-->
<script src="/narfi-web.js"></script>
<script src="/tutorial.js"></script>
<script src="/course.js"></script>
<style>
:root[data-theme="dark"] {
  --bg: #0a0a0c;
  --bg-elev: #111115;
  --bg-hover: #18181e;
  --bg-active: #141824;
  --border: #1f1f26;
  --border-focus: #3b82f6;
  --text: #ededf0;
  --text-dim: #8a8a98;
  --text-faint: #52525e;
  --accent: #60a5fa;
  --kw-decl: #f472b6;
  --kw-step: #60a5fa;
  --kw-just: #34d399;
  --kw-jp: #a78bfa;
  --math-sym: #93c5fd;
  --math-var: #f1f5f9;
  --math-num: #fcd34d;
  --ok: #10b981;
  --warn: #f59e0b;
  --err: #ef4444;
  --caret: #60a5fa;
}
:root[data-theme="light"] {
  --bg: #fafafa;
  --bg-elev: #ffffff;
  --bg-hover: #f1f3f7;
  --bg-active: #eef2ff;
  --border: #e4e4e9;
  --border-focus: #2563eb;
  --text: #141418;
  --text-dim: #646470;
  --text-faint: #a1a1aa;
  --accent: #2563eb;
  --kw-decl: #be185d;
  --kw-step: #1d4ed8;
  --kw-just: #047857;
  --kw-jp: #6d28d9;
  --math-sym: #1e40af;
  --math-var: #111827;
  --math-num: #b45309;
  --ok: #059669;
  --warn: #d97706;
  --err: #dc2626;
  --caret: #2563eb;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 13.5px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
/* Top Bar - Minimal Sharp 38px */
.topbar {
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  user-select: none;
}
.topbar { justify-content: flex-start; gap: 10px; padding: 0 10px 0 14px; }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
  flex-shrink: 0;
}
/* File メニュー */
.menu-wrap { position: relative; flex-shrink: 0; }
.menu-btn {
  display: flex; align-items: center; gap: 4px;
  background: transparent; color: var(--text-dim); border: 1px solid transparent; border-radius: 3px;
  padding: 3px 8px; font-size: 12px; font-family: inherit; cursor: pointer;
}
.menu-btn:hover, .menu-btn.open { color: var(--text); background: var(--bg-hover); border-color: var(--border); }
.menu-btn .chev { width: 10px; height: 10px; }
.menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; min-width: 220px;
  display: flex; flex-direction: column; padding: 4px;
  background: var(--bg-elev); border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}
.menu[hidden] { display: none; }
.menu-item {
  display: flex; justify-content: space-between; align-items: center; gap: 24px;
  background: transparent; color: var(--text); border: 0; border-radius: 2px;
  padding: 5px 10px 5px 24px; font-size: 12.5px; font-family: inherit; text-align: left; cursor: pointer; position: relative;
}
.menu-item:hover { background: var(--bg-active); }
.menu-item .kbd { color: var(--text-faint); font-family: "JetBrains Mono", monospace; font-size: 11px; }
.menu-item.check.active::before { content: "✓"; position: absolute; left: 8px; color: var(--accent); }
.menu-sep { height: 1px; background: var(--border); margin: 4px 2px; }
/* 開いたファイルのタブ */
.tab-strip {
  flex: 1; min-width: 0; height: 100%; display: flex; align-items: stretch;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
.tab-strip::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 6px; flex-shrink: 0; max-width: 220px;
  padding: 0 6px 0 12px; border-right: 1px solid var(--border); cursor: pointer;
  color: var(--text-dim); font-size: 12px; font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
}
.tab:first-child { border-left: 1px solid var(--border); }
.tab:hover { background: var(--bg-hover); color: var(--text); }
.tab.active { color: var(--text); background: var(--bg-elev); box-shadow: inset 0 -2px 0 var(--accent); }
.tab .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .tab-name.ro { font-style: italic; }
.tab .tab-close {
  width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
  border-radius: 2px; color: var(--text-faint); font-size: 13px; line-height: 1; visibility: hidden;
}
.tab:hover .tab-close, .tab.active .tab-close { visibility: visible; }
.tab .tab-close:hover { background: var(--bg-active); color: var(--text); }
.tab.dirty .tab-close::before { content: "●"; font-size: 9px; color: var(--warn); }
.tab.dirty .tab-close { visibility: visible; font-size: 0; }
.tab.dirty .tab-close:hover { font-size: 13px; }
.tab.dirty .tab-close:hover::before { content: none; }
/* 下のステータスバー（Zed 風：アイコンだけ） */
.statusbar {
  height: 24px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px; border-top: 1px solid var(--border); background: var(--bg); user-select: none;
}
.sbar-left, .sbar-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.icon-btn {
  width: 22px; height: 20px; display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; border-radius: 3px; color: var(--text-faint); cursor: pointer; padding: 0;
}
.icon-btn svg { width: 14px; height: 14px; }
.icon-btn.text { width: auto; padding: 0 5px; font-size: 10.5px; font-weight: 600; font-family: "JetBrains Mono", monospace; }
.icon-btn:hover { color: var(--text); background: var(--bg-hover); }
.icon-btn.active { color: var(--accent); }
.statusbar .file-label { margin-left: 6px; font-size: 11px; color: var(--text-dim); max-width: 50vw; }
.logo {
  font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.04em;
  color: var(--text);
  padding-right: 8px;
  border-right: 1px solid var(--border);
}
.ctrl-select, .ctrl-input {
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 8px;
  font-size: 12px;
  font-family: inherit;
  outline: none;
}
.ctrl-select:focus, .ctrl-input:focus {
  border-color: var(--border-focus);
}
.ctrl-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 9px;
  font-size: 11.5px;
  font-family: "JetBrains Mono", "SFMono-Regular", Menlo, sans-serif;
  cursor: pointer;
  transition: color 0.1s, border-color 0.1s, background 0.1s;
}
.ctrl-btn:hover {
  color: var(--text);
  border-color: var(--text-dim);
  background: var(--bg-hover);
}
.ctrl-btn.active {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--bg-active);
}
.status-pill {
  font-family: "JetBrains Mono", monospace;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 2px;
  border: 1px solid var(--border);
}
.status-pill.ok { color: var(--ok); border-color: rgba(16,185,129,0.35); }
.status-pill.sorry { color: var(--warn); border-color: rgba(245,158,11,0.35); }
.status-pill.err { color: var(--err); border-color: rgba(239,68,68,0.4); }

/* Left Sidebar: workspace files & libraries */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 6px 0 20px 0;
  font-size: 12px;
  user-select: none;
}
.sidebar.collapsed { display: none; }
.sb-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px 4px 10px;
  color: var(--text-dim);
  font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
  font-size: 11px;
}
.sb-root {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  font-weight: 600;
}
.sb-mini {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
  font-size: 10.5px;
  font-family: inherit;
  cursor: pointer;
}
.sb-mini:hover { color: var(--text); border-color: var(--text-dim); }
.sb-list { padding: 2px 0 6px 0; }
.sb-icon {
  width: 22px; height: 20px; display: flex; align-items: center; justify-content: center; padding: 0;
  background: transparent; border: 0; border-radius: 3px; color: var(--text-faint); cursor: pointer;
}
.sb-icon svg { width: 14px; height: 14px; }
.sb-icon:hover { color: var(--text); background: var(--bg-hover); }
.sb-head-lib { margin-top: 10px; }
.sb-empty { padding: 3px 12px; color: var(--text-faint); font-size: 11.5px; }
/* ファイルの木 */
.tree { min-height: 24px; }
.tree.drop-root { background: var(--bg-active); }
.t-row {
  position: relative; display: flex; align-items: center; gap: 5px; height: 24px;
  padding-left: calc(8px + var(--depth) * 14px); padding-right: 8px;
  cursor: pointer; white-space: nowrap; color: var(--text); font-size: 12.5px;
}
.t-row:hover { background: var(--bg-hover); }
.t-row.active { background: var(--bg-active); color: var(--accent); }
.t-row.ctx { outline: 1px solid var(--border-focus); outline-offset: -1px; }
.t-row.drop { background: var(--bg-active); outline: 1px dashed var(--accent); outline-offset: -1px; }
.t-row.ro .t-name { color: var(--text-dim); }
.t-name { overflow: hidden; text-overflow: ellipsis; }
.t-ico { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-faint); }
.t-row.dir .t-ico { color: var(--text-dim); }
.t-chev { width: 10px; height: 10px; flex-shrink: 0; color: var(--text-faint); transition: transform 0.1s; }
.t-row.dir.open .t-chev { transform: rotate(90deg); }
.t-row.file .t-chev { visibility: hidden; }
/* 字下げの線（Zed 風） */
.t-guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); }
.t-input {
  flex: 1; min-width: 0; height: 20px; padding: 0 4px; font-size: 12.5px; font-family: inherit;
  background: var(--bg); color: var(--text); border: 1px solid var(--border-focus); border-radius: 2px; outline: none;
}
.t-row.error .t-input { border-color: var(--err); }
/* 右クリックのメニュー */
.ctx-menu { position: fixed; top: 0; left: 0; min-width: 190px; z-index: 300; }
.ctx-menu .menu-item { padding-left: 12px; }
.menu-item.danger { color: var(--err); }
/* 確認・名前の入力 */
.modal-back {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-start; justify-content: center; padding-top: 18vh;
}
.modal-back[hidden] { display: none; }
.modal {
  width: min(440px, 90vw); background: var(--bg-elev); border: 1px solid var(--border);
  box-shadow: 0 12px 40px rgba(0,0,0,0.35); padding: 18px 18px 14px;
}
.modal-title { font-size: 13.5px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
.modal-note { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
.modal-note:empty { display: none; }
.modal-input {
  width: 100%; margin-top: 12px; padding: 6px 8px; font-size: 13px; font-family: "JetBrains Mono", monospace;
  background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; outline: none;
}
.modal-input:focus { border-color: var(--border-focus); }
.modal-input[hidden] { display: none; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.ctrl-btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
.ctrl-btn.primary:hover { filter: brightness(1.1); color: #fff; background: var(--accent); }
.ctrl-btn.primary.danger { background: var(--err); border-color: var(--err); }
.toast {
  position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 110; max-width: 80vw;
  padding: 8px 14px; font-size: 12.5px; color: var(--text); background: var(--bg-elev);
  border: 1px solid var(--border); box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.toast[hidden] { display: none; }
/* Web 版だけ・ローカル版だけのもの */
html.web [data-only="local"] { display: none !important; }
html:not(.web) [data-only="web"] { display: none !important; }
.file-label {
  font-family: "JetBrains Mono", "SFMono-Regular", Menlo, monospace;
  font-size: 12px;
  color: var(--text);
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-label.dirty::after { content: " ●"; color: var(--warn); }
.file-label.readonly::after { content: " (read-only)"; color: var(--text-dim); }

/* Split Workspace with Resizable Right Pane */
.workspace {
  display: flex;
  height: calc(100vh - 38px - 24px);
  width: 100vw;
  overflow: hidden;
}
.editor-surface {
  flex: 1;
  min-width: 280px;
  position: relative;
  /* スクロールを GPU 側で処理させる（背景が透明だと Chrome は再描画でスクロールすることがある） */
  background: var(--bg);
  will-change: scroll-position;
  overflow-y: auto;
  overflow-x: auto;
  padding: 18px 0 80px 0;
  cursor: text;
  outline: none;
}
.pane-resizer {
  width: 5px;
  flex-shrink: 0;
  background: var(--border);
  cursor: col-resize;
  position: relative;
  z-index: 20;
  transition: background 0.12s;
}
.pane-resizer:hover, .pane-resizer.dragging {
  background: var(--accent);
}
.inspector {
  width: var(--inspector-width, 460px);
  flex-shrink: 0;
}
.inspector.collapsed {
  display: none !important;
}
/* Line rows in Mathcha-style structured editor */
.mc-line {
  display: flex;
  align-items: center;
  min-height: 30px;
  min-width: max-content;
  padding: 0 28px 0 0;
  position: relative;
  line-height: 1.65;
}
.mc-line.active {
  background: var(--bg-active);
}
.mc-line.has-err {
  background: rgba(239, 68, 68, 0.07);
}
.mc-gutter {
  width: 44px;
  flex-shrink: 0;
  text-align: right;
  padding-right: 12px;
  font-family: "JetBrains Mono", monospace;
  font-size: 11.5px;
  color: var(--text-faint);
  user-select: none;
}
.mc-line.active .mc-gutter {
  color: var(--accent);
  font-weight: 600;
}
.mc-line.has-err .mc-gutter {
  color: var(--err);
  font-weight: 700;
}
.mc-line.has-sorry .mc-gutter {
  color: var(--warn);
}
.mc-line.mc-therefore { opacity: 0.38; pointer-events: none; font-size: 0.9em; min-height: 0; }
.mc-line.has-warn .mc-gutter { color: var(--warn); text-decoration: underline wavy var(--warn); }
.warn-banner { padding: 8px 12px; border-left: 2px solid var(--warn); background: rgba(245, 158, 11, 0.08); color: var(--warn); font-size: 12.5px; margin-bottom: 14px; white-space: pre-wrap; }
.mc-indent-guides {
  display: inline-flex;
  align-self: stretch;
  flex-shrink: 0;
  pointer-events: none;
}
.mc-indent-guide {
  display: inline-block;
  width: 22px;
  align-self: stretch;
  border-left: 1px solid rgba(140, 140, 165, 0.22);
}
.mc-line.active .mc-indent-guide {
  border-left-color: rgba(96, 165, 250, 0.35);
}
.mc-content {
  flex: 1;
  display: inline-flex;
  align-items: center;
  flex-wrap: nowrap;
  white-space: nowrap;
  min-height: 26px;
  font-family: "KaTeX_Main", "Times New Roman", "Hiragino Mincho ProN", serif;
  font-size: 16px;
  letter-spacing: 0.01em;
}
/* Mathcha Structured Nodes & Slots */
.mc-seq {
  display: inline-flex;
  align-items: center;
  flex-wrap: nowrap;
  white-space: nowrap;
  min-height: 20px;
  min-width: 4px;
  position: relative;
}
.mc-slot {
  display: inline-flex;
  align-items: center;
  min-width: 12px;
  min-height: 19px;
  padding: 0 2px;
  border: 1px dashed transparent;
  border-radius: 2px;
  transition: border-color 0.1s, background 0.1s;
}
.mc-slot.empty {
  border-color: var(--text-faint);
  background: rgba(128,128,128,0.06);
}
.mc-slot.focused-slot {
  border-color: rgba(96, 165, 250, 0.45);
  background: rgba(96, 165, 250, 0.05);
}
/* Fraction Node */
.mc-frac {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 3px;
  padding: 1px 2px;
  border-radius: 2px;
}
.mc-frac-num {
  border-bottom: 1px solid var(--text);
  padding: 0 4px 1px 4px;
  font-size: 0.9em;
  line-height: 1.2;
}
.mc-frac-den {
  padding: 1px 4px 0 4px;
  font-size: 0.9em;
  line-height: 1.2;
}
/* Subscript / Superscript Nodes */
.mc-sub {
  display: inline-flex;
  vertical-align: sub;
  font-size: 0.72em;
  line-height: 1;
  margin-left: 0;
  transform: translateY(3px);
}
.mc-sup {
  display: inline-flex;
  vertical-align: super;
  font-size: 0.72em;
  line-height: 1;
  margin-left: 0.5px;
  transform: translateY(-5px);
}
/* 中身のある添字・上付きは親文字に詰める（入力欄の余白・最小幅・枠線をなくす。枠は outline で描いてずれないように） */
.mc-sub > .mc-slot:not(.empty),
.mc-sup > .mc-slot:not(.empty) {
  padding: 0;
  min-width: 0;
  min-height: 0;
  border-width: 0;
}
.mc-sub > .mc-slot.focused-slot:not(.empty),
.mc-sup > .mc-slot.focused-slot:not(.empty) {
  outline: 1px dashed rgba(96, 165, 250, 0.45);
  outline-offset: 1px;
}
/* Absolute value |...| and Paren (...) Nodes */
.mc-abs {
  display: inline-flex;
  align-items: center;
  border-left: 1.5px solid var(--text);
  border-right: 1.5px solid var(--text);
  padding: 0 4px;
  margin: 0 2px;
}
/* Root Node */
.mc-sqrt {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
}
.mc-sqrt-deg {
  font-size: 0.65em;
  transform: translateY(-6px);
  margin-right: -2px;
}
.mc-sqrt-sign {
  font-size: 1.1em;
  margin-right: 1px;
  user-select: none;
}
.mc-sqrt-body {
  border-top: 1px solid var(--text);
  padding: 1px 3px 0 2px;
}
/* Delimiter Nodes: norm ||x||, floor, ceil, set, inner */
.mc-delim {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
}
.mc-delim-char {
  font-family: "KaTeX_Main", serif;
  font-size: 1.08em;
  color: var(--math-sym);
  user-select: none;
  padding: 0 1px;
}
.mc-norm {
  display: inline-flex;
  align-items: center;
  border-left: 3px double var(--text);
  border-right: 3px double var(--text);
  padding: 0 4px;
  margin: 0 2px;
}
/* Binomial Node */
.mc-binom {
  display: inline-flex;
  align-items: center;
  margin: 0 2px;
}
.mc-binom-paren {
  font-size: 1.55em;
  line-height: 1;
  font-weight: 300;
  color: var(--text);
  user-select: none;
}
.mc-binom-col {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 0 2px;
  font-size: 0.85em;
  line-height: 1.15;
}
/* Big Operator Node (sum, prod, int, lim) */
.mc-bigop {
  display: inline-flex;
  align-items: center;
  margin: 0 3px;
}
.mc-bigop-stack {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.05;
  margin-right: 2px;
}
.mc-bigop-sup {
  font-size: 0.68em;
}
.mc-bigop-sym {
  font-family: "KaTeX_Size1", "KaTeX_Main", serif;
  font-size: 1.25em;
  color: var(--math-sym);
  user-select: none;
}
.mc-bigop-sub {
  font-size: 0.68em;
}
/* Accent Node (vec, hat, bar, tilde) */
.mc-accent {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  vertical-align: middle;
  margin: 0 1px;
}
.mc-accent-mark {
  font-size: 0.72em;
  line-height: 0.6;
  margin-bottom: -1px;
  user-select: none;
  color: var(--text);
}
.mc-accent-bar {
  border-top: 1px solid var(--text);
  padding-top: 1px;
}
/* Inferred Hypothesis Badge (e.g. Fix eps | h_eps  [: eps > 0]) */
.mc-inferred-badge {
  display: inline-flex;
  align-items: center;
  margin-left: 8px;
  padding: 0 6px;
  font-size: 12.5px;
  font-family: "KaTeX_Main", serif;
  color: var(--text-dim);
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 3px;
  user-select: none;
}
/* Atomic Symbol & Syntax Highlighting */
.mc-sym {
  display: inline-block;
  padding: 0 2px;
  color: var(--math-sym);
  font-family: "KaTeX_Main", "KaTeX_Math", serif;
}
.mc-sym.greek {
  font-family: "KaTeX_Math", "Times New Roman", serif;
  font-style: italic;
  color: var(--math-var);
}
.mc-sym.bb {
  font-family: "KaTeX_AMS", "KaTeX_Main", serif;
  color: var(--accent);
}
.mc-kw-decl {
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--kw-decl);
}
.mc-kw-step {
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--kw-step);
}
.mc-kw-just {
  font-family: "JetBrains Mono", monospace;
  font-size: 13.5px;
  color: var(--kw-just);
}
.mc-kw-jp {
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 13.5px;
  color: var(--kw-jp);
  margin: 0 4px;
  user-select: none;
}
.mc-var {
  font-family: "KaTeX_Math", "Times New Roman", serif;
  font-style: italic;
  color: var(--math-var);
}
.mc-ident-fn {
  font-family: "KaTeX_Main", serif;
  font-style: normal;
  color: var(--math-var);
}
.mc-num {
  font-family: "KaTeX_Main", serif;
  color: var(--math-num);
}
.mc-comment {
  font-family: -apple-system, "Hiragino Sans", sans-serif;
  font-size: 13px;
  color: var(--text-dim);
}
.mc-heading {
  font-family: -apple-system, "Hiragino Sans", sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
}
.mc-cmd-draft {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px;
  color: var(--accent);
  background: rgba(96, 165, 250, 0.14);
  border-radius: 2px;
  padding: 0 2px;
}
/* Blinking Caret inside structured sequence */
.mc-sel {
  background: rgba(82, 139, 255, 0.32);
  border-radius: 2px;
}
.mc-caret {
  display: inline-block;
  width: 0;
  height: 17px;
  border-left: 1.8px solid var(--caret);
  margin: 0 -0.9px;
  vertical-align: middle;
  animation: mc-blink 1.05s steps(1) infinite;
  pointer-events: none;
}
@keyframes mc-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Autocomplete Popup */
.ac-popup {
  position: fixed;
  z-index: 100;
  background: var(--bg-elev);
  border: 1px solid var(--border-focus);
  border-radius: 3px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  min-width: 220px;
  max-height: 220px;
  overflow-y: auto;
  display: none;
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
}
.ac-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 10px;
  cursor: pointer;
  gap: 12px;
}
.ac-item.active, .ac-item:hover {
  background: var(--bg-active);
  color: var(--accent);
}
.ac-preview {
  font-family: "KaTeX_Main", serif;
  font-size: 15px;
  min-width: 36px;
}
.ac-cmd {
  color: var(--text);
  font-weight: 500;
}
.ac-desc {
  color: var(--text-dim);
  font-size: 11px;
  margin-left: auto;
}

/* Right Pane */
.inspector {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  min-height: 0;
}
.insp-tabs {
  height: 34px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  padding: 0 12px;
  gap: 16px;
}
.insp-tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-size: 12px;
  font-family: "JetBrains Mono", sans-serif;
  height: 34px;
  padding: 0 2px;
  cursor: pointer;
}
.insp-tab:hover { color: var(--text); }
.insp-tab.active {
  color: var(--text);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.insp-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 18px;
  display: none;
}
.insp-body.active { display: block; }
.sec-label {
  font-family: "JetBrains Mono", monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin: 0 0 8px 0;
  display: flex;
  justify-content: space-between;
}
.hyp-row {
  padding: 5px 10px;
  border-left: 2px solid var(--border-focus);
  background: var(--bg-elev);
  margin-bottom: 4px;
  font-size: 13.5px;
}
.goal-panel {
  padding: 12px 14px;
  border: 1px solid var(--border);
  background: var(--bg-elev);
  margin-bottom: 18px;
}
.err-banner {
  padding: 10px 12px;
  border-left: 2px solid var(--err);
  background: rgba(239, 68, 68, 0.08);
  color: var(--err);
  font-size: 12.5px;
  margin-bottom: 14px;
  white-space: pre-wrap;
  line-height: 1.7;
}
/* 証明木 */
.tree-modal { width: min(1100px, 94vw); max-height: 76vh; overflow: auto; padding: 14px 18px 18px; }
.tree-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-dim); margin-bottom: 10px; gap: 12px; }
.tree-style { background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-size: 10px; padding: 1px 6px; margin-left: 4px; cursor: pointer; font-family: inherit; letter-spacing: 0; text-transform: none; }
.tree-style.active { color: var(--accent); border-color: var(--accent); }
.pt-wrap { overflow-x: auto; padding: 10px 3em 12px 4px; font-size: 0.92em; text-align: center; }
.pt { display: inline-flex; align-items: flex-end; vertical-align: bottom; }
.pt-main { display: inline-flex; flex-direction: column; align-items: center; }
.pt-prems { display: flex; align-items: flex-end; gap: 1.2em; padding: 0 0.3em; }
.pt-bar { align-self: stretch; border-top: 1px solid var(--text-dim); margin: 3px 0; }
.pt-rule { padding: 0 0 1.05em 0.3em; font-size: 0.78em; white-space: nowrap; color: var(--text-dim); line-height: 1; }
.pt-concl, .pt-leaf { padding: 0 0.3em; white-space: nowrap; }
.pt-leaf sup, .pt-rule sup { font-size: 0.75em; color: var(--accent); }
.pt-ctx { font-size: 0.7em; color: var(--text-faint); margin-left: 1px; }
.pt-hyp { font-family: "JetBrains Mono", monospace; font-size: 0.85em; color: var(--accent); }
.fitch { border-collapse: collapse; font-size: 0.92em; margin-top: 6px; }
.fitch td { padding: 2px 6px; vertical-align: middle; white-space: nowrap; }
.fitch .fn { color: var(--text-faint); font-family: "JetBrains Mono", monospace; font-size: 11px; text-align: right; }
.fitch .ff { display: flex; align-items: stretch; }
.fitch .fb { border-left: 1px solid var(--text-dim); margin-right: 10px; }
.fitch .fb.first + .fformula, .fitch .fformula { padding: 1px 0; }
.fitch tr:has(.fb.first) .fformula { border-bottom: 1px solid var(--text-dim); }
.fitch .fj { color: var(--text-dim); font-size: 0.85em; }
.err-banner .katex { color: var(--text); font-size: 1.08em; margin: 0 0.15em; }
/* Learn（チュートリアル） */
.hints { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 14px; }
.hints-label { font-size: 10.5px; color: var(--text-faint); font-family: "JetBrains Mono", monospace; margin-right: 2px; }
.hint { font-family: "JetBrains Mono", monospace; font-size: 11.5px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg-elev); color: var(--text); cursor: pointer; }
.hint:hover { border-color: var(--accent); color: var(--accent); }
.deps { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; font-family: "JetBrains Mono", monospace; }
.learn-nav { display: flex; gap: 6px; margin-bottom: 14px; }
.learn-nav select { flex: 1; min-width: 0; }
.learn-body { font-size: 13.5px; line-height: 1.85; color: var(--text); }
.learn-body h3 { font-size: 15px; margin: 0 0 10px; font-weight: 600; }
.learn-body p { margin: 0 0 12px; }
.learn-body a { color: var(--accent); }
.learn-body code { font-family: "JetBrains Mono", monospace; font-size: 12px; padding: 1px 4px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 2px; }
.learn-body pre { font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.6; padding: 10px 12px; margin: 0 0 12px; background: var(--bg-elev); border: 1px solid var(--border); overflow-x: auto; }
.learn-body table { border-collapse: collapse; margin: 0 0 12px; font-size: 12.5px; }
.learn-body td { padding: 4px 12px 4px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.learn-body td:first-child { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--accent); white-space: nowrap; }
.learn-actions { display: flex; gap: 8px; margin: 16px 0 12px; }
.prose-err { margin: 6px 0 14px; padding: 6px 10px; border-left: 2px solid var(--err); background: rgba(239, 68, 68, 0.06); color: var(--err); font-size: 12.5px; white-space: pre-wrap; cursor: pointer; }
.prose-err .katex { color: var(--text); }
.prose-thm.prose-broken { border-left-color: var(--err); }
.prose-doc {
  line-height: 1.85;
  font-size: 14px;
}
.prose-thm {
  padding: 10px 14px;
  border-left: 2px solid var(--accent);
  background: var(--bg-elev);
  margin: 14px 0 8px 0;
}
.prose-proof {
  padding-left: 12px;
  border-left: 1px solid var(--border);
  margin-bottom: 20px;
}
.raw-box {
  width: 100%;
  height: calc(100vh - 140px);
  background: var(--bg-elev);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 12px;
  font-family: "JetBrains Mono", monospace;
  font-size: 12.5px;
  line-height: 1.6;
  resize: none;
  outline: none;
}
.mc-mul { display: inline-block; width: 0.32em; text-align: center; opacity: 0.3; color: var(--text-dim); }
.mc-ghost { color: var(--text-faint); font-style: italic; margin-left: 6px; user-select: none; }
.mc-ghost-key { font-family: "JetBrains Mono", monospace; font-size: 10px; font-style: normal; border: 1px solid var(--border); border-radius: 2px; padding: 0 4px; margin-left: 6px; }
</style>

<body>
<div class="topbar">

<script>
// ================================================================
// 1. Mathcha-style Structured AST & Command Dictionary
// ================================================================

const COMMAND_DICT = [
  // Structural Nodes (Mathcha-style boxed slots)
  { cmd: "frac", preview: "a/b", desc: "fraction node", kind: "frac" },

let nextSeqId = 1;
const seqMap = new Map();

function createSeq(items = [], parentNode = null, slotName = null) {
  const seq = { id: nextSeqId++, items, parentNode, slotName };
  for (const it of items) {
    it.parentSeq = seq;
    if (it.kind === "frac" || it.kind === "binom") {
      it.num.parentNode = it; it.num.slotName = "num";
      it.den.parentNode = it; it.den.slotName = "den";
    } else if (it.kind === "bigop") {
      it.sub.parentNode = it; it.sub.slotName = "sub";
      it.sup.parentNode = it; it.sup.slotName = "sup";
      it.body.parentNode = it; it.body.slotName = "body";
    } else if (it.body) {
      it.body.parentNode = it; it.body.slotName = "body";
    }
  }
  seqMap.set(seq.id, seq);
  return seq;
}

function makeChar(ch) { return { kind: "char", ch }; }
function makeSym(ascii, display, cls = "") { return { kind: "sym", ascii, display, cls }; }
function makeFrac(numItems = [], denItems = [], parentSeq = null) {
  const node = { kind: "frac", num: null, den: null, parentSeq };
  node.num = createSeq(numItems, node, "num");
  node.den = createSeq(denItems, node, "den");
  return node;
}
function makeBinom(numItems = [], denItems = [], parentSeq = null) {
  const node = { kind: "binom", num: null, den: null, parentSeq };
  node.num = createSeq(numItems, node, "num");
  node.den = createSeq(denItems, node, "den");
  return node;
}
function makeSub(bodyItems = [], parentSeq = null) {
  const node = { kind: "sub", body: null, parentSeq };
  node.body = createSeq(bodyItems, node, "body");
  return node;
}
function makeSup(bodyItems = [], parentSeq = null) {
  const node = { kind: "sup", body: null, parentSeq };
  node.body = createSeq(bodyItems, node, "body");
  return node;
}
function makeAbs(bodyItems = [], parentSeq = null) {
  const node = { kind: "abs", body: null, parentSeq };
  node.body = createSeq(bodyItems, node, "body");
  return node;
}
function makeSqrt(bodyItems = [], parentSeq = null) {
  const node = { kind: "sqrt", body: null, parentSeq };
  node.body = createSeq(bodyItems, node, "body");
  return node;
}
function makeDelim(fnName, leftCh, rightCh, bodyItems = [], parentSeq = null) {
  const node = { kind: "delim", fnName, leftCh, rightCh, body: null, parentSeq };
  node.body = createSeq(bodyItems, node, "body");
  return node;
}
function makeAccent(fnName, mark, bodyItems = [], parentSeq = null) {
  const node = { kind: "accent", fnName, mark, body: null, parentSeq };
  node.body = createSeq(bodyItems, node, "body");
  return node;
}
function makeBigOp(fnName, sym, subItems = [], supItems = [], bodyItems = [], parentSeq = null) {
  const node = { kind: "bigop", fnName, sym, sub: null, sup: null, body: null, parentSeq };
  node.sub = createSeq(subItems, node, "sub");
  node.sup = createSeq(supItems, node, "sup");
  node.body = createSeq(bodyItems, node, "body");
  return node;
}

const UNICODE_TO_SYM = {};
const WORD_TO_SYM = {};
for (const c of COMMAND_DICT) {
  if (c.kind === "sym") {
    UNICODE_TO_SYM[c.display] = [c.ascii, c.display, c.cls || ""];
    WORD_TO_SYM[c.ascii] = [c.ascii, c.display, c.cls || ""];
    if (["epsilon", "varepsilon", "vartheta", "varphi"].includes(c.cmd)) {
      WORD_TO_SYM[c.cmd] = [c.ascii, c.display, c.cls || ""];
    }
  }
}

// notation で宣言された記号を補完候補に加える（/api/check の notations から）
function registerNotations(list) {
  for (const n of list || []) {
    if (COMMAND_DICT.some(c => c.kind === "sym" && c.display === n.sym)) continue;
    const ascii = /^\\[A-Za-z]+$/.test(n.latex) ? n.latex : n.sym;
    const entry = { cmd: n.pred, preview: n.sym, desc: `notation ${n.pred}`, kind: "sym", ascii, display: n.sym, cls: "" };
    COMMAND_DICT.push(entry);
    if ([...n.sym].length === 1) UNICODE_TO_SYM[n.sym] = [ascii, n.sym, ""];
  }
}

function findMatchingClose(str, openIdx, openCh, closeCh) {
  let depth = 0;
  for (let i = openIdx; i < str.length; i++) {
    if (str[i] === openCh) depth++;
    else if (str[i] === closeCh) {
      depth--;
      if (depth === 0) return i;
    }
  }
  return -1;
}

  let last = 0;
  for (let i = 0; i < str.length; i++) {
    if (str[i] === "(" || str[i] === "{") depth++;
    else if (str[i] === ")" || str[i] === "}") depth--;
    else if (str[i] === "," && depth === 0) {
      parts.push(str.substring(last, i).trim());
      last = i + 1;
    }
  }
  parts.push(str.substring(last).trim());
  return parts;
}

function parseAsciiToItems(str) {
  const trimmed = str.trimStart();
  if (trimmed.startsWith("//") || trimmed.startsWith("--") || trimmed.startsWith("#")) {
    return Array.from(str).map(makeChar);
  }
  const items = [];
  let i = 0;
  while (i < str.length) {
    const ch = str[i];

    // 1. Structured Function Calls: abs(...), sqrt(...), norm(...), floor(...), ceil(...), set(...), inner(...), binom(n,k), vec/hat/bar/tilde(...), sum/prod/int(...)
    let fnMatch = str.slice(i).match(/^(abs|sqrt|norm|floor|ceil|set|inner|binom|vec|hat|bar|tilde|sum|prod|int)\(/);
    // sum(…)・prod(…)・int(…) は引数が 3 つのときだけ Σ の入力欄にする（sum(a, n) は lib/algebra/sum の関数）
    if (fnMatch && ["sum", "prod", "int"].includes(fnMatch[1]) && (i > 0 && /[A-Za-z0-9_.]/.test(str[i - 1]) ||
        splitTopLevelCommaArgs(str.substring(i + fnMatch[1].length + 1, Math.max(i + fnMatch[1].length + 1, findMatchingClose(str, i + fnMatch[1].length, "(", ")")))).length !== 3)) {
      fnMatch = null;
    }
    if (fnMatch) {
      const fnName = fnMatch[1];
      const openIdx = i + fnName.length;
      const closeIdx = findMatchingClose(str, openIdx, "(", ")");
      if (closeIdx > openIdx) {
        const inner = str.substring(openIdx + 1, closeIdx);
        if (fnName === "abs") items.push(makeAbs(parseAsciiToItems(inner)));
        else if (fnName === "sqrt") items.push(makeSqrt(parseAsciiToItems(inner)));
        else if (fnName === "norm") items.push(makeDelim("norm", "‖", "‖", parseAsciiToItems(inner)));
        else if (fnName === "floor") items.push(makeDelim("floor", "⌊", "⌋", parseAsciiToItems(inner)));
        else if (fnName === "ceil") items.push(makeDelim("ceil", "⌈", "⌉", parseAsciiToItems(inner)));
        else if (fnName === "set") items.push(makeDelim("set", "{", "}", parseAsciiToItems(inner)));
        else if (fnName === "inner") items.push(makeDelim("inner", "⟨", "⟩", parseAsciiToItems(inner)));
        else if (fnName === "binom") {
          const [a, b] = splitTopLevelCommaArgs(inner);
          items.push(makeBinom(parseAsciiToItems(a || ""), parseAsciiToItems(b || "")));
        } else if (["vec", "hat", "bar", "tilde"].includes(fnName)) {
          const markMap = { vec: "→", hat: "^", bar: "bar", tilde: "~" };
          items.push(makeAccent(fnName, markMap[fnName], parseAsciiToItems(inner)));
        } else if (["sum", "prod", "int"].includes(fnName)) {
          const [subS, supS, bodyS] = splitTopLevelCommaArgs(inner);
          const symMap = { sum: "∑", prod: "∏", int: "∫" };
          items.push(makeBigOp(fnName, symMap[fnName], parseAsciiToItems(subS || ""), parseAsciiToItems(supS || ""), parseAsciiToItems(bodyS || "")));
        }
        i = closeIdx + 1;
        continue;
      }
    }

    // |...| -> Abs node。開きの | は直後に空白がないもの（`Fix x | h` の | や `|-` は除く）、
    // 閉じの | は直前に空白がないもの。括弧の中の | は閉じとみなさない。
    if (ch === "|" && i + 1 < str.length && str[i + 1] !== "-" && !/\s/.test(str[i + 1])) {
      let depth = 0, nextBar = -1;
      for (let k = i + 1; k < str.length; k++) {
        const c = str[k];
        if (c === "(") depth++;
        else if (c === ")") depth--;
        else if (c === "|" && depth === 0 && k > i + 1 && !/\s/.test(str[k - 1])) { nextBar = k; break; }
      }
      if (nextBar > i + 1 && !str.substring(i + 1, nextBar).includes(" : ")) {
        const inner = str.substring(i + 1, nextBar);
        items.push(makeAbs(parseAsciiToItems(inner)));
        i = nextBar + 1;
        continue;
      }
    }

    // 2. Unicode subscripts ₀..₉
    if (ch >= "₀" && ch <= "₉") {
      const d = String(ch.charCodeAt(0) - "₀".charCodeAt(0));
      items.push(makeSub([makeChar(d)]));
      i++;
      continue;
    }

    // 3. _ subscript: _{...} or _digit
    if (ch === "_" && i + 1 < str.length) {
      if (str[i + 1] === "{") {
        const closeIdx = findMatchingClose(str, i + 1, "{", "}");
        if (closeIdx > i + 1) {
          const inner = str.substring(i + 2, closeIdx);
          items.push(makeSub(parseAsciiToItems(inner)));
          i = closeIdx + 1;
          continue;
        }
      } else if (/[0-9]/.test(str[i + 1])) {
        let j = i + 1;
        while (j < str.length && /[0-9]/.test(str[j])) j++;
        items.push(makeSub(Array.from(str.substring(i + 1, j)).map(makeChar)));
        i = j;
        continue;
      }
    }

    // 4. ^ superscript: ^{...} or ^digit or ²/³
    if (ch === "²" || ch === "³") {
      items.push(makeSup([makeChar(ch === "²" ? "2" : "3")]));
      i++;
      continue;
    }
    if (ch === "^" && i + 1 < str.length) {
      if (str[i + 1] === "{") {
        const closeIdx = findMatchingClose(str, i + 1, "{", "}");
        if (closeIdx > i + 1) {
          const inner = str.substring(i + 2, closeIdx);
          items.push(makeSup(parseAsciiToItems(inner)));
          i = closeIdx + 1;
          continue;
        }
      } else if (/[0-9a-zA-Z]/.test(str[i + 1])) {
        items.push(makeSup([makeChar(str[i + 1])]));
        i += 2;
        continue;
      }
    }

    // 5. Multi-char ASCII operators
    if (str.startsWith("<->", i)) { items.push(makeSym("<->", "↔")); i += 3; continue; }
    if (str.startsWith("->", i)) { items.push(makeSym("->", "→")); i += 2; continue; }
    if (str.startsWith("<-", i)) { items.push(makeSym("<-", "⇐")); i += 2; continue; }
    if (str.startsWith("<=", i) || str.startsWith("=<", i)) { items.push(makeSym("<=", "≤")); i += 2; continue; }
    if (str.startsWith(">=", i)) { items.push(makeSym(">=", "≥")); i += 2; continue; }
    if (str.startsWith("!=", i)) { items.push(makeSym("!=", "≠")); i += 2; continue; }
    if (str.startsWith("|->", i)) { items.push(makeSym("|->", "↦")); i += 3; continue; }
    if (str.startsWith("↦", i)) { items.push(makeSym("|->", "↦")); i += 1; continue; }
    if (str.startsWith("|-", i)) { items.push(makeSym("|-", "⊢")); i += 2; continue; }
    const lto = str.slice(i).match(/^\\(longrightarrow|lto)(?![A-Za-z])\s?/);
    if (lto) { items.push(makeSym("\\longrightarrow", "⟶")); i += lto[0].length; continue; }

    // 6. Direct Unicode symbol
    if (UNICODE_TO_SYM[ch]) {
      const [asc, disp, cls] = UNICODE_TO_SYM[ch];
      items.push(makeSym(asc, disp, cls));
      i++;
      continue;
    }

    // 7. Fraction `/`
    if (ch === "/" && str[i + 1] !== "/" && str[i + 1] !== "\\") {
      while (items.length > 0 && items[items.length - 1].kind === "char" && items[items.length - 1].ch === " ") {
        items.pop();
      }
      const numItems = popPrecedingTermItems(items);
      i++;
      while (i < str.length && str[i] === " ") i++;
      const [denStr, nextI] = readFollowingTermAtom(str, i);
      const denItems = parseAsciiToItems(denStr);
      items.push(makeFrac(numItems, denItems));
      i = nextI;
      continue;
    }

    // 8. Identifier / Keyword / Greek word
    if (/[A-Za-zα-ωΑ-Ω]/.test(ch)) {
      let j = i + 1;
      while (j < str.length && (/[A-Za-z0-9_']/.test(str[j]) && !(str[j] === "_" && /[0-9{]/.test(str[j + 1] || "")))) {
        j++;
      }
      const word = str.substring(i, j);
      // conv_a・a_n のように「_ + 1文字」で終わる名前は添字にする（Prose の表示と同じ）
      const subm = word.match(/^([A-Za-z]+)_([A-Za-z0-9])$/);
      if (WORD_TO_SYM[word]) {
        const [asc, disp, cls] = WORD_TO_SYM[word];
        items.push(makeSym(asc, disp, cls));
      } else if (subm && !WORD_TO_SYM[subm[1]]) {
        for (const c of subm[1]) items.push(makeChar(c));
        items.push(makeSub([makeChar(subm[2])]));
      } else {
        for (const c of word) items.push(makeChar(c));
      }
      i = j;
      continue;
    }

    items.push(makeChar(ch));
    i++;
  }
  return items;
}

function popPrecedingTermItems(items) {
  if (items.length === 0) return [];
  const last = items[items.length - 1];
  if (["sym", "frac", "abs", "sqrt", "delim", "binom", "accent", "bigop"].includes(last.kind)) {
    return [items.pop()];
  }
  if (last.kind === "sub" || last.kind === "sup") {
    const subOrSup = items.pop();
    const base = popPrecedingTermItems(items);
    return [...base, subOrSup];
  }
  if (last.kind === "char" && last.ch === ")") {
    let depth = 0;
    const popped = [];
    while (items.length > 0) {
      const it = items.pop();
      popped.unshift(it);
      if (it.kind === "char" && it.ch === ")") depth++;
      else if (it.kind === "char" && it.ch === "(") {
        depth--;
        if (depth === 0) break;
      }
    }
    if (popped.length >= 2 && popped[0].kind === "char" && popped[0].ch === "(" && popped[popped.length - 1].kind === "char" && popped[popped.length - 1].ch === ")") {
      return popped.slice(1, -1);
    }
    return popped;
  }
  const popped = [];
  while (items.length > 0) {
    const it = items[items.length - 1];
    if (it.kind === "char" && /[A-Za-z0-9.]/.test(it.ch)) {
      popped.unshift(items.pop());
    } else if (it.kind === "sym" && it.cls === "greek") {
      popped.unshift(items.pop());
      break;
    } else {
      break;
    }
  }
  return popped;
}

function readFollowingTermAtom(str, start) {
  if (start >= str.length) return ["", start];
  if (str[start] === "(") {
    const closeIdx = findMatchingClose(str, start, "(", ")");
    if (closeIdx > start) {
      return [str.substring(start + 1, closeIdx), closeIdx + 1];
    }
  }
  let j = start;
  while (j < str.length && /[A-Za-z0-9_α-ωε{]/.test(str[j])) {
    if (str[j] === "{") {
      const closeIdx = findMatchingClose(str, j, "{", "}");
      if (closeIdx > j) { j = closeIdx + 1; continue; }
    }
    if (str[j] === "(") {
      const closeIdx = findMatchingClose(str, j, "(", ")");
      if (closeIdx > j) { j = closeIdx + 1; break; }
    }
    j++;
  }
  return [str.substring(start, j), j];
}

// ================================================================
// 3. Serialize Structured Sequence -> Pure ASCII Code
// ================================================================

function needsAtomParens(s) {
  const t = s.trim();
  if (!t) return false;
  for (let i = 0; i < t.length; i++) {
    if ("+-*/ ".includes(t[i])) return true;
  }
  return false;
}

function isAlphaNumChar(ch) {
  return Boolean(ch && /[A-Za-z0-9_]/.test(ch));
}

function serializeSeqToAscii(seq) {
  let out = "";
  const items = seq.items;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.kind === "char") {
      out += it.ch;
      // 文字の「|」と「-」が続く（|-x| の絶対値）ときは、⊢（|-）と読まれないよう空白を挟む
      const nx = items[i + 1];
      if (it.ch === "|" && nx && nx.kind === "char" && nx.ch === "-") out += " ";
    } else if (it.kind === "sym") {
      const wordLike = /^[A-Za-z]+$/.test(it.ascii);
      const prev = items[i - 1];
      // 名前の一部のギリシャ文字（hε など）は h_{eps} と書く（パーサが hε に戻す）
      const isGreek = /^[α-ωΑ-Ω]$/.test(it.display);
      if (isGreek && wordLike && prev && prev.kind === "char" && /[A-Za-z0-9']/.test(prev.ch)) {
        out += `_{${it.ascii}}`;
        continue;
      }
      if (wordLike && out.length > 0 && isAlphaNumChar(out[out.length - 1])) {
        out += " ";
      }
      out += it.ascii;
      // \longrightarrow などの TeX コマンドの後ろには空白を1つ置く（英字が続くと名前がつながるため。
      // 読み込み側はこの空白を1つ読み飛ばす）
      const nx = items[i + 1];
      if (/^\\[A-Za-z]+$/.test(it.ascii) && nx && !(nx.kind === "char" && nx.ch === " ")) {
        out += " ";
      }
      const next = items[i + 1];
      const nextIsAlpha = next && ((next.kind === "char" && isAlphaNumChar(next.ch)) || (next.kind === "sym" && /^[A-Za-z]+$/.test(next.ascii)));
      const nextIsRelOrDot = next && ((next.kind === "char" && ".:,)><=".includes(next.ch)) || (next.kind === "sym" && ["<=", ">=", "!=", "in", "notin", "subset", "subseteq"].includes(next.ascii)) || next.kind === "sub" || next.kind === "sup");
      if (wordLike && nextIsAlpha && !nextIsRelOrDot) {
        out += " ";
      }
    } else if (it.kind === "frac") {
      const n = serializeSeqToAscii(it.num).trim() || "1";
      const d = serializeSeqToAscii(it.den).trim() || "1";
      const nCode = needsAtomParens(n) ? `(${n})` : n;
      const dCode = needsAtomParens(d) ? `(${d})` : d;
      out += `${nCode}/${dCode}`;
    } else if (it.kind === "sub") {
      const b = serializeSeqToAscii(it.body).trim();
      const nx = items[i + 1];
      const nextAlnum = nx && nx.kind === "char" && /[A-Za-z0-9_']/.test(nx.ch);
      if (/^[0-9]$/.test(b) || (/^[A-Za-z]$/.test(b) && !nextAlnum)) {
        out += `_${b}`;
      } else if (b.length > 0) {
        out += `_{${b}}`;
      }
    } else if (it.kind === "sup") {
      const b = serializeSeqToAscii(it.body).trim();
      if (/^[0-9a-zA-Z]$/.test(b)) {
        out += `^${b}`;
      } else if (b.length > 0) {
        out += `^{${b}}`;
      }
    } else if (it.kind === "abs") {
      out += `abs(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "sqrt") {
      out += `sqrt(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "delim") {
      out += `${it.fnName}(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "binom") {
      out += `binom(${serializeSeqToAscii(it.num).trim() || "0"}, ${serializeSeqToAscii(it.den).trim() || "0"})`;
    } else if (it.kind === "accent") {
      out += `${it.fnName}(${serializeSeqToAscii(it.body).trim()})`;
    } else if (it.kind === "bigop") {
      out += `${it.fnName}(${serializeSeqToAscii(it.sub).trim() || "0"}, ${serializeSeqToAscii(it.sup).trim() || "0"}, ${serializeSeqToAscii(it.body).trim() || "0"})`;
    }
  }
  return out;
}
</script>
<script>
// ================================================================
// 4. Document Model, Cursor & Japanese Sugar View Lens
// ================================================================

const DEFAULT_ASCII_DOC = `-- Narfi へようこそ。証明を書くと、各行が検査され、右上に結果が出ます。
-- 書き方は右の Learn タブのチュートリアルで。カーソルの行の文脈と Goal は Goal タブに出ます。

axiom triangle    : forall x:Real. forall y:Real. abs(x + y) <= abs(x) + abs(y)
axiom pos_half    : x : Real, h : x > 0 |- x/2 > 0
axiom ge.max.left  : n : Nat, h : n >= max(a, b) |- n >= a
axiom ge.max.right : n : Nat, h : n >= max(a, b) |- n >= b

thm conv.add :
  a : Nat -> Real, b : Nat -> Real,
  conv_a : forall eps>0. exists N:Nat. forall n>=N. abs(a_n - alpha) < eps,
  conv_b : forall eps>0. exists N:Nat. forall n>=N. abs(b_n - beta) < eps
  |- forall eps>0. exists N:Nat. forall n>=N. abs((a_n + b_n) - (alpha + beta)) < eps

Fix eps | h_{eps} : eps > 0
  Obtain N_1(eps), hN_1 : conv_a(eps/2, pos_half(h_{eps}))
  Obtain N_2(eps), hN_2 : conv_b(eps/2, pos_half(h_{eps}))
  let N := max(N_1, N_2)
  choose N
  Fix n | h_{n} : n >= N
    abs((a_n + b_n) - (alpha + beta))
      <= abs(a_n - alpha) + abs(b_n - beta)   by triangle(a_n - alpha, b_n - beta)
      < eps/2 + eps/2                           by hN_1(ge.max.left(h_{n})), hN_2(ge.max.right(h_{n}))
      = eps                                     by ring
  therefore forall n>=N. abs((a_n + b_n) - (alpha + beta)) < eps
`;

let docLines = []; // [{ indent: number, rootSeq: Seq }]
let cursor = { lineIdx: 0, seqId: 1, offset: 0 };
let jpSugarLens = false;
let currentFilePath = "";
let lastCheckData = null;
let checkDebounce = null;

// Autocomplete state
let acMatches = [];
let acIndex = 0;
let acRange = null; // { seqId, startOffset, endOffset, isSlash }

function loadSourceIntoDoc(srcText) {
  seqMap.clear();
  nextSeqId = 1;
  const rawLines = srcText.replace(/\r\n/g, "\n").split("\n");
  docLines = rawLines.map(raw => {
    const m = raw.match(/^( *)/);
    const spaces = m ? m[1].length : 0;
    const indent = Math.floor(spaces / 2);
    const content = raw.substring(indent * 2);
    const rootSeq = createSeq(parseAsciiToItems(content), null, "root");
    return { indent, rootSeq };
  });
  if (docLines.length === 0) {
    docLines = [{ indent: 0, rootSeq: createSeq([], null, "root") }];
  }
  cursor = { lineIdx: 0, seqId: docLines[0].rootSeq.id, offset: 0 };
  selAnchor = null;
  resetHistory();
}

function serializeDocToAscii() {
  return docLines.map(line => {
    const body = serializeSeqToAscii(line.rootSeq);
    if (!body.trim()) return "";
    return "  ".repeat(line.indent) + body;
  }).join("\n");
}

function escHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Render a slice of items [startIdx, endIdx) inside `seq` with syntax highlighting and caret
function renderItemsSliceHtml(seq, startIdx, endIdx) {
  const isFocusedSeq = (cursor.seqId === seq.id);
  const items = seq.items;
  let html = "";

  // Check if whole rootSeq is a comment or heading
  if (seq.slotName === "root" && startIdx === 0) {
    let rawPrefix = "";
    for (let k = 0; k < Math.min(4, items.length); k++) {
      if (items[k].kind === "char") rawPrefix += items[k].ch;
    }
    if (rawPrefix.startsWith("//") || rawPrefix.startsWith("--") || rawPrefix.startsWith("#")) {
      const cls = rawPrefix.startsWith("#") ? "mc-heading" : "mc-comment";
      html += `<span class="${cls}">`;
      for (let i = startIdx; i < endIdx; i++) {
        if (isFocusedSeq && cursor.offset === i) html += `<span class="mc-caret"></span>`;
        html += renderSingleItemHtml(seq, items[i], i, "comment");
      }
      if (isFocusedSeq && cursor.offset === endIdx) html += `<span class="mc-caret"></span>`;
      html += `</span>`;
      return html;
    }
  }

  // Pre-classify char tokens into words / numbers / backslash-drafts for syntax highlighting
  const charClasses = new Array(items.length).fill("");
  let i = 0;
  while (i < items.length) {
    if (items[i].kind === "char") {
      if (items[i].ch === "\\") {
        let j = i + 1;
        while (j < items.length && items[j].kind === "char" && /[A-Za-z0-9_]/.test(items[j].ch)) j++;
        for (let k = i; k < j; k++) charClasses[k] = "mc-cmd-draft";
        i = j;
        continue;
      }
      if (/[A-Za-z_]/.test(items[i].ch)) {
        let j = i + 1;
        let word = items[i].ch;
        while (j < items.length && items[j].kind === "char" && /[A-Za-z0-9_.']/.test(items[j].ch)) {
          word += items[j].ch;
          j++;
        }
        // h.left・h.right（∧ の取り出し）は、h を変数として描き、.left だけを立体にする
        const proj = word.match(/^([^.]+)\.(left|right)$/);
        if (proj && !DECL_KWS.has(proj[1])) {
          const head = proj[1];
          const headCls = (UPRIGHT_FNS.has(head) || head.includes("_") || head.length > 3 || declNames.has(head)) ? "mc-ident-fn" : "mc-var";
          for (let k = i; k < j; k++) charClasses[k] = k < i + head.length ? headCls : "mc-ident-fn";
          i = j;
          continue;
        }
        let cls = "mc-var";
        if (DECL_KWS.has(word)) cls = "mc-kw-decl";
        else if (STEP_KWS.has(word)) cls = "mc-kw-step";
        else if (JUST_KWS.has(word)) cls = "mc-kw-just";
        else if (UPRIGHT_FNS.has(word) || word.includes(".") || word.includes("_")) cls = "mc-ident-fn";
        else if (word.length > 3 || declNames.has(word)) cls = "mc-ident-fn";
        for (let k = i; k < j; k++) charClasses[k] = cls;
        i = j;
        continue;
      }
      if (/[0-9]/.test(items[i].ch)) {
        charClasses[i] = "mc-num";
      }
    }
    i++;
  }

  for (let idx = startIdx; idx < endIdx; idx++) {
    if (isFocusedSeq && cursor.offset === idx) {
      html += `<span class="mc-caret"></span>`;
    }
    const hl = selHL.get(seq.id);
    const one = renderSingleItemHtml(seq, items[idx], idx, charClasses[idx]);
    html += (hl && idx >= hl[0] && idx < hl[1]) ? `<span class="mc-sel">${one}</span>` : one;
  }
  if (isFocusedSeq && cursor.offset === endIdx) {
    html += `<span class="mc-caret"></span>`;
  }
  return html;
}

function renderSingleItemHtml(seq, it, idx, charCls) {
  if (it.kind === "char") {
    // 積の * は、教科書のように記号なしに近い形で（消したり選んだりできるよう、薄い点として残す）
    if (it.ch === "*" && !isCommentLine(seq)) {
      return `<span class="mc-mul" data-seq="${seq.id}" data-idx="${idx}">·</span>`;
    }
    const chDisp = it.ch === " " ? "&nbsp;" : escHtml(it.ch);
    return `<span class="${charCls}" data-seq="${seq.id}" data-idx="${idx}">${chDisp}</span>`;
  }
  if (it.kind === "sym" && it.ascii === "*") {
    return `<span class="mc-mul" data-seq="${seq.id}" data-idx="${idx}">·</span>`;
  }
  if (it.kind === "sym") {
    // 黒板太字は KaTeX と同じく、KaTeX_AMS の英字で描く（ℚ・ℂ などの Unicode 文字は KaTeX_AMS になく、別のフォントになる）
    const shown = it.cls === "bb" && BB_LATIN[it.display] ? BB_LATIN[it.display] : it.display;
    return `<span class="mc-sym ${it.cls || ''}" data-seq="${seq.id}" data-idx="${idx}">${escHtml(shown)}</span>`;
  }
  if (it.kind === "frac") {
    return `<span class="mc-frac" data-seq="${seq.id}" data-idx="${idx}">` +
      `<span class="mc-frac-num">${renderSlotSeqHtml(it.num)}</span>` +
      `<span class="mc-frac-den">${renderSlotSeqHtml(it.den)}</span>` +
      `</span>`;
  }
  if (it.kind === "binom") {
    return `<span class="mc-binom" data-seq="${seq.id}" data-idx="${idx}">` +
      `<span class="mc-binom-paren">(</span>` +
      `<span class="mc-binom-col"><span>${renderSlotSeqHtml(it.num)}</span><span>${renderSlotSeqHtml(it.den)}</span></span>` +
      `<span class="mc-binom-paren">)</span>` +
      `</span>`;
  }
  if (it.kind === "sub") {
    return `<span class="mc-sub" data-seq="${seq.id}" data-idx="${idx}">${renderSlotSeqHtml(it.body)}</span>`;
  }
  if (it.kind === "sup") {
    return `<span class="mc-sup" data-seq="${seq.id}" data-idx="${idx}">${renderSlotSeqHtml(it.body)}</span>`;
  }
  if (it.kind === "abs") {
    return `<span class="mc-abs" data-seq="${seq.id}" data-idx="${idx}">${renderSlotSeqHtml(it.body)}</span>`;
  }
  if (it.kind === "sqrt") {
    return `<span class="mc-sqrt" data-seq="${seq.id}" data-idx="${idx}">` +
      `<span class="mc-sqrt-sign">√</span>` +
      `<span class="mc-sqrt-body">${renderSlotSeqHtml(it.body)}</span>` +
      `</span>`;
  }
  if (it.kind === "delim") {
    if (it.fnName === "norm") {
      return `<span class="mc-norm" data-seq="${seq.id}" data-idx="${idx}">${renderSlotSeqHtml(it.body)}</span>`;
    }
    return `<span class="mc-delim" data-seq="${seq.id}" data-idx="${idx}">` +
      `<span class="mc-delim-char">${escHtml(it.leftCh)}</span>` +
      renderSlotSeqHtml(it.body) +
      `<span class="mc-delim-char">${escHtml(it.rightCh)}</span>` +
      `</span>`;
  }
  if (it.kind === "accent") {
    if (it.mark === "bar") {
      return `<span class="mc-accent" data-seq="${seq.id}" data-idx="${idx}">` +
        `<span class="mc-accent-bar">${renderSlotSeqHtml(it.body)}</span>` +
        `</span>`;
    }
    return `<span class="mc-accent" data-seq="${seq.id}" data-idx="${idx}">` +
      `<span class="mc-accent-mark">${escHtml(it.mark)}</span>` +
      `<span>${renderSlotSeqHtml(it.body)}</span>` +
      `</span>`;
  }
  if (it.kind === "bigop") {
    return `<span class="mc-bigop" data-seq="${seq.id}" data-idx="${idx}">` +
      `<span class="mc-bigop-stack">` +
        `<span class="mc-bigop-sup">${renderSlotSeqHtml(it.sup)}</span>` +
        `<span class="mc-bigop-sym">${escHtml(it.sym)}</span>` +
        `<span class="mc-bigop-sub">${renderSlotSeqHtml(it.sub)}</span>` +
      `</span>` +
      `<span>${renderSlotSeqHtml(it.body)}</span>` +
      `</span>`;
  }
  return "";
}

function renderSlotSeqHtml(slotSeq) {
  const isFocused = (cursor.seqId === slotSeq.id);
  const isEmpty = (slotSeq.items.length === 0);
  const cls = ["mc-seq", "mc-slot"];
  if (isEmpty) cls.push("empty");
  if (isFocused) cls.push("focused-slot");
  const inner = renderItemsSliceHtml(slotSeq, 0, slotSeq.items.length);
  return `<span class="${cls.join(' ')}" data-slot-seq="${slotSeq.id}">${inner}</span>`;
}

// ================================================================
// 5. Japanese Sugar View Lens & Inferred Hypothesis Lookup
// ================================================================
function matchKeywordPrefix(items, kw) {
  const w = kw.trim();
  if (items.length < w.length) return false;
  for (let i = 0; i < w.length; i++) {
    if (items[i].kind !== "char" || items[i].ch !== w[i]) return false;
  }
  if (items.length > w.length) {
    const next = items[w.length];
    if (next.kind === "char" && /[A-Za-z0-9_']/.test(next.ch)) return false;
    if (next.kind === "sub" || next.kind === "sup") return false;
  }
  return true;
}

const BB_LATIN = { "ℕ": "N", "ℤ": "Z", "ℚ": "Q", "ℝ": "R", "ℂ": "C" };

function findCharIndexInItems(items, ch, fromIdx = 0) {
  let parenDepth = 0;
  for (let i = fromIdx; i < items.length; i++) {
    if (items[i].kind === "char") {
      if (items[i].ch === "(") parenDepth++;
      else if (items[i].ch === ")") parenDepth--;
      else if (parenDepth === 0 && items[i].ch === ch) return i;
    }
  }
  return -1;
}

function findSubstrIndexInItems(items, pat, fromIdx = 0) {
  for (let i = fromIdx; i + pat.length <= items.length; i++) {
    let ok = true;
    for (let k = 0; k < pat.length; k++) {
      if (items[i + k].kind !== "char" || items[i + k].ch !== pat[k]) { ok = false; break; }
    }
    if (ok) return i;
  }
  return -1;
}

// Look up the kernel-inferred hypothesis formula introduced on `lineNo` (1-indexed)
function getInferredFixHypFormula(lineNo, rootSeq) {
  if (!lastCheckData || !lastCheckData.decls) return "";
  const items = rootSeq.items;
  // 検査器が直し方を出していれば（仮定の中身・根拠が書かれていない など）それを使う
  for (const d of lastCheckData.decls) {
    if (d.error && d.error.line === lineNo && d.error.fix) return { append: d.error.fix };
  }
  // 古い書き方の警告：行ごと書き換える
  for (const d of lastCheckData.decls) {
    for (const w of (d.warnings || [])) {
      if (w.line === lineNo && w.replace !== null && w.replace !== undefined) return { replace: w.replace };
    }
  }
  if (!matchKeywordPrefix(items, "Fix ")) return "";
  const barIdx = findCharIndexInItems(items, "|", 4);
  if (barIdx < 0) return "";
  // If the user already wrote `: formula` after `| h`, no badge needed
  if (findCharIndexInItems(items, ":", barIdx + 1) >= 0) return "";

  for (const d of lastCheckData.decls) {
    const steps = d.steps || [];
    for (let idx = 0; idx < steps.length; idx++) {
      if (steps[idx].line === lineNo && idx + 1 < steps.length) {
        const curCtx = new Set(steps[idx].ctx || []);
        const nextCtx = steps[idx + 1].ctx || [];
        for (const entry of nextCtx) {
          if (!curCtx.has(entry) && entry.includes(" : ") && !entry.endsWith("(Fix)") && !entry.endsWith("(Obtain)")) {
            const colonPos = entry.indexOf(" : ");
            return { append: " : " + entry.substring(colonPos + 3) };
          }
        }
      }
    }
  }
  return "";
}

let pendingHypSuggestion = null;

function renderRootSeqWithLens(rootSeq, lineNo) {
  const items = rootSeq.items;
  const isCursorInKeywordPrefix = (kwLen) => (cursor.seqId === rootSeq.id && cursor.offset <= kwLen);
  const atLineEnd = cursor.seqId === rootSeq.id && cursor.offset === items.length;
  const suggestHyp = atLineEnd ? getInferredFixHypFormula(lineNo, rootSeq) : "";
  if (suggestHyp) pendingHypSuggestion = { seqId: rootSeq.id, ...suggestHyp };
  const badgeHtml = !suggestHyp ? "" : suggestHyp.replace !== undefined
    ? `<span class="mc-ghost">→ ${escHtml(suggestHyp.replace || "（この行を消す）")}<span class="mc-ghost-key">Tab</span></span>`
    : `<span class="mc-ghost">${escHtml(suggestHyp.append)}<span class="mc-ghost-key">Tab</span></span>`;

  if (!jpSugarLens) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">${renderItemsSliceHtml(rootSeq, 0, items.length)}${badgeHtml}</span>`;
  }

  if (matchKeywordPrefix(items, "thm ") && !isCursorInKeywordPrefix(4)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp" onclick="setCursor(${rootSeq.id}, 0)">定理</span>` +
      renderItemsSliceHtml(rootSeq, 4, items.length) +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "axiom ") && !isCursorInKeywordPrefix(6)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp" onclick="setCursor(${rootSeq.id}, 0)">公理</span>` +
      renderItemsSliceHtml(rootSeq, 6, items.length) +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "Fix ") && !isCursorInKeywordPrefix(4)) {
    const barIdx = findCharIndexInItems(items, "|", 4);
    if (barIdx > 4) {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        renderItemsSliceHtml(rootSeq, barIdx + 1, items.length) +
        `<span class="mc-kw-jp">を満たす</span>` +
        renderItemsSliceHtml(rootSeq, 4, barIdx) +
        `<span class="mc-kw-jp">を任意にとって固定する</span>` +
        `</span>`;
    } else {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        `<span class="mc-kw-jp">任意の</span>` +
        renderItemsSliceHtml(rootSeq, 4, items.length) +
        `<span class="mc-kw-jp">をとって固定する</span>` +
        `</span>`;
    }
  }
  if (matchKeywordPrefix(items, "assume ") && !isCursorInKeywordPrefix(7)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 7, items.length) +
      `<span class="mc-kw-jp">と仮定する</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "by_contra ") && !isCursorInKeywordPrefix(10)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp">背理法により</span>` +
      renderItemsSliceHtml(rootSeq, 10, items.length) +
      `<span class="mc-kw-jp">と仮定する</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "Obtain ") && !isCursorInKeywordPrefix(7)) {
    const colonIdx = findCharIndexInItems(items, ":", 7);
    if (colonIdx > 7) {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        renderItemsSliceHtml(rootSeq, colonIdx + 1, items.length) +
        `<span class="mc-kw-jp">より</span>` +
        renderItemsSliceHtml(rootSeq, 7, colonIdx) +
        `<span class="mc-kw-jp">が存在する</span>` +
        `</span>`;
    }
  }
  if (matchKeywordPrefix(items, "let ") && !isCursorInKeywordPrefix(4)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 4, items.length) +
      `<span class="mc-kw-jp">とおく</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "choose ") && !isCursorInKeywordPrefix(7)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 7, items.length) +
      `<span class="mc-kw-jp">をとればよい</span>` +
      `</span>`;
  }
  if (matchKeywordPrefix(items, "have ") && !isCursorInKeywordPrefix(5)) {
    const defIdx = findSubstrIndexInItems(items, ":=", 5);
    if (defIdx > 5) {
      return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
        renderItemsSliceHtml(rootSeq, defIdx + 2, items.length) +
        `<span class="mc-kw-jp">より</span>` +
        renderItemsSliceHtml(rootSeq, 5, defIdx) +
        `<span class="mc-kw-jp">が成り立つ</span>` +
        `</span>`;
    }
  }
  if (items.length > 0 && items[0].kind === "sym" && items[0].ascii === "therefore" && !(cursor.seqId === rootSeq.id && cursor.offset === 0)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      `<span class="mc-kw-jp">したがって</span>` +
      renderItemsSliceHtml(rootSeq, 1, items.length) +
      `</span>`;
  }
  const byIdx = findSubstrIndexInItems(items, " by ", 0);
  if (byIdx > 0 && !(cursor.seqId === rootSeq.id && cursor.offset >= byIdx && cursor.offset <= byIdx + 4)) {
    return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">` +
      renderItemsSliceHtml(rootSeq, 0, byIdx) +
      `<span class="mc-kw-jp" style="margin-left:12px;">(∵</span>` +
      renderItemsSliceHtml(rootSeq, byIdx + 4, items.length) +
      `<span class="mc-kw-jp">)</span>` +
      `</span>`;
  }

  return `<span class="mc-seq" data-slot-seq="${rootSeq.id}">${renderItemsSliceHtml(rootSeq, 0, items.length)}${badgeHtml}</span>`;
}
</script>
<script>
// ================================================================
// 5b. Selection, Clipboard, Undo / Redo
// ================================================================
//
// 選択は「起点 selAnchor」と「終点 cursor」の2点で持つ。2点が同じ行にあれば、共通の親 Seq の
// 中の範囲 [from, to) になる（分数のスロットの中と外にまたがるときは、分数ノードごと選ぶ）。
// 違う行にあれば、行をまたぐ範囲になる。

let selAnchor = null;     // { seqId, offset }
let extendingSel = false; // true の間は setCursor が選択を解除しない
let dragStart = null;     // マウスドラッグの起点
let selHL = new Map();    // 描画用：seqId → [from, to)
let declNames = new Set();// thm / axiom / def で宣言された名前（立体で描く）

function collectDeclNames() {
  const names = new Set();
  for (const ln of docLines) {
    let t = "";
    for (const it of ln.rootSeq.items) {
      if (it.kind !== "char") break;
      t += it.ch;
      if (t.length > 80) break;
    }
    const m = t.match(/^(?:thm|axiom|def)\s+([A-Za-z_][A-Za-z0-9_.']*)/);
    if (m) names.add(m[1]);
  }
  return names;
}

function seqChain(seq) {
  const chain = [seq];
  let c = seq;
  while (c.parentNode && c.parentNode.parentSeq) {
    c = c.parentNode.parentSeq;
    chain.push(c);
  }
  return chain;
}

// pos を祖先 Seq（target）の中の位置に持ち上げる。ノードの中から出るときは、そのノードの手前になる。
function liftTo(pos, target) {
  let seq = seqMap.get(pos.seqId);
  let off = pos.offset, viaNode = false;
  while (seq && seq !== target) {
    const node = seq.parentNode;
    if (!node || !node.parentSeq) return null;
    off = node.parentSeq.items.indexOf(node);
    viaNode = true;
    seq = node.parentSeq;
  }
  return seq ? { off, viaNode } : null;
}

function normalizeSel() {
  if (!selAnchor) return null;
  const sa = seqMap.get(selAnchor.seqId), sh = seqMap.get(cursor.seqId);
  if (!sa || !sh) return null;
  const cur = { seqId: cursor.seqId, offset: cursor.offset };
  const ra = getRootSeq(sa), rh = getRootSeq(sh);
  if (ra === rh) {
    const inH = new Set(seqChain(sh));
    const common = seqChain(sa).find(x => inH.has(x));
    const la = liftTo(selAnchor, common), lh = liftTo(cur, common);
    if (!la || !lh) return null;
    if (la.off === lh.off && !la.viaNode && !lh.viaNode) return null;
    if (la.off === lh.off) return { mode: "seq", seq: common, from: la.off, to: la.off + 1 };
    const [lo, hi] = la.off < lh.off ? [la, lh] : [lh, la];
    return { mode: "seq", seq: common, from: lo.off, to: hi.viaNode ? hi.off + 1 : hi.off };
  }
  const ia = docLines.findIndex(l => l.rootSeq === ra);
  const ih = docLines.findIndex(l => l.rootSeq === rh);
  if (ia < 0 || ih < 0) return null;
  const [a, b] = ia < ih ? [{ pos: selAnchor, line: ia }, { pos: cur, line: ih }] : [{ pos: cur, line: ih }, { pos: selAnchor, line: ia }];
  const lf = liftTo(a.pos, docLines[a.line].rootSeq), ll = liftTo(b.pos, docLines[b.line].rootSeq);
  if (!lf || !ll) return null;
  return { mode: "lines", l1: a.line, o1: lf.off, l2: b.line, o2: ll.viaNode ? ll.off + 1 : ll.off };
}

function selHighlights() {
  const m = new Map();
  const s = normalizeSel();
  if (!s) return m;
  if (s.mode === "seq") {
    m.set(s.seq.id, [s.from, s.to]);
  } else {
    for (let l = s.l1; l <= s.l2; l++) {
      const r = docLines[l].rootSeq;
      m.set(r.id, [l === s.l1 ? s.o1 : 0, l === s.l2 ? s.o2 : r.items.length]);
    }
  }
  return m;
}

function selectionText() {
  const s = normalizeSel();
  if (!s) return "";
  const ser = (items) => serializeSeqToAscii({ items });
  if (s.mode === "seq") return ser(s.seq.items.slice(s.from, s.to));
  const out = [];
  for (let l = s.l1; l <= s.l2; l++) {
    const ln = docLines[l], items = ln.rootSeq.items;
    const from = l === s.l1 ? s.o1 : 0, to = l === s.l2 ? s.o2 : items.length;
    // 行頭から選んでいるときだけ字下げも含める（途中から選んだ最初の行は字下げなし）
    const pad = (l === s.l1 && from > 0) ? "" : "  ".repeat(ln.indent);
    out.push(pad + ser(items.slice(from, to)));
  }
  return out.join("\n");
}

// 選択を消す。消すものがあったら true
function deleteSelection() {
  const s = normalizeSel();
  selAnchor = null;
  if (!s) return false;
  if (s.mode === "seq") {
    s.seq.items.splice(s.from, s.to - s.from);
    cursor.lineIdx = docLines.findIndex(l => l.rootSeq === getRootSeq(s.seq));
    cursor.seqId = s.seq.id;
    cursor.offset = s.from;
  } else {
    const a = docLines[s.l1].rootSeq, b = docLines[s.l2].rootSeq;
    const tail = b.items.slice(s.o2);
    for (const it of tail) it.parentSeq = a;
    a.items.splice(s.o1, a.items.length - s.o1, ...tail);
    docLines.splice(s.l1 + 1, s.l2 - s.l1);
    cursor.lineIdx = s.l1;
    cursor.seqId = a.id;
    cursor.offset = s.o1;
  }
  return true;
}

function selectAll() {
  const first = docLines[0].rootSeq, last = docLines[docLines.length - 1].rootSeq;
  selAnchor = { seqId: first.id, offset: 0 };
  extendingSel = true;
  setCursor(last.id, last.items.length, docLines.length - 1);
  extendingSel = false;
}

function pasteText(text) {
  text = text.replace(/\r\n?/g, "\n").replace(/\t/g, "    ");
  deleteSelection();
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  const root = getRootSeq(seq);
  const lines = text.split("\n");
  const items = (str, owner) => {
    const its = parseAsciiToItems(str);
    for (const it of its) it.parentSeq = owner;
    return its;
  };
  if (lines.length === 1 || seq !== root) {
    // 1行、または数式のスロットの中への貼り付け：1行にまとめて挿入する
    const flat = lines.length === 1 ? text : lines.map(l => l.trim()).filter(Boolean).join(" ");
    const its = items(flat, seq);
    seq.items.splice(cursor.offset, 0, ...its);
    cursor.offset += its.length;
    return;
  }
  const indentOf = (l) => Math.floor(l.match(/^ */)[0].length / 2);
  const base = indentOf(lines[0]);
  const here = docLines[cursor.lineIdx];
  const tail = root.items.splice(cursor.offset);
  root.items.push(...items(lines[0].trim(), root));
  let last = root, at = cursor.lineIdx;
  for (let k = 1; k < lines.length; k++) {
    const ns = createSeq(parseAsciiToItems(lines[k].trim()), null, "root");
    docLines.splice(++at, 0, { indent: Math.max(0, here.indent + indentOf(lines[k]) - base), rootSeq: ns });
    last = ns;
  }
  cursor.lineIdx = at;
  cursor.seqId = last.id;
  cursor.offset = last.items.length;
  for (const it of tail) it.parentSeq = last;
  last.items.push(...tail);
}

// ---- 単語：名前（英数字・_・.・'）とそれに付いた添字・上付きを 1 つのまとまりとする。
// 分数・絶対値などの入力欄や記号（≤ など）は、それだけで 1 つ。空白は区切り。
function itemClass(it) {
  if (!it) return "";
  if (it.kind === "char") {
    if (it.ch === " ") return "s";
    return /[A-Za-z0-9_'.]/.test(it.ch) ? "w" : "p";
  }
  if (it.kind === "sub" || it.kind === "sup") return "w";
  if (it.kind === "sym") return /^[α-ωΑ-Ω]$/.test(it.display) ? "w" : "p";
  return "n";
}

// offset の位置の単語の範囲 [from, to)
function wordRangeAt(seq, offset) {
  const items = seq.items;
  let k = offset < items.length ? offset : offset - 1;
  if (k < 0) return [offset, offset];
  // 空白の上なら左の単語
  if (itemClass(items[k]) === "s" && k > 0 && itemClass(items[k - 1]) !== "s") k--;
  const c = itemClass(items[k]);
  if (c !== "w" && c !== "s") return [k, k + 1];
  let a = k, b = k + 1;
  while (a > 0 && itemClass(items[a - 1]) === c) a--;
  while (b < items.length && itemClass(items[b]) === c) b++;
  return [a, b];
}

function moveWordRight() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  const items = seq.items;
  let o = cursor.offset;
  if (o >= items.length) { moveCursorRight(); return; }
  while (o < items.length && itemClass(items[o]) === "s") o++;
  if (o < items.length) {
    const c = itemClass(items[o]);
    if (c === "w") { while (o < items.length && itemClass(items[o]) === "w") o++; }
    else o++;
  }
  setCursor(seq.id, o);
}

function moveWordLeft() {
  const seq = seqMap.get(cursor.seqId);
  if (!seq) return;
  const items = seq.items;
  let o = cursor.offset;
  if (o <= 0) { moveCursorLeft(); return; }
  while (o > 0 && itemClass(items[o - 1]) === "s") o--;
  if (o > 0) {
    const c = itemClass(items[o - 1]);
    if (c === "w") { while (o > 0 && itemClass(items[o - 1]) === "w") o--; }
    else o--;
  }
  setCursor(seq.id, o);
}

function moveLineEdge(toEnd) {
  const root = docLines[cursor.lineIdx].rootSeq;
  setCursor(root.id, toEnd ? root.items.length : 0, cursor.lineIdx);
}

// 選択を伸ばしながら（shift）、または選択を畳みながらカーソルを動かす
function moveWithSelection(fn, key, shift) {
  if (shift) {
    if (!selAnchor) selAnchor = { seqId: cursor.seqId, offset: cursor.offset };
    extendingSel = true;
    try { fn(); } finally { extendingSel = false; }
    return;
  }
  const s = normalizeSel();
  if (s && (key === "ArrowLeft" || key === "ArrowRight")) {
    const toEnd = key === "ArrowRight";
    selAnchor = null;
    if (s.mode === "seq") {
      setCursor(s.seq.id, toEnd ? s.to : s.from);
    } else {
      const l = toEnd ? s.l2 : s.l1;
      setCursor(docLines[l].rootSeq.id, toEnd ? s.o2 : s.o1, l);
    }
    return;
  }
  selAnchor = null;
  fn();
}

// ---- 元に戻す・やり直す
// 文書の構造（ASCII ではなく AST）をそのまま複製して持つ。ASCII 経由だと空のスロットが
// 「1」に化けるなど、編集途中の状態が戻らないため。

let history = [], histIdx = -1, histTime = 0;

function cloneItem(it) {
  const o = {};
  for (const k of Object.keys(it)) {
    if (k === "parentSeq") continue;
    const v = it[k];
    o[k] = (v && typeof v === "object" && Array.isArray(v.items)) ? { items: v.items.map(cloneItem) } : v;
  }
  return o;
}

function reviveItem(o) {
  const it = {};
  const slots = [];
  for (const k of Object.keys(o)) {
    const v = o[k];
    if (v && typeof v === "object" && Array.isArray(v.items)) slots.push(k);
    else it[k] = v;
  }
  for (const k of slots) it[k] = createSeq(o[k].items.map(reviveItem), it, k);
  return it;
}

function seqPath(seq) {
  const path = [];
  let c = seq;
  while (c.parentNode && c.parentNode.parentSeq) {
    const node = c.parentNode;
    path.unshift([node.parentSeq.items.indexOf(node), c.slotName]);
    c = node.parentSeq;
  }
  return path;
}

function seqFromPath(root, path) {
  let s = root;
  for (const [i, slot] of path) {
    const node = s.items[i];
    if (!node || !node[slot]) return s;
    s = node[slot];
  }
  return s;
}

function snapshotDoc() {
  return {
    lines: docLines.map(l => ({ indent: l.indent, items: l.rootSeq.items.map(cloneItem) })),
    cur: { lineIdx: cursor.lineIdx, path: seqPath(seqMap.get(cursor.seqId)), offset: cursor.offset }
  };
}

function restoreSnapshot(s) {
  seqMap.clear();
  nextSeqId = 1;
  docLines = s.lines.map(l => ({ indent: l.indent, rootSeq: createSeq(l.items.map(reviveItem), null, "root") }));
  const li = Math.min(s.cur.lineIdx, docLines.length - 1);
  const seq = seqFromPath(docLines[li].rootSeq, s.cur.path);
  cursor = { lineIdx: li, seqId: seq.id, offset: Math.min(s.cur.offset, seq.items.length) };
  selAnchor = null;
}

function resetHistory() {
  history = [snapshotDoc()];
  histIdx = 0;
  histTime = 0;
}

// 編集のたびに呼ぶ。続けて打っている間（0.6秒以内）は1つの履歴にまとめる。
function pushHistory() {
  const snap = snapshotDoc(), now = Date.now();
  history.length = histIdx + 1;
  if (histIdx > 0 && now - histTime < 600) {
    history[histIdx] = snap;
  } else {
    history.push(snap);
    histIdx = history.length - 1;
  }
  histTime = now;
  if (history.length > 300) { history.shift(); histIdx--; }
}

function undoDoc(delta) {
  const ni = histIdx + delta;
  if (ni < 0 || ni >= history.length) return;
  histIdx = ni;
  histTime = 0;
  restoreSnapshot(history[ni]);
  acMatches = [];
  refreshAfterEdit();
  renderGoalInspector();
}

// ================================================================
// 6. Editor Rendering & Interactive Key Handling
// ================================================================

const editorSurface = document.getElementById("editorSurface");
const acPopup = document.getElementById("acPopup");

function renderEditor() {
  pendingHypSuggestion = null;
  declNames = collectDeclNames();
  selHL = selHighlights();
  const errLines = new Set();
  const sorryLines = new Set();
  const warnLines = new Set();
  if (lastCheckData) {
    if (lastCheckData.parse_error && lastCheckData.parse_error.line) {
      errLines.add(lastCheckData.parse_error.line);
    }
    for (const d of (lastCheckData.decls || [])) {
      for (const w of (d.warnings || [])) warnLines.add(w.line);
      if (d.error && d.error.line) errLines.add(d.error.line);
      for (const sr of (d.sorries || [])) {
        if (sr.line) sorryLines.add(sr.line);
      }
    }
  }

  // ブロック（Fix・assume など）の終わりに、そのブロックで示したことを薄く出す（表示だけ。ファイルには入らない）
  const thereforeAfter = new Map();
  if (lastCheckData) {
    const stepAt = new Map();
    for (const d of (lastCheckData.decls || [])) for (const st of (d.steps || [])) if (!stepAt.has(st.line)) stepAt.set(st.line, st);
    const text = (j) => serializeSeqToAscii(docLines[j].rootSeq).trim();
    for (let j = 0; j < docLines.length; j++) {
      if (!/^(Fix|assume|by_contra|cases|induction)\b/.test(text(j))) continue;
      const st = stepAt.get(j + 1);
      if (!st || !st.goal_latex) continue;
      const base = docLines[j].indent;
      let k = j + 1, last = j;
      while (k < docLines.length && (docLines[k].indent > base || text(k) === "")) {
        if (text(k) !== "") last = k;
        k++;
      }
      if (last - j < 2) continue;
      if (k < docLines.length && /^(∴|therefore)/.test(text(k))) continue;
      if (!thereforeAfter.has(last)) thereforeAfter.set(last, []);
      thereforeAfter.get(last).push({ indent: base, latex: st.goal_latex });
    }
  }

  let html = "";
  for (let i = 0; i < docLines.length; i++) {
    const lineNo = i + 1;
    const ln = docLines[i];
    const cls = ["mc-line"];
    if (i === cursor.lineIdx) cls.push("active");
    if (errLines.has(lineNo)) cls.push("has-err");
    else if (sorryLines.has(lineNo)) cls.push("has-sorry");
    else if (warnLines.has(lineNo)) cls.push("has-warn");

    let guides = "";
    for (let g = 0; g < ln.indent; g++) {
      guides += `<span class="mc-indent-guide"></span>`;
    }

    html += `<div class="${cls.join(' ')}" data-line-idx="${i}">` +
      `<div class="mc-gutter">${lineNo}</div>` +
      `<div class="mc-indent-guides">${guides}</div>` +
      `<div class="mc-content" data-line-idx="${i}">${renderRootSeqWithLens(ln.rootSeq, lineNo)}</div>` +
      `</div>`;
    for (const g of (thereforeAfter.get(i) || []).reverse()) {
      html += `<div class="mc-line mc-therefore" title="このブロックで示したこと（表示だけ）"><div class="mc-gutter"></div>` +
        `<div class="mc-indent-guides">${'<span class="mc-indent-guide"></span>'.repeat(g.indent)}</div>` +
        `<div class="mc-content">∴ ${renderKatex(g.latex, false)}</div></div>`;
    }
  }
  editorSurface.innerHTML = html;
  document.getElementById("curLineLabel").textContent = `Ln ${cursor.lineIdx + 1}`;
