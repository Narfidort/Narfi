# Cloudflare Pages の設定（Web 版：narfi.pages.dev）
# database_id は CI（scripts/cloud-setup.sh）が実際の ID に置き換える。ローカルの wrangler pages dev ではこのままでよい
name = "narfi"
pages_build_output_dir = "site"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "narfi"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
